<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Audio-Reactive Membrane - Fixed</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400&display=swap" crossorigin="anonymous">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0e27; /* midnight alaska */
            color: #00e5ff; /* intense cyan */
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            overflow: hidden;
            height: 100vh;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Tile Control System - Free Floating */
        #controls-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 100;
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #controls-container.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .control-tile {
            position: absolute;
            background: rgba(10, 14, 39, 0.6);
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 8px;
            padding: 8px;
            transition: border-color 0.2s ease, background 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            pointer-events: auto;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        .control-tile:hover {
            border-color: rgba(0, 229, 255, 0.5);
            background: rgba(10, 14, 39, 0.8);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
        }

        .control-tile.dragging {
            opacity: 0.7;
            border-color: rgba(0, 229, 255, 0.8) !important;
            cursor: move;
        }

        /* Keyboard keys */
        .white-key.key-active {
            background: linear-gradient(to bottom, #00e5ff, #008fa0) !important;
        }
        .black-key.key-active {
            background: linear-gradient(to bottom, #00b8d4, #006070) !important;
        }

        .param-visual {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tile-label {
            position: absolute;
            bottom: -18px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 9px;
            color: #00e5ff;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tile-label.visible {
            opacity: 0.8;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00e5ff;
            font-size: 18px;
            z-index: 200;
        }

        /* Slider Inspector Panel */
        #slider-inspector {
            display: none;
            position: fixed;
            z-index: 500;
            background: rgba(8, 12, 32, 0.96);
            border: 1px solid rgba(0, 229, 255, 0.4);
            border-radius: 10px;
            padding: 0;
            width: 280px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 229, 255, 0.1);
            backdrop-filter: blur(20px);
            font-family: 'JetBrains Mono', monospace;
            color: #00e5ff;
            user-select: none;
        }
        #slider-inspector.visible { display: block; }

        #inspector-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px 8px;
            border-bottom: 1px solid rgba(0, 229, 255, 0.15);
            cursor: move;
        }
        #inspector-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #00e5ff;
            font-weight: 400;
        }
        #inspector-close {
            background: none;
            border: none;
            color: rgba(0, 229, 255, 0.5);
            cursor: pointer;
            font-size: 16px;
            padding: 0;
            line-height: 1;
        }
        #inspector-close:hover { color: #00e5ff; }

        #inspector-body { padding: 14px; }

        .inspector-row {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            gap: 8px;
        }
        .inspector-label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(0, 229, 255, 0.5);
            width: 32px;
            flex-shrink: 0;
        }
        .inspector-value-input {
            background: rgba(0, 229, 255, 0.07);
            border: 1px solid rgba(0, 229, 255, 0.25);
            border-radius: 4px;
            color: #00e5ff;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            padding: 4px 8px;
            width: 100%;
            outline: none;
        }
        .inspector-value-input:focus {
            border-color: rgba(0, 229, 255, 0.6);
            background: rgba(0, 229, 255, 0.12);
        }
        .inspector-value-input.small { width: 80px; }

        #inspector-big-slider-track {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: rgba(0, 229, 255, 0.15);
            position: relative;
            cursor: pointer;
            margin: 4px 0 12px;
        }
        #inspector-big-slider-fill {
            height: 100%;
            border-radius: 4px;
            position: absolute;
            left: 0; top: 0;
            pointer-events: none;
        }
        #inspector-big-slider-thumb {
            position: absolute;
            width: 18px; height: 18px;
            border-radius: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            box-shadow: 0 0 12px currentColor;
        }
        #inspector-reset {
            background: rgba(0, 229, 255, 0.08);
            border: 1px solid rgba(0, 229, 255, 0.2);
            border-radius: 4px;
            color: rgba(0, 229, 255, 0.6);
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 5px 10px;
            cursor: pointer;
            width: 100%;
        }
        #inspector-reset:hover {
            background: rgba(0, 229, 255, 0.15);
            color: #00e5ff;
        }
    </style>
</head>
<body>
    <div id="loading">Loading Three.js...</div>
    <div id="canvas-container"></div>

    <!-- Slider Inspector Panel -->
    <div id="slider-inspector">
        <div id="inspector-header">
            <span id="inspector-title">Parameter</span>
            <button id="inspector-close">×</button>
        </div>
        <div id="inspector-body">
            <div id="inspector-big-slider-track">
                <div id="inspector-big-slider-fill"></div>
                <div id="inspector-big-slider-thumb"></div>
            </div>
            <div class="inspector-row">
                <span class="inspector-label">val</span>
                <input id="inspector-val-input" class="inspector-value-input" type="number" step="any">
            </div>
            <div class="inspector-row">
                <span class="inspector-label">min</span>
                <input id="inspector-min-input" class="inspector-value-input" type="number" step="any">
                <span class="inspector-label" style="width:24px;text-align:center">max</span>
                <input id="inspector-max-input" class="inspector-value-input" type="number" step="any">
            </div>
            <button id="inspector-reset">reset to default</button>
        </div>
    </div>

    <!-- Tile-based control panel -->
    <div id="controls-container">
        <!-- Tiles will be created dynamically by JavaScript -->
        <div id="version-label" style="
            position: fixed; top: 8px; right: 8px;
            padding: 4px 8px; border-radius: 4px;
            background: rgba(10, 14, 39, 0.6); border: 1px solid rgba(0, 229, 255, 0.15);
            font: 10px 'JetBrains Mono', monospace; color: rgba(255,255,255,0.4);
            pointer-events: none; user-select: none; z-index: 10000;
        ">v0.4.0-worklet-physics</div>
    </div>

    <!-- Load Three.js from local -->
    <script src="three.min.js"></script>
    <script src="OrbitControls.js"></script>
    <script src="src/visual/renderer.js"></script>
    <script src="src/core/actor-manager.js"></script>
    <script src="src/audio/source-manager.js"></script>

    <!-- Load D3.js for UI controls -->
    <script src="https://d3js.org/d3.v7.min.js" crossorigin="anonymous"></script>

    <script src="stats.min.js"></script>
    <script src="membrane-physics-core.js"></script>
    <script src="src/audio/membrane-worklet-node.js"></script>
    <script src="src/audio/MicrophoneInput.js"></script>
    <script src="src/schema/SchemaParser.js"></script>
    <script src="src/visual/MappingCurveEngine.js"></script>
    <script type="module">
        import { paramBus } from './src/core/param-bus.js';
        window.paramBus = paramBus;
    </script>
    <script>
        // Hide loading once Three.js loads
        document.getElementById('loading').style.display = 'none';

        // Initialize Mapping Engine
        const parser = new SchemaParser();
        let mapper = null;

        // Load default session for visual mappings
        (async () => {
            try {
                const session = await parser.loadSession('default-session.json');
                mapper = new MappingCurveEngine(session);
                console.log("🎨 Visual Engine Loaded");
            } catch (e) {
                console.warn("Using default visual mappings", e);
                mapper = new MappingCurveEngine({});
            }
        })();

        // Scene setup — delegated to renderer module
        const { scene, camera, renderer, controls, membrane, material } =
            window._renderer.init(document.getElementById('canvas-container'));

        // Membrane grid constants (used by physics, actuators, collectors)
        let gridSize = 100;
        const membraneSize = 200;

        // Actor manager will be initialized after physics is set up
        let actorManager = null;

        // Performance monitor (press P to toggle)
        const stats = new Stats();
        stats.domElement.style.cssText = 'position:fixed;bottom:0;left:0;cursor:pointer;opacity:0.9;z-index:10000;display:none;transform:scale(2);transform-origin:bottom left;';
        document.body.appendChild(stats.domElement);
        let statsVisible = false;

        // Perf log — captures frame time spikes, dump with Shift+P
        const perfLog = { frames: [], spikes: [], startTime: performance.now() };
        function logFrame(dt) {
            perfLog.frames.push(dt);
            if (perfLog.frames.length > 600) perfLog.frames.shift(); // keep last 10s at 60fps
            if (dt > 33) perfLog.spikes.push({ time: (performance.now() - perfLog.startTime) / 1000, dt: dt.toFixed(1) });
            if (perfLog.spikes.length > 100) perfLog.spikes.shift();
        }
        let lastFrameTime = performance.now();

        document.addEventListener('keydown', (e) => {
            if (e.key === 'p' && !e.shiftKey) {
                statsVisible = !statsVisible;
                stats.domElement.style.display = statsVisible ? 'block' : 'none';
            }
            if (e.key === 'P' && e.shiftKey) {
                // Dump perf report to console
                const avg = perfLog.frames.reduce((a, b) => a + b, 0) / perfLog.frames.length;
                const max = Math.max(...perfLog.frames);
                const min = Math.min(...perfLog.frames);
                console.log('=== PERF REPORT ===');
                console.log(`Frames sampled: ${perfLog.frames.length}`);
                console.log(`Avg frame: ${avg.toFixed(1)}ms (${(1000/avg).toFixed(0)} FPS)`);
                console.log(`Min: ${min.toFixed(1)}ms  Max: ${max.toFixed(1)}ms`);
                console.log(`Spikes (>33ms): ${perfLog.spikes.length}`);
                if (perfLog.spikes.length > 0) {
                    console.log('Recent spikes:', perfLog.spikes.slice(-10));
                }
                console.log(`Grid: ${gridSize}x${gridSize}, Actuators: ${actorManager ? actorManager.getActuators().length : 0}, Collectors: ${actorManager ? actorManager.getCollectors().length : 0}`);
                console.log('===================');
            }
        });

        // Physics Engine Integration
        const physics = new MembranePhysics({
            gridSize: gridSize,
            membraneSize: membraneSize,
            waveSpeed: 0.0123,
            damping: 0.000148,
            boundaryType: 'fixed'
        });

        // ── AudioWorklet Physics ──────────────────────────────────────
        // When active, the worklet owns the physics simulation at audio rate.
        // Main thread only reads height snapshots for rendering.
        let membraneWorklet = null;
        let workletSnapshot = null; // Float32Array from worklet, flat layout
        let workletGridSize = 24;   // Reduced from 32 for GPU efficiency; GPU upsamples for visuals

        /**
         * Initialize the AudioWorklet physics engine.
         * Call once after audioContext exists.
         */
        async function initWorklet() {
            if (membraneWorklet) return;
            if (!audioContext) return;

            try {
                membraneWorklet = new MembraneWorkletNode(audioContext, {
                    gridSize: workletGridSize,
                    waveSpeed: window.paramBus ? window.paramBus.get('membrane_wave_speed') : Number(window.waveSpeed),
                    damping: window.paramBus ? window.paramBus.get('membrane_damping') : Number(window.damping),
                    actuatorGain: window.paramBus ? window.paramBus.get('membrane_actuator_gain') : Number(window.actuatorGain),
                    boundaryType: 'fixed',
                    collectorCount: 2
                });

                await membraneWorklet.init();

                // Receive height snapshots for rendering
                membraneWorklet.onSnapshot = (snapshot) => {
                    workletSnapshot = snapshot;
                };

                // Sync initial actuator/collector state to worklet
                // (manager also syncs on add/remove, but we need the initial state)
                actorManager.syncActuatorsToWorklet();
                actorManager.syncCollectorsToWorklet();

                // Match snapshot rate to actual display refresh rate
                membraneWorklet.syncToDisplayRate();

                console.log(`AudioWorklet physics initialized (${workletGridSize}x${workletGridSize} grid at ${audioContext.sampleRate}Hz)`);
            } catch (err) {
                console.error('AudioWorklet init failed, falling back to main-thread physics:', err);
                membraneWorklet = null;
            }
        }

        // Initialize UI variables on window for D3 binding
        window.waveSpeed = physics.waveSpeed;
        window.damping = physics.damping;
        window.actuatorGain = 15.0; // Use window directly for gain

        function initializeArrays() {
            physics.initializeArrays();
        }

        // Source manager — owns audio sources, analysers, audioContext lifecycle
        let sourceManager = null;

        // Waveform visualizer state
        let visualizerAnimationId = null;

        // Audio output for collectors
        let outputContext = null;
        let outputProcessor = null;
        let audioOutputEnabled = false;

        // Initialize source manager first — audio sources, analysers, audioContext
        sourceManager = window._sourceManager.init({
            updateToggleStates: updateToggleStates,
            getWorklet: () => membraneWorklet
        });

        // Initialize actor manager (now that sourceManager is ready)
        actorManager = window._actorManager.init(
            scene,
            camera,
            membrane,
            physics,
            {
                updateMiniMembrane: updateMiniMembrane,
                mapper: mapper,
                gridSize: gridSize,
                membraneSize: membraneSize,
                getWorklet: () => membraneWorklet,
                getSourceManager: () => sourceManager
            }
        );

        // Attach click listener to renderer
        renderer.domElement.addEventListener('click', (event) => {
            actorManager.handleClick(event);
        });

        // Helper functions for membrane operations
        function resetMembrane() {
            initializeArrays();
            if (membraneWorklet) membraneWorklet.reset();
        }

        // Toggle wireframe — one job
        function toggleWireframe() {
            material.wireframe = !material.wireframe;
            updateToggleStates();
        }

        // Freeze/unfreeze physics — saves waveSpeed and sets it to 0
        let physicsFrozen = false;
        let frozenWaveSpeed = null;
        window.freezePhysics = function() {
            physicsFrozen = !physicsFrozen;
            if (physicsFrozen) {
                frozenWaveSpeed = window.paramBus
                    ? window.paramBus.get('membrane_wave_speed')
                    : Number(window.waveSpeed);
                if (window.paramBus) {
                    window.paramBus.set('membrane_wave_speed', 0);
                } else {
                    window.waveSpeed = 0;
                    if (membraneWorklet) membraneWorklet.setWaveSpeed(0);
                }
            } else {
                const restoreSpeed = frozenWaveSpeed || 0.3;
                if (window.paramBus) {
                    window.paramBus.set('membrane_wave_speed', restoreSpeed);
                } else {
                    window.waveSpeed = restoreSpeed;
                    if (membraneWorklet) membraneWorklet.setWaveSpeed(restoreSpeed);
                }
            }
            updateToggleStates();
        };

        /**
         * Export current membrane heightmap as grayscale PNG.
         * Maps displacement values to 0-255 range (128 = rest, 0 = min, 255 = max).
         * Returns the canvas for further use; also triggers download.
         */
        window.exportHeightmap = function(download = true) {
            const snapshot = workletSnapshot;
            if (!snapshot) {
                console.warn('No snapshot available to export');
                return null;
            }

            const ws = workletGridSize;
            const wStride = ws + 1;
            const size = wStride;

            // Find value range for normalization
            let minVal = Infinity, maxVal = -Infinity;
            for (let k = 0; k < snapshot.length; k++) {
                if (snapshot[k] < minVal) minVal = snapshot[k];
                if (snapshot[k] > maxVal) maxVal = snapshot[k];
            }
            const range = Math.max(Math.abs(minVal), Math.abs(maxVal)) || 1;

            // Render to canvas — grayscale, 128 = zero/rest
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx2d = canvas.getContext('2d');
            const imageData = ctx2d.createImageData(size, size);
            const data = imageData.data;

            for (let i = 0; i < size; i++) {
                for (let j = 0; j < size; j++) {
                    const h = snapshot[i * wStride + j];
                    // Symmetric mapping: -range → 0, 0 → 128, +range → 255
                    const byte = Math.max(0, Math.min(255, Math.round(128 + (h / range) * 127)));
                    const px = (i * size + j) * 4;
                    data[px] = byte;     // R
                    data[px + 1] = byte; // G
                    data[px + 2] = byte; // B
                    data[px + 3] = 255;  // A
                }
            }
            ctx2d.putImageData(imageData, 0, 0);

            if (download) {
                const link = document.createElement('a');
                link.download = `brane-heightmap-${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                console.log(`Exported heightmap ${size}×${size} (range: ±${range.toFixed(3)})`);
            }

            return canvas;
        };

        /**
         * Export heightmap and send to ComfyUI on lumen for img2img generation.
         * Uploads the PNG via ComfyUI's /upload/image endpoint, then queues
         * an img2img workflow using stock nodes only.
         *
         * @param {string} prompt - Text prompt for the diffusion model
         * @param {number} denoise - Denoising strength (0 = keep heightmap, 1 = ignore it)
         * @param {string} checkpoint - Model checkpoint filename
         */
        window.exportToComfy = async function(
            prompt = 'organic alien landscape, cinematic lighting, detailed',
            denoise = 0.55,
            checkpoint = 'sd_xl_base_1.0.safetensors'
        ) {
            const snapshot = workletSnapshot;
            if (!snapshot) { console.warn('No snapshot available'); return; }

            const canvas = window.exportHeightmap(false);
            if (!canvas) return;

            // Upscale to 1024x1024 for SDXL
            const upscaled = document.createElement('canvas');
            upscaled.width = 1024;
            upscaled.height = 1024;
            const uctx = upscaled.getContext('2d');
            uctx.imageSmoothingEnabled = true;
            uctx.drawImage(canvas, 0, 0, 1024, 1024);

            // Convert canvas to blob for upload
            const blob = await new Promise(r => upscaled.toBlob(r, 'image/png'));
            const filename = `brane_heightmap_${Date.now()}.png`;

            // 1. Upload to ComfyUI input directory
            const formData = new FormData();
            formData.append('image', blob, filename);
            formData.append('overwrite', 'true');

            const COMFY = 'http://192.168.1.3:8188';

            try {
                const uploadResp = await fetch(`${COMFY}/upload/image`, {
                    method: 'POST', body: formData
                });
                const uploadResult = await uploadResp.json();
                console.log('Heightmap uploaded:', uploadResult.name);

                // 2. Queue img2img workflow using stock nodes
                const workflow = {
                    "1": {
                        "class_type": "LoadImage",
                        "inputs": { "image": uploadResult.name }
                    },
                    "2": {
                        "class_type": "CheckpointLoaderSimple",
                        "inputs": { "ckpt_name": checkpoint }
                    },
                    "3": {
                        "class_type": "CLIPTextEncode",
                        "inputs": { "text": prompt, "clip": ["2", 1] }
                    },
                    "4": {
                        "class_type": "CLIPTextEncode",
                        "inputs": {
                            "text": "blurry, ugly, deformed, text, watermark",
                            "clip": ["2", 1]
                        }
                    },
                    "5": {
                        "class_type": "VAEEncode",
                        "inputs": { "pixels": ["1", 0], "vae": ["2", 2] }
                    },
                    "6": {
                        "class_type": "KSampler",
                        "inputs": {
                            "model": ["2", 0],
                            "positive": ["3", 0],
                            "negative": ["4", 0],
                            "latent_image": ["5", 0],
                            "seed": Math.floor(Math.random() * 2**32),
                            "steps": 25,
                            "cfg": 7.0,
                            "sampler_name": "euler_ancestral",
                            "scheduler": "normal",
                            "denoise": denoise
                        }
                    },
                    "7": {
                        "class_type": "VAEDecode",
                        "inputs": { "samples": ["6", 0], "vae": ["2", 2] }
                    },
                    "8": {
                        "class_type": "SaveImage",
                        "inputs": {
                            "images": ["7", 0],
                            "filename_prefix": "brane_diffusion"
                        }
                    }
                };

                const promptResp = await fetch(`${COMFY}/prompt`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: workflow })
                });
                const result = await promptResp.json();
                console.log(`ComfyUI job queued: ${result.prompt_id}`);
                console.log(`View at: ${COMFY} — output in brane_diffusion_*.png`);
            } catch (err) {
                console.error('ComfyUI connection failed:', err.message);
                console.log('Make sure ComfyUI is running on lumen:8188');
            }
        };

        // Rebuild mesh + physics at new grid resolution — one job
        window.gridResolution = 100;
        let rebuildThrottle = null;
        function rebuildMesh(newSize) {
            newSize = Math.round(newSize);
            if (newSize === gridSize) return;
            gridSize = newSize;

            // Rebuild Three.js geometry
            window._renderer.rebuildGeometry(gridSize);

            // Rebuild physics at new resolution (clears state)
            physics.setGridSize(gridSize);

            // Note: worklet grid stays at workletGridSize (independent resolution)
            // Bilinear upsampling in updatePhysics() handles the mismatch

            // Clear actuators/collectors — their grid coords are now stale
            actorManager.clearActuators();
            actorManager.clearCollectors();
        }


        // Audio input delegated to sourceManager
        async function toggleMic() {
            await sourceManager.toggleMic();
        }

        async function captureTabAudio() {
            await sourceManager.captureTabAudio();
        }

        function stopTabAudio() {
            // sourceManager.stopTabAudio() is called internally by captureTabAudio()
        }

        function playLoop() {
            sourceManager.playLoop();
        }

        // ─── Keyboard Instrument (Raw Oscillators) ──────────────────────
        let keyboardGainNode = null;
        let keyboardActive = false;
        let keyboardOctave = 4; // Middle C octave
        let activeNotes = {}; // pitch -> { osc, gain }
        const waveforms = ['sine', 'triangle', 'sawtooth', 'square'];
        let currentWaveformIndex = 0;

        function initKeyboard() {
            if (keyboardGainNode) return;
            if (!audioContext) audioContext = new AudioContext();

            // Master gain → speakers + analysers
            keyboardGainNode = audioContext.createGain();
            keyboardGainNode.gain.value = 0.3;
            keyboardGainNode.connect(audioContext.destination);

            // Setup analysers so actuators can read keyboard audio
            if (!leftAnalyser) {
                leftAnalyser = audioContext.createAnalyser();
                leftAnalyser.fftSize = 256;
                leftAnalyser.smoothingTimeConstant = 0.3;
                rightAnalyser = audioContext.createAnalyser();
                rightAnalyser.fftSize = 256;
                rightAnalyser.smoothingTimeConstant = 0.3;
                leftAudioData = new Float32Array(leftAnalyser.fftSize);
                rightAudioData = new Float32Array(rightAnalyser.fftSize);
            }

            // Feed both analysers (mono source → both channels)
            keyboardGainNode.connect(leftAnalyser);
            keyboardGainNode.connect(rightAnalyser);

            // Route to worklet for physics
            initWorklet().then(() => connectSourceToWorklet(keyboardGainNode));
        }

        function midiToFreq(pitch) {
            return 440 * Math.pow(2, (pitch - 69) / 12);
        }

        function keyboardNoteOn(pitch) {
            initKeyboard();
            // Stop existing note at this pitch
            if (activeNotes[pitch]) {
                activeNotes[pitch].gain.gain.cancelScheduledValues(audioContext.currentTime);
                activeNotes[pitch].gain.gain.setValueAtTime(0, audioContext.currentTime);
                activeNotes[pitch].osc.stop();
                delete activeNotes[pitch];
            }

            const osc = audioContext.createOscillator();
            osc.type = waveforms[currentWaveformIndex];
            osc.frequency.setValueAtTime(midiToFreq(pitch), audioContext.currentTime);

            // Per-note gain with fast attack
            const noteGain = audioContext.createGain();
            noteGain.gain.setValueAtTime(0, audioContext.currentTime);
            noteGain.gain.linearRampToValueAtTime(1.0, audioContext.currentTime + 0.01);

            osc.connect(noteGain);
            noteGain.connect(keyboardGainNode);
            osc.start();

            activeNotes[pitch] = { osc, gain: noteGain };
        }

        function keyboardNoteOff(pitch) {
            if (!activeNotes[pitch]) return;
            const note = activeNotes[pitch];
            const now = audioContext.currentTime;
            // Fast release to avoid click
            note.gain.gain.cancelScheduledValues(now);
            note.gain.gain.setValueAtTime(note.gain.gain.value, now);
            note.gain.gain.linearRampToValueAtTime(0, now + 0.05);
            note.osc.stop(now + 0.06);
            delete activeNotes[pitch];
        }

        function switchInstrument(direction) {
            currentWaveformIndex = (currentWaveformIndex + direction + waveforms.length) % waveforms.length;
            return waveforms[currentWaveformIndex];
        }

        function toggleKeyboard() {
            keyboardActive = !keyboardActive;
            if (keyboardActive) initKeyboard();

        // Computer keyboard → MIDI note mapping (one octave, white + black keys)
        const keyMap = {
            'a': 0,  // C
            'w': 1,  // C#
            's': 2,  // D
            'e': 3,  // D#
            'd': 4,  // E
            'f': 5,  // F
            't': 6,  // F#
            'g': 7,  // G
            'y': 8,  // G#
            'h': 9,  // A
            'u': 10, // A#
            'j': 11, // B
            'k': 12  // C (next octave)
        };

        document.addEventListener('keydown', (e) => {
            if (!keyboardActive || e.repeat) return;
            const note = keyMap[e.key.toLowerCase()];
            if (note !== undefined) {
                const pitch = keyboardOctave * 12 + note;
                keyboardNoteOn(pitch);
                // Highlight the visual key
                const keyEl = document.querySelector(`[data-pitch="${pitch}"]`);
                if (keyEl) keyEl.classList.add('key-active');
            }
            // Octave shift with arrow keys
            if (e.key === 'ArrowUp' || e.key === 'ArrowRight') {
                keyboardOctave = Math.min(7, keyboardOctave + 1);
                updateKeyboardDisplay();
            }
            if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') {
                keyboardOctave = Math.max(1, keyboardOctave - 1);
                updateKeyboardDisplay();
            }
        });

        document.addEventListener('keyup', (e) => {
            if (!keyboardActive) return;
            const note = keyMap[e.key.toLowerCase()];
            if (note !== undefined) {
                const pitch = keyboardOctave * 12 + note;
                keyboardNoteOff(pitch);
                const keyEl = document.querySelector(`[data-pitch="${pitch}"]`);
                if (keyEl) keyEl.classList.remove('key-active');
            }
        });

        let keyboardDisplayElement = null;
        function updateKeyboardDisplay() {
            if (!keyboardDisplayElement) return;
            const keys = keyboardDisplayElement.querySelectorAll('.piano-key');
            keys.forEach((key, i) => {
                const noteInOctave = parseInt(key.dataset.note);
                key.dataset.pitch = keyboardOctave * 12 + noteInOctave;
            });
            const octaveLabel = keyboardDisplayElement.querySelector('.octave-label');
            if (octaveLabel) octaveLabel.textContent = `C${keyboardOctave}`;
        }

        // Compact spectrum visualizer for audio tiles
        function drawTileSpectrum(canvas, analyser, color) {
            if (!canvas || !analyser) return;

            const ctx = canvas.getContext('2d');
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            // Clear canvas
            ctx.fillStyle = '#0a0e27';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw compact spectrum bars
            const barWidth = canvas.width / bufferLength * 2.5;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                const barHeight = (dataArray[i] / 255) * canvas.height * 0.9;
                const intensity = dataArray[i] / 255;
                const alpha = Math.max(0.4, intensity);

                // Parse hex color
                const r = parseInt(color.slice(1, 3), 16);
                const g = parseInt(color.slice(3, 5), 16);
                const b = parseInt(color.slice(5, 7), 16);

                ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
                ctx.fillRect(x, canvas.height - barHeight, barWidth - 0.5, barHeight);
                x += barWidth;
            }
        }

        // Start visualizer for active audio tile
        function startTileVisualizer(canvas, analyser, color) {
            if (!canvas || !analyser) return;

            function animate() {
                drawTileSpectrum(canvas, analyser, color);
                visualizerAnimationId = requestAnimationFrame(animate);
            }
            animate();
        }

        function stopTileVisualizer() {
            if (visualizerAnimationId) {
                cancelAnimationFrame(visualizerAnimationId);

        // Initialize audio output for collectors
        function initAudioOutput() {
            if (audioOutputEnabled) {
                console.log('Audio output already enabled');
                return;
            }

            // ── Worklet path: collectors are already output channels ──
            if (membraneWorklet && membraneWorklet.node) {
                // Worklet output channels ARE the collector signals at audio rate.
                // Just connect the worklet output to destination (uses audioContext, not separate outputContext)
                membraneWorklet.connectOutput(audioContext.destination);
                audioOutputEnabled = true;
                console.log('Audio output enabled via worklet (sample-accurate collectors)');
                return;
            }

            // ── Fallback: ScriptProcessor for main-thread physics ─────
            if (!outputContext) {
                outputContext = new (window.AudioContext || window.webkitAudioContext)();
            }

            // Create ScriptProcessorNode (4096 buffer size for smooth playback)
            outputProcessor = outputContext.createScriptProcessor(4096, 0, 2);

            let lastLeft = 0;
            let lastRight = 0;

            outputProcessor.onaudioprocess = (e) => {
                const outputL = e.outputBuffer.getChannelData(0);
                const outputR = e.outputBuffer.getChannelData(1);

                // Sample collectors once per buffer (not per sample)
                const samples = actorManager.sampleAllCollectors();
                let targetLeft = samples.left;
                let targetRight = samples.right;

                // Interpolate from last to target
                for (let i = 0; i < outputL.length; i++) {
                    const t = i / outputL.length;
                    outputL[i] = lastLeft + (targetLeft - lastLeft) * t;
                    outputR[i] = lastRight + (targetRight - lastRight) * t;
                }

                lastLeft = targetLeft;
                lastRight = targetRight;
            };

            // Connect to speakers
            outputProcessor.connect(outputContext.destination);

            audioOutputEnabled = true;
            console.log('Audio output enabled - routing to system audio');
        }

        function stopAudioOutput() {
            // Disconnect worklet output if active
            if (membraneWorklet && membraneWorklet.node) {
                try { membraneWorklet.node.disconnect(audioContext.destination); } catch(e) {}
            }
            if (outputProcessor) {
                outputProcessor.disconnect();
                outputProcessor = null;
            }
            if (outputContext) {
                outputContext.close();
                outputContext = null;
            }
            audioOutputEnabled = false;
            console.log('Audio output stopped');
        }

        // Physics update
        function updatePhysics() {
            // Forward changed params to worklet (dirty-checked)
            if (window.paramBus && membraneWorklet) {
                const dirty = window.paramBus.getDirtyParams();
                if (dirty.size > 0) {
                    if (dirty.has('membrane_wave_speed'))
                        membraneWorklet.setWaveSpeed(dirty.get('membrane_wave_speed'));
                    if (dirty.has('membrane_damping'))
                        membraneWorklet.setDamping(dirty.get('membrane_damping'));
                    if (dirty.has('membrane_actuator_gain'))
                        membraneWorklet.setActuatorGain(dirty.get('membrane_actuator_gain'));
                    if (dirty.has('display_smoothing'))
                        membraneWorklet.setSmoothing(dirty.get('display_smoothing'));
                    window.paramBus.markAllForwarded();
                }
            }

            // Legacy bridge — keep main-thread physics object in sync
            if (window.paramBus) {
                physics.waveSpeed = window.paramBus.get('membrane_wave_speed');
                physics.damping = window.paramBus.get('membrane_damping');
                window.paramBus.syncToWindowGlobals();
            } else {
                physics.waveSpeed = Number(window.waveSpeed);
                physics.damping = Number(window.damping);
                window.actuatorGain = Number(window.actuatorGain);
            }

            if (membraneWorklet && workletSnapshot) {
                window._renderer.updateMesh(workletSnapshot, workletGridSize, gridSize);
            } else {
                physics.updatePhysics();
                window._renderer.updateMesh(null, 0, gridSize, physics.heights);
            }
        }

        // Animation loop
        function animate() {
            const now = performance.now();
            logFrame(now - lastFrameTime);
            lastFrameTime = now;
            stats.begin();
            requestAnimationFrame(animate);

            // Update audio analysers and buffers
            sourceManager.updateAnalysers();

            // Update actor manager's runtime dependencies
            const audioState = sourceManager.getAudioState();
            const audioData = sourceManager.getAudioData();
            actorManager.updateDeps({
                demoMode: audioState.demoMode,
                audioEnabled: audioState.audioEnabled,
                leftAudioData: audioData.left,
                rightAudioData: audioData.right
            });

            // Update audio visualizers on tiles
            updateAudioVisualizers();

            // Apply actuators on main thread only when worklet is NOT active
            // (when worklet runs, audio flows directly into physics via input channels)
            if (!membraneWorklet) {
                actorManager.applyActuators();
            } else {
                // Worklet owns physics — update actuator visuals from snapshot heights
                actorManager.updateVisualsFromSnapshot(workletSnapshot, workletGridSize, gridSize);
            }

            updatePhysics();

            // Collectors sample automatically in worklet or ScriptProcessor callback

            material.uniforms.time.value = Date.now() * 0.001;

            controls.update();
            renderer.render(scene, camera);
            stats.end();
        }

        // D3 Drag handler with hard boundaries
        function createD3Drag() {
            let startX, startY;

            return d3.drag()
                .on('start', function(event, d) {
                    d3.select(this).classed('dragging', true);
                    const tile = d3.select(this);
                    startX = parseInt(tile.style('left')) - event.x;
                    startY = parseInt(tile.style('top')) - event.y;
                })
                .on('drag', function(event, d) {
                    const tile = d3.select(this);
                    const width = parseInt(tile.style('width'));
                    const height = d.height || 60;

                    // Calculate new position relative to drag start
                    const x = Math.max(0, Math.min(window.innerWidth - width, event.x + startX));
                    const y = Math.max(0, Math.min(window.innerHeight - height, event.y + startY));

                    tile.style('left', `${x}px`)
                        .style('top', `${y}px`);

                    tilePositions[d.id] = { x, y };
                })
                .on('end', function(event, d) {
                    d3.select(this).classed('dragging', false);
                });
        }

        // Draw parameter-specific waveform into canvas
        function drawParamWaveform(canvas, tileData, value) {
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;
            ctx.clearRect(0, 0, w, h);

            const t = (value - tileData.min) / (tileData.max - tileData.min); // 0–1

            // Baseline
            ctx.strokeStyle = `rgba(${hexToRgb(tileData.color)}, 0.12)`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, h / 2);
            ctx.lineTo(w, h / 2);
            ctx.stroke();

            // Waveform
            ctx.strokeStyle = tileData.color;
            ctx.lineWidth = 1.5;
            ctx.shadowColor = tileData.color;
            ctx.shadowBlur = 4;
            ctx.beginPath();

            if (tileData.variable === 'waveSpeed') {
                // Wave density shows speed — more cycles = faster
                const cycles = 1 + t * 7;
                const amp = h * 0.35;
                for (let x = 0; x <= w; x++) {
                    const y = h / 2 + amp * Math.sin((x / w) * cycles * Math.PI * 2);
                    x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                }
            } else if (tileData.variable === 'damping') {
                // Decaying envelope — faster decay = more damping
                const decayRate = 1 + t * 18;
                const amp = h * 0.38;
                for (let x = 0; x <= w; x++) {
                    const tx = x / w;
                    const env = Math.exp(-decayRate * tx);
                    const y = h / 2 + amp * env * Math.sin(tx * 5 * Math.PI * 2);
                    x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                }
            } else if (tileData.variable === 'actuatorGain') {
                // Amplitude shows drive level
                const amp = h * (0.08 + t * 0.38);
                for (let x = 0; x <= w; x++) {
                    const y = h / 2 + amp * Math.sin((x / w) * 3 * Math.PI * 2);
                    x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                }
            } else if (tileData.variable === 'gridResolution') {
                // Grid density — shows the mesh you're setting
                ctx.stroke(); // close any open path
                ctx.beginPath();
                const cells = Math.round(3 + t * 9); // 3–12 visible cells
                const pad = 4;
                const gw = w - pad * 2, gh = h - pad * 2;
                for (let i = 0; i <= cells; i++) {
                    const x = pad + (i / cells) * gw;
                    ctx.moveTo(x, pad); ctx.lineTo(x, pad + gh);
                }
                for (let j = 0; j <= cells; j++) {
                    const y = pad + (j / cells) * gh;
                    ctx.moveTo(pad, y); ctx.lineTo(pad + gw, y);
                }
            }
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Value readout bottom-right
            ctx.fillStyle = `rgba(${hexToRgb(tileData.color)}, 0.7)`;
            ctx.font = '8px JetBrains Mono, monospace';
            ctx.textAlign = 'right';
            const label = tileData.variable === 'gridResolution'
                ? `${Math.round(value)}×${Math.round(value)}`
                : value.toPrecision(4);
            ctx.fillText(label, w - 2, h - 2);
        }

        // Slider tile — waveform canvas + scrubber
        const PARAM_MAP = {
            waveSpeed: 'membrane_wave_speed',
            damping: 'membrane_damping',
            actuatorGain: 'membrane_actuator_gain',
            displaySmoothing: 'display_smoothing'
        };

        function createSliderTile(visual, tileData) {
            const names = { waveSpeed: 'Wave Speed', damping: 'Damping', actuatorGain: 'Input Gain' };
            const tileEl = visual.closest('.control-tile') || visual.parentElement;
            tileEl.title = `${names[tileData.variable] || tileData.variable} — right-click to inspect`;

            visual.style.cssText += 'flex-direction: column; justify-content: flex-end; padding: 6px; gap: 5px;';

            // Waveform canvas
            const canvas = document.createElement('canvas');
            canvas.width = (tileData.width || 160) - 12;
            canvas.height = (tileData.height || 90) - 28;
            canvas.style.cssText = 'width: 100%; flex: 1; display: block; cursor: default;';
            visual.appendChild(canvas);

            // Slider track
            const track = document.createElement('div');
            track.style.cssText = `
                width: 100%; height: 4px;
                background: rgba(${hexToRgb(tileData.color)}, 0.2);
                border-radius: 2px; position: relative; cursor: pointer; flex-shrink: 0;
            `;

            // Power curve for slider resolution: curve > 1 concentrates precision
            // at the low end. curve = 1 is linear. curve = 3 gives ~80% of slider
            // travel to the bottom third of the value range.
            const curve = tileData.curve || 1.0;
            // value → percent (for thumb position)
            const valueToPct = (v) => Math.pow((v - tileData.min) / (tileData.max - tileData.min), 1.0 / curve);
            // percent → value (for drag input)
            const pctToValue = (p) => tileData.min + Math.pow(p, curve) * (tileData.max - tileData.min);

            const initialPercent = valueToPct(tileData.default);
            const thumb = document.createElement('div');
            thumb.style.cssText = `
                position: absolute;
                width: 12px; height: 12px;
                background: ${tileData.color};
                border-radius: 50%;
                left: ${initialPercent * 100}%;
                top: 50%;
                transform: translate(-50%, -50%);
                cursor: pointer;
                box-shadow: 0 0 8px ${tileData.color};
            `;
            track.appendChild(thumb);
            visual.appendChild(track);

            // Initialize variable and draw
            window[tileData.variable] = tileData.default;
            drawParamWaveform(canvas, tileData, tileData.default);

            function updateSlider(value) {
                value = Math.max(tileData.min, Math.min(tileData.max, value));
                window[tileData.variable] = value;
                const paramId = PARAM_MAP[tileData.variable];
                if (paramId && window.paramBus) {
                    window.paramBus.set(paramId, value);
                }
                thumb.style.left = `${valueToPct(value) * 100}%`;
                drawParamWaveform(canvas, tileData, value);
                if (tileData.variable === 'gridResolution') {
                    clearTimeout(rebuildThrottle);
                    rebuildThrottle = setTimeout(() => rebuildMesh(value), 400);
                }
            }

            let isDragging = false;
            thumb.addEventListener('mousedown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                isDragging = true;
                thumb.style.transform = 'translate(-50%, -50%) scale(1.3)';
                const rect = track.getBoundingClientRect();
                function onMove(e) {
                    if (!isDragging) return;
                    const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                    updateSlider(pctToValue(pct));
                }
                function onUp() {
                    isDragging = false;
                    thumb.style.transform = 'translate(-50%, -50%)';
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                }
                onMove(e);
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            });

            track.addEventListener('wheel', (e) => {
                e.preventDefault();
                e.stopPropagation();
                // Step in percent-space so curve-aware sliders get fine control at low values
                const currentPct = valueToPct(window[tileData.variable]);
                const stepPct = 0.02;
                const newPct = Math.max(0, Math.min(1, currentPct + (e.deltaY < 0 ? stepPct : -stepPct)));
                updateSlider(pctToValue(newPct));
            }, { passive: false });

            track.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                e.stopPropagation();
                openSliderInspector(tileData, thumb, track, canvas);
            });

            track._tileData = tileData;
            track._thumb = thumb;
            track._canvas = canvas;
        }

        // ─── Slider Inspector ─────────────────────────────────────────────


        let inspectorTarget = null; // { tileData, thumb, track, canvas }
        let inspectorAnimFrame = null;

        function openSliderInspector(tileData, thumb, track, canvas) {
            inspectorTarget = { tileData: Object.assign({}, tileData), thumb, track, canvas, origMin: tileData.min, origMax: tileData.max };

            const panel = document.getElementById('slider-inspector');
            const names = { waveSpeed: 'Wave Speed', damping: 'Damping', actuatorGain: 'Input Gain' };
            document.getElementById('inspector-title').textContent = names[tileData.variable] || tileData.variable;

            // Color the slider elements
            const color = tileData.color;
            document.getElementById('inspector-big-slider-fill').style.background = color;
            document.getElementById('inspector-big-slider-thumb').style.background = color;
            document.getElementById('inspector-big-slider-thumb').style.color = color;

            // Position panel near tile but keep on screen
            const tileEl = track.closest('.control-tile');
            const rect = tileEl ? tileEl.getBoundingClientRect() : { left: 100, bottom: 80 };
            let px = rect.left;
            let py = rect.bottom + 8;
            if (px + 280 > window.innerWidth) px = window.innerWidth - 290;
            if (py + 220 > window.innerHeight) py = rect.top - 228;
            panel.style.left = px + 'px';
            panel.style.top = py + 'px';

            syncInspectorUI();
            panel.classList.add('visible');

            // Live update loop
            cancelAnimationFrame(inspectorAnimFrame);
            function updateLoop() {
                if (!panel.classList.contains('visible')) return;
                syncInspectorUI();
                inspectorAnimFrame = requestAnimationFrame(updateLoop);
            }
            inspectorAnimFrame = requestAnimationFrame(updateLoop);
        }

        function syncInspectorUI() {
            if (!inspectorTarget) return;
            const { tileData } = inspectorTarget;
            const val = window[tileData.variable];
            const pct = Math.max(0, Math.min(1, (val - tileData.min) / (tileData.max - tileData.min)));

            document.getElementById('inspector-big-slider-thumb').style.left = (pct * 100) + '%';
            document.getElementById('inspector-big-slider-fill').style.width = (pct * 100) + '%';

            const valInput = document.getElementById('inspector-val-input');
            if (document.activeElement !== valInput) valInput.value = val.toPrecision(6);
            document.getElementById('inspector-min-input').value = tileData.min;
            document.getElementById('inspector-max-input').value = tileData.max;
        }

        function setInspectorValue(val) {
            if (!inspectorTarget) return;
            const { tileData, thumb, canvas } = inspectorTarget;
            val = Math.max(tileData.min, Math.min(tileData.max, val));
            window[tileData.variable] = val;
            const pct = (val - tileData.min) / (tileData.max - tileData.min);
            thumb.style.left = (pct * 100) + '%';
            if (canvas) drawParamWaveform(canvas, tileData, val);
        }

        // Inspector big slider drag
        (function() {
            const bigTrack = document.getElementById('inspector-big-slider-track');
            const bigThumb = document.getElementById('inspector-big-slider-thumb');
            let dragging = false;

            function dragTo(clientX) {
                if (!inspectorTarget) return;
                const rect = bigTrack.getBoundingClientRect();
                const pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
                const { tileData } = inspectorTarget;
                const val = tileData.min + pct * (tileData.max - tileData.min);
                setInspectorValue(val);
            }

            bigThumb.addEventListener('mousedown', e => { e.preventDefault(); dragging = true; });
            bigTrack.addEventListener('mousedown', e => { e.preventDefault(); dragging = true; dragTo(e.clientX); });
            document.addEventListener('mousemove', e => { if (dragging) dragTo(e.clientX); });
            document.addEventListener('mouseup', () => { dragging = false; });

            bigTrack.addEventListener('wheel', e => {
                e.preventDefault();
                if (!inspectorTarget) return;
                const { tileData } = inspectorTarget;
                const step = (tileData.max - tileData.min) * 0.01;
                setInspectorValue(window[tileData.variable] + (e.deltaY < 0 ? step : -step));
            }, { passive: false });
        })();

        // Inspector value input
        document.getElementById('inspector-val-input').addEventListener('change', e => {
            const v = parseFloat(e.target.value);
            if (!isNaN(v)) setInspectorValue(v);
        });

        // Inspector min/max inputs
        document.getElementById('inspector-min-input').addEventListener('change', e => {
            if (!inspectorTarget) return;
            const v = parseFloat(e.target.value);
            if (!isNaN(v) && v < inspectorTarget.tileData.max) {
                inspectorTarget.tileData.min = v;
            }
        });
        document.getElementById('inspector-max-input').addEventListener('change', e => {
            if (!inspectorTarget) return;
            const v = parseFloat(e.target.value);
            if (!isNaN(v) && v > inspectorTarget.tileData.min) {
                inspectorTarget.tileData.max = v;
            }
        });

        // Inspector reset button
        document.getElementById('inspector-reset').addEventListener('click', () => {
            if (!inspectorTarget) return;
            const { tileData, origMin, origMax } = inspectorTarget;
            tileData.min = origMin;
            tileData.max = origMax;
            const orig = tilesConfig.tiles.find(t => t.variable === tileData.variable);
            if (orig) setInspectorValue(orig.default);
        });

        // Inspector close button
        document.getElementById('inspector-close').addEventListener('click', () => {
            document.getElementById('slider-inspector').classList.remove('visible');
            cancelAnimationFrame(inspectorAnimFrame);
            inspectorTarget = null;
        });

        // Inspector drag (header)
        (function() {
            const panel = document.getElementById('slider-inspector');
            const header = document.getElementById('inspector-header');
            let ox, oy, dragging = false;
            header.addEventListener('mousedown', e => {
                if (e.target.id === 'inspector-close') return;
                dragging = true;
                ox = e.clientX - panel.offsetLeft;
                oy = e.clientY - panel.offsetTop;
                e.preventDefault();
            });
            document.addEventListener('mousemove', e => {
                if (!dragging) return;
                panel.style.left = Math.max(0, Math.min(window.innerWidth - panel.offsetWidth, e.clientX - ox)) + 'px';
                panel.style.top = Math.max(0, Math.min(window.innerHeight - panel.offsetHeight, e.clientY - oy)) + 'px';
            });
            document.addEventListener('mouseup', () => { dragging = false; });
        })();

        // ─── End Slider Inspector ─────────────────────────────────────────

        // Helper: convert hex to RGB for rgba()
        function hexToRgb(hex) {
            const r = parseInt(hex.substring(1, 3), 16);
            const g = parseInt(hex.substring(3, 5), 16);
            const b = parseInt(hex.substring(5, 7), 16);
            return `${r}, ${g}, ${b}`;
        }

        // Helper: get current state of toggle
        function getToggleState(action) {
            const audioState = sourceManager ? sourceManager.getAudioState() : {};
            if (action === 'toggleDemo') return audioState.demoMode || false;
            if (action === 'captureTabAudio') return audioState.tabAudioActive || false;
            if (action === 'captureTab') return audioState.tabAudioActive || false;  // legacy
            if (action === 'toggleMic' || action === 'micInput') return audioState.micActive || false;
            if (action === 'toggleWireframe') return material.wireframe;
            if (action === 'freezePhysics') return physicsFrozen;
            return false;
        }

        // Update all toggle button states
        function updateToggleStates() {
            document.querySelectorAll('.control-tile').forEach(tile => {
                const visual = tile.querySelector('.param-visual');
                if (visual && visual.button && visual.tileData && visual.tileData.type === 'toggle') {
                    const isActive = getToggleState(visual.tileData.action);
                    visual.button.style.background = `rgba(${hexToRgb(visual.tileData.color)}, ${isActive ? 0.5 : 0.2})`;
                    visual.button.style.boxShadow = isActive ? `0 0 15px ${visual.tileData.color}` : 'none';
                }
            });
        }

        // Keep old update function for backwards compat
        function updateAudioToggles() {
            updateToggleStates();
        }

        // Mini-membrane - shows actuator/collector positions as SVG dots
        // Keyboard tile — one octave piano, octave arrows, instrument switcher
        function createKeyboardTile(visual, tileData) {
            const container = document.createElement('div');
            container.style.cssText = `
                width: 100%; height: 100%;
                display: flex; flex-direction: column;
                background: rgba(10, 14, 39, 0.8);
                border-radius: 6px; overflow: hidden;
                user-select: none;
            `;

            // Top bar: octave arrows + instrument name + instrument arrows
            const topBar = document.createElement('div');
            topBar.style.cssText = `
                display: flex; align-items: center; justify-content: space-between;
                padding: 2px 6px; height: 22px; flex-shrink: 0;
                background: rgba(0, 229, 255, 0.08);
                border-bottom: 1px solid rgba(0, 229, 255, 0.15);
                font-size: 10px; color: #00e5ff;
            `;

            // Octave controls (left side)
            const octaveGroup = document.createElement('div');
            octaveGroup.style.cssText = 'display: flex; align-items: center; gap: 4px;';

            const octDown = document.createElement('span');
            octDown.textContent = '◀';
            octDown.style.cssText = 'cursor: pointer; opacity: 0.6; font-size: 9px;';
            octDown.addEventListener('click', (e) => {
                e.stopPropagation();
                keyboardOctave = Math.max(1, keyboardOctave - 1);
                updateKeyboardDisplay();
            });

            const octLabel = document.createElement('span');
            octLabel.className = 'octave-label';
            octLabel.textContent = `C${keyboardOctave}`;
            octLabel.style.cssText = 'min-width: 20px; text-align: center; font-size: 10px;';

            const octUp = document.createElement('span');
            octUp.textContent = '▶';
            octUp.style.cssText = 'cursor: pointer; opacity: 0.6; font-size: 9px;';
            octUp.addEventListener('click', (e) => {
                e.stopPropagation();
                keyboardOctave = Math.min(7, keyboardOctave + 1);
                updateKeyboardDisplay();
            });

            octaveGroup.appendChild(octDown);
            octaveGroup.appendChild(octLabel);
            octaveGroup.appendChild(octUp);

            // Instrument selector (right side)
            const instGroup = document.createElement('div');
            instGroup.style.cssText = 'display: flex; align-items: center; gap: 4px;';

            const instDown = document.createElement('span');
            instDown.textContent = '◀';
            instDown.style.cssText = 'cursor: pointer; opacity: 0.6; font-size: 9px;';

            const instLabel = document.createElement('span');
            instLabel.textContent = waveforms[0];
            instLabel.style.cssText = 'min-width: 40px; text-align: center; font-size: 10px;';

            const instUp = document.createElement('span');
            instUp.textContent = '▶';
            instUp.style.cssText = 'cursor: pointer; opacity: 0.6; font-size: 9px;';

            instDown.addEventListener('click', (e) => {
                e.stopPropagation();
                instLabel.textContent = switchInstrument(-1);
            });
            instUp.addEventListener('click', (e) => {
                e.stopPropagation();
                instLabel.textContent = switchInstrument(1);
            });

            instGroup.appendChild(instDown);
            instGroup.appendChild(instLabel);
            instGroup.appendChild(instUp);

            topBar.appendChild(octaveGroup);
            topBar.appendChild(instGroup);
            container.appendChild(topBar);

            // Piano keys
            const keysContainer = document.createElement('div');
            keysContainer.style.cssText = `
                flex: 1; position: relative; display: flex;
                padding: 2px 2px 4px 2px;
            `;

            // White keys: C D E F G A B C
            const whiteNotes = [0, 2, 4, 5, 7, 9, 11, 12];
            const blackNotes = [1, 3, null, 6, 8, 10, null]; // null = no black key after E and B
            const whiteKeyNames = ['C', 'D', 'E', 'F', 'G', 'A', 'B', 'C'];

            // White keys
            whiteNotes.forEach((note, i) => {
                const key = document.createElement('div');
                key.className = 'piano-key white-key';
                key.dataset.note = note;
                key.dataset.pitch = keyboardOctave * 12 + note;
                key.style.cssText = `
                    flex: 1; margin: 0 1px;
                    background: linear-gradient(to bottom, #e8e8e8, #ffffff);
                    border: 1px solid rgba(0, 0, 0, 0.3);
                    border-radius: 0 0 3px 3px;
                    cursor: pointer;
                    position: relative; z-index: 1;
                    transition: background 0.05s;
                    display: flex; align-items: flex-end; justify-content: center;
                    padding-bottom: 2px;
                    font-size: 7px; color: rgba(0, 0, 0, 0.3);
                `;
                key.textContent = whiteKeyNames[i];

                key.addEventListener('mousedown', (e) => {
                    e.stopPropagation();
                    e.preventDefault();
                    initKeyboard();
                    const pitch = parseInt(key.dataset.pitch);
                    keyboardNoteOn(pitch);
                    key.classList.add('key-active');
                });
                key.addEventListener('mouseup', () => {
                    const pitch = parseInt(key.dataset.pitch);
                    keyboardNoteOff(pitch);
                    key.classList.remove('key-active');
                });
                key.addEventListener('mouseleave', () => {
                    const pitch = parseInt(key.dataset.pitch);
                    keyboardNoteOff(pitch);
                    key.classList.remove('key-active');
                });
                // Touch support
                key.addEventListener('touchstart', (e) => {
                    e.stopPropagation();
                    e.preventDefault();
                    initKeyboard();
                    const pitch = parseInt(key.dataset.pitch);
                    keyboardNoteOn(pitch);
                    key.classList.add('key-active');
                });
                key.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    const pitch = parseInt(key.dataset.pitch);
                    keyboardNoteOff(pitch);
                    key.classList.remove('key-active');
                });

                keysContainer.appendChild(key);
            });

            // Black keys overlaid
            const blackKeyPositions = [0.125, 0.25, null, 0.5, 0.625, 0.75, null]; // fractions across white keys
            blackNotes.forEach((note, i) => {
                if (note === null) return;
                const key = document.createElement('div');
                key.className = 'piano-key black-key';
                key.dataset.note = note;
                key.dataset.pitch = keyboardOctave * 12 + note;
                // Position: between white keys
                const leftPct = ((i + 0.7) / whiteNotes.length) * 100;
                key.style.cssText = `
                    position: absolute;
                    left: ${leftPct}%;
                    width: ${100 / whiteNotes.length * 0.6}%;
                    height: 58%;
                    top: 2px;
                    background: linear-gradient(to bottom, #222, #000);
                    border: 1px solid rgba(0, 229, 255, 0.1);
                    border-radius: 0 0 2px 2px;
                    cursor: pointer;
                    z-index: 2;
                    transition: background 0.05s;
                `;

                key.addEventListener('mousedown', (e) => {
                    e.stopPropagation();
                    e.preventDefault();
                    initKeyboard();
                    const pitch = parseInt(key.dataset.pitch);
                    keyboardNoteOn(pitch);
                    key.classList.add('key-active');
                });
                key.addEventListener('mouseup', () => {
                    const pitch = parseInt(key.dataset.pitch);
                    keyboardNoteOff(pitch);
                    key.classList.remove('key-active');
                });
                key.addEventListener('mouseleave', () => {
                    const pitch = parseInt(key.dataset.pitch);
                    keyboardNoteOff(pitch);
                    key.classList.remove('key-active');
                });
                key.addEventListener('touchstart', (e) => {
                    e.stopPropagation();
                    e.preventDefault();
                    initKeyboard();
                    const pitch = parseInt(key.dataset.pitch);
                    keyboardNoteOn(pitch);
                    key.classList.add('key-active');
                });
                key.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    const pitch = parseInt(key.dataset.pitch);
                    keyboardNoteOff(pitch);
                    key.classList.remove('key-active');
                });

                keysContainer.appendChild(key);
            });

            container.appendChild(keysContainer);
            visual.appendChild(container);
            keyboardDisplayElement = container;
        }

        function createMiniMembraneTile(visual, tileData) {
            const container = document.createElement('div');
            container.style.cssText = 'width: 100%; height: 100%; position: relative; background: rgba(0, 0, 0, 0.2); border-radius: 4px;';

            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.style.cssText = 'width: 100%; height: 100%;';
            svg.setAttribute('viewBox', '0 0 100 100');

            container.appendChild(svg);
            visual.appendChild(container);
            visual.miniSvg = svg;
        }

        function updateMiniMembrane() {
            const tile = document.getElementById('tile-mini-membrane');
            if (!tile) return;

            const visual = tile.querySelector('.param-visual');
            if (!visual || !visual.miniSvg) return;

            const svg = visual.miniSvg;
            svg.innerHTML = '';

            // Map actuators to SVG coordinates
            const scale = 100 / membraneSize;

            actorManager.getActuators().forEach(act => {
                const cx = (act.x + membraneSize/2) * scale;
                const cy = (act.y + membraneSize/2) * scale;
                const color = act.channel === 'left' ? '#ff00ff' : (act.channel === 'right' ? '#00ffff' : '#ffff00');

                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', cx);
                circle.setAttribute('cy', cy);
                circle.setAttribute('r', 2);
                circle.setAttribute('fill', color);
                svg.appendChild(circle);
            });

            actorManager.getCollectors().forEach(col => {
                const cx = (col.x + membraneSize/2) * scale;
                const cy = (col.y + membraneSize/2) * scale;

                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', cx);
                circle.setAttribute('cy', cy);
                circle.setAttribute('r', 1.5);
                circle.setAttribute('fill', '#00ff00');
                svg.appendChild(circle);
            });
        }


        // Initialize and start
        initializeArrays();

        // Create control tiles
        createTiles();

        // Start with clean membrane (no default actuators/collectors)

        animate();

        console.log('🌊 rmix-BAE: Membrane Physics Audio Environment');
        console.log('');
        console.log('Controls:');
        console.log('  Click          - Add actuator (solid sphere)');
        console.log('  Shift+Click    - Add collector (wireframe sphere)');
        console.log('  F              - Load audio file');
        console.log('  D              - Demo mode (sine waves)');
        console.log('  R              - Reset membrane');
        console.log('  C              - Clear actuators');
        console.log('  M              - Clear collectors');
        console.log('');
        console.log('Actuators drive the membrane (audio → force)');
        console.log('Collectors sample the membrane (velocity → audio)');
    </script>
