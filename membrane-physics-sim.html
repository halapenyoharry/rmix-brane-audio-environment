<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Membrane Physics Simulation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0e27;
            overflow: hidden;
            height: 100vh;
        }
        
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <script src="three.min.js"></script>
    <script src="OrbitControls.js"></script>
    <script src="membrane-physics-core.js"></script>
    <script>
        // Initialize membrane physics
        const membrane = new MembranePhysics({
            gridSize: 100,
            membraneSize: 100,
            waveSpeed: 0.3,
            damping: 0.00265,
            boundaryType: 'fixed',
            boundaryShape: 'square'
        });
        
        // Three.js scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0e27);
        
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.01,
            5000
        );
        camera.position.set(50, 40, 50);
        camera.lookAt(0, 0, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0x1a237e, 0.4);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0x00e5ff, 0.6);
        directionalLight.position.set(100, 100, 50);
        scene.add(directionalLight);
        
        // Create membrane mesh
        const geometry = new THREE.PlaneGeometry(
            membrane.membraneSize, 
            membrane.membraneSize, 
            membrane.gridSize, 
            membrane.gridSize
        );
        
        // Shader material with height-based coloring
        const material = new THREE.ShaderMaterial({
            uniforms: {
                waveHeight: { value: 20.0 },
                colorNegative: { value: new THREE.Color(0x00ffff) },
                colorPositive: { value: new THREE.Color(0xff00ff) }
            },
            vertexShader: `
                varying float vHeight;
                varying vec3 vNormal;
                
                void main() {
                    vHeight = position.z;
                    vNormal = normal;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform vec3 colorNegative;
                uniform vec3 colorPositive;
                varying float vHeight;
                varying vec3 vNormal;
                
                void main() {
                    float t = (vHeight + 10.0) / 20.0;
                    t = clamp(t, 0.0, 1.0);
                    
                    vec3 color = mix(colorNegative, colorPositive, t);
                    
                    vec3 lightDir = normalize(vec3(1.0, 1.0, 1.0));
                    float diff = max(dot(vNormal, lightDir), 0.0);
                    color *= (0.7 + diff * 0.3);
                    
                    gl_FragColor = vec4(color, 1.0);
                }
            `,
            side: THREE.DoubleSide,
            wireframe: false
        });
        
        const mesh = new THREE.Mesh(geometry, material);
        mesh.rotation.x = -Math.PI / 2;
        scene.add(mesh);
        
        // Update mesh geometry from physics
        function updateMeshFromPhysics() {
            const positions = mesh.geometry.attributes.position.array;
            const gridSize = membrane.gridSize;
            
            for (let i = 0; i <= gridSize; i++) {
                for (let j = 0; j <= gridSize; j++) {
                    const index = (i * (gridSize + 1) + j) * 3 + 2;
                    positions[index] = membrane.heights[i][j] * material.uniforms.waveHeight.value;
                }
            }
            
            mesh.geometry.attributes.position.needsUpdate = true;
            mesh.geometry.computeVertexNormals();
        }
        
        // Mouse interaction
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        
        renderer.domElement.addEventListener('click', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(mesh);
            
            if (intersects.length > 0) {
                const point = intersects[0].point;
                membrane.strikeMembrane(point.x, point.z, 2.0);
            }
        });
        
        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ') {
                e.preventDefault();
                membrane.strikeMembrane(0, 0, 30, 10);
            } else if (e.key === 'r' || e.key === 'R' || e.key === 'Escape') {
                membrane.reset();
            } else if (e.key >= '1' && e.key <= '9') {
                const force = parseInt(e.key);
                membrane.strikeMembrane(0, 0, force * 5, 8);
            }
        });
        
        // Control interface
        const controlAPI = {
            // Wave speed control
            setWaveSpeed: (speed) => membrane.setWaveSpeed(speed),
            getWaveSpeed: () => membrane.waveSpeed,
            
            // Damping control
            setDamping: (damping) => membrane.setDamping(damping),
            getDamping: () => membrane.damping,
            
            // Boundary controls
            setBoundaryType: (type) => membrane.setBoundaryType(type),
            getBoundaryType: () => membrane.boundaryType,
            
            setBoundaryShape: (shape) => membrane.setBoundaryShape(shape),
            getBoundaryShape: () => membrane.boundaryShape,
            
            setBoundaryStiffness: (stiffness) => {
                membrane.boundaryStiffness = Math.max(0, Math.min(1, stiffness));
            },
            getBoundaryStiffness: () => membrane.boundaryStiffness,
            
            // Mesh controls
            setWireframe: (enabled) => {
                material.wireframe = enabled;
            },
            getWireframe: () => material.wireframe,
            
            setGridSize: (size) => {
                membrane.setGridSize(size);
                // Recreate geometry
                geometry.dispose();
                const newGeometry = new THREE.PlaneGeometry(
                    membrane.membraneSize,
                    membrane.membraneSize,
                    membrane.gridSize,
                    membrane.gridSize
                );
                mesh.geometry = newGeometry;
            },
            getGridSize: () => membrane.gridSize,
            
            // Color controls
            setColorNegative: (hexColor) => {
                material.uniforms.colorNegative.value = new THREE.Color(hexColor);
            },
            setColorPositive: (hexColor) => {
                material.uniforms.colorPositive.value = new THREE.Color(hexColor);
            },
            
            // Strike membrane programmatically
            strike: (x, y, force, radius) => {
                membrane.strikeMembrane(x, y, force, radius);
            },
            
            // Apply continuous force (for actuators)
            applyForce: (x, y, force) => {
                membrane.applyForce(x, y, force);
            },
            
            // Reset
            reset: () => membrane.reset()
        };
        
        // Expose control API globally for external control
        window.membraneControl = controlAPI;
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            membrane.updatePhysics();
            updateMeshFromPhysics();
            
            controls.update();
            renderer.render(scene, camera);
        }
        
        // Handle resize
        function handleResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        window.addEventListener('resize', handleResize);
        
        // Start animation
        animate();
        
        console.log('Membrane Physics Simulation');
        console.log('Controls available via window.membraneControl');
        console.log('Click to strike, Space for center strike, R to reset');
    </script>
</body>
</html>
