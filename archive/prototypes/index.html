<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>rmix-BAE: Brane Audio Environment</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0e27;
            color: #00e5ff;
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            overflow: hidden;
            height: 100vh;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #ui-container {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }
        #ui-container > * {
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui-container">
        <!-- UI components will be inserted here by the user's design -->
        <div id="playback-controls-container"></div>
        <div id="loop-region-container"></div>
    </div>

    <!-- Core Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="membrane-physics-core.js"></script>

    <!-- rmix-BAE Modules -->
    <script src="src/audio/AudioFileManager.js"></script>
    <script src="src/audio/LoopController.js"></script>
    <script src="src/audio/MicrophoneInput.js"></script>
    <script src="src/audio/AudioSourceRouter.js"></script>
    <script src="src/schema/SchemaParser.js"></script>
    <script src="src/controllers/ParameterController.js"></script>
    <script src="src/physics/MembranePhysicsWrapper.js"></script>
    <script src="src/visual/MappingCurveEngine.js"></script>

    <!-- Main Application Logic -->
    <script>
        // Global scope for easy debugging
        let scene, camera, renderer, controls, membraneMesh, material;
        let paramController, audioRouter, fileManager, micInput, physicsWrapper, mappingEngine;

        // Three.js Scene Setup
        function setupScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0e27);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 150, 250);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            const ambientLight = new THREE.AmbientLight(0x404040, 2);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.7);
            directionalLight.position.set(50, 100, 75);
            scene.add(directionalLight);
        }

        // Membrane Visuals Setup
        function setupMembraneVisuals() {
            const gridSize = 128;
            const membraneSize = 200;
            const geometry = new THREE.PlaneGeometry(membraneSize, membraneSize, gridSize, gridSize);

            material = new THREE.ShaderMaterial({
                uniforms: {
                    time: { value: 0 },
                    waveHeight: { value: 20.0 },
                    colorNegative: { value: new THREE.Color(0x00ffff) },
                    colorPositive: { value: new THREE.Color(0xff00ff) },
                },
                vertexShader: `
                    varying float vHeight;
                    void main() {
                        vHeight = position.z;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform vec3 colorNegative;
                    uniform vec3 colorPositive;
                    varying float vHeight;
                    void main() {
                        float t = (vHeight + 10.0) / 20.0;
                        t = clamp(t, 0.0, 1.0);
                        vec3 color = mix(colorNegative, colorPositive, t);
                        gl_FragColor = vec4(color, 1.0);
                    }
                `,
                side: THREE.DoubleSide,
                wireframe: true // Start with wireframe for clarity
            });

            membraneMesh = new THREE.Mesh(geometry, material);
            membraneMesh.rotation.x = -Math.PI / 2;
            scene.add(membraneMesh);
        }

        // Main Initialization Function
        async function init() {
            console.log("rmix-BAE: Initializing...");

            setupScene();
            setupMembraneVisuals();

            const parser = new SchemaParser();
            const session = await parser.loadSession('./default-session.json');
            console.log("Session loaded:", session);

            paramController = new ParameterController(session);
            console.log("ParameterController initialized.");

            physicsWrapper = new MembranePhysicsWrapper(session, paramController);
            console.log("MembranePhysicsWrapper initialized.");

            const audioContext = new AudioContext();
            audioRouter = new AudioSourceRouter();
            fileManager = new AudioFileManager(audioContext);
            micInput = new MicrophoneInput(audioContext);

            audioRouter.registerSource('file', fileManager);
            audioRouter.registerSource('mic', micInput);
            console.log("Audio sources initialized and registered.");

            mappingEngine = new MappingCurveEngine(session);
            console.log("MappingCurveEngine initialized.");

            // TODO: User will implement UI components.
            // const playbackControls = new PlaybackControls(document.getElementById('playback-controls-container'), fileManager);
            // const loopUI = new LoopRegionUI(document.getElementById('loop-region-container'), fileManager.audioElement, new LoopController(fileManager.audioElement));

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            console.log("rmix-BAE: Initialization complete.");
            animate();
        }

        // Animation Loop
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const deltaTime = clock.getDelta() * 1000;

            if (paramController) {
                paramController.update(deltaTime);
            }

            if (physicsWrapper) {
                physicsWrapper.update(deltaTime);
                const heightData = physicsWrapper.getHeightData();
                if (heightData) {
                    const positions = membraneMesh.geometry.attributes.position.array;
                    for (let i = 0; i < heightData.length; i++) {
                        positions[i * 3 + 2] = heightData[i] * material.uniforms.waveHeight.value;
                    }
                    membraneMesh.geometry.attributes.position.needsUpdate = true;
                    membraneMesh.geometry.computeVertexNormals();
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        init();

    </script>
</body>
</html>
