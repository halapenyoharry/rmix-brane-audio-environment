<!DOCTYPE html>
<html>
<head>
    <title>JACK Bridge Template</title>
    <style>
        body { 
            font-family: system-ui; 
            margin: 40px; 
            background: #1a1a1a;
            color: #eee;
        }
        .status {
            padding: 20px;
            background: #222;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .audio-controls {
            margin: 20px 0;
        }
        button { 
            padding: 10px 20px; 
            margin: 5px;
            font-size: 14px;
            background: #333;
            color: #fff;
            border: 2px solid #666;
            cursor: pointer;
            border-radius: 6px;
        }
        button:hover {
            background: #444;
            border-color: #888;
        }
        button.active {
            background: #0a84ff;
            border-color: #0a84ff;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <h1>JACK Bridge Template</h1>
    
    <div class="status">
        <div>JACK Extension: <span id="jack-status" style="color: #888;">Checking...</span></div>
        <div>Audio System: <span id="audio-status" style="color: #888;">Not initialized</span></div>
    </div>

    <div class="audio-controls">
        <button id="init-jack">Initialize JACK Audio</button>
        <button id="init-browser" class="hidden">Use Browser Audio (Fallback)</button>
        <button id="stop-audio" class="hidden">Stop Audio</button>
    </div>

    <div id="app-content">
        <!-- Your app content goes here -->
        <p>Audio system ready. Add your visualization, controls, or other content here.</p>
        
        <!-- Example: Simple volume meter -->
        <div id="volume-meter" class="hidden">
            <h3>Audio Level</h3>
            <div style="width: 300px; height: 20px; background: #333; border-radius: 10px; overflow: hidden;">
                <div id="level-bar" style="height: 100%; background: linear-gradient(to right, #0f0, #ff0, #f00); width: 0%; transition: width 0.1s;"></div>
            </div>
        </div>
    </div>

    <script>
        // JACK Bridge Template
        let audioContext = null;
        let audioStream = null;
        let audioAnalyser = null;
        let isUsingJack = false;
        let isInitialized = false;

        // Check for JACK bridge extension
        async function checkJackExtension() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const hasJack = devices.some(d => d.deviceId === 'jack-system-capture');
                
                if (hasJack) {
                    document.getElementById('jack-status').textContent = 'Available';
                    document.getElementById('jack-status').style.color = '#0f0';
                    return true;
                } else {
                    document.getElementById('jack-status').textContent = 'Not Found - Browser Fallback Only';
                    document.getElementById('jack-status').style.color = '#ff0';
                    document.getElementById('init-browser').classList.remove('hidden');
                    return false;
                }
            } catch (error) {
                document.getElementById('jack-status').textContent = 'Error: ' + error.message;
                document.getElementById('jack-status').style.color = '#f00';
                return false;
            }
        }

        // Initialize JACK audio
        async function initializeJackAudio() {
            try {
                console.log('Initializing JACK audio...');
                
                audioStream = await navigator.mediaDevices.getUserMedia({
                    audio: { deviceId: 'jack-system-capture' }
                });
                
                audioContext = new AudioContext();
                const source = audioContext.createMediaStreamSource(audioStream);
                
                // Create analyser for basic audio processing
                audioAnalyser = audioContext.createAnalyser();
                audioAnalyser.fftSize = 256;
                audioAnalyser.smoothingTimeConstant = 0.8;
                source.connect(audioAnalyser);
                
                isUsingJack = true;
                isInitialized = true;
                
                document.getElementById('audio-status').textContent = 'JACK Connected';
                document.getElementById('audio-status').style.color = '#0f0';
                document.getElementById('init-jack').classList.add('hidden');
                document.getElementById('stop-audio').classList.remove('hidden');
                document.getElementById('volume-meter').classList.remove('hidden');
                
                // Start basic audio monitoring
                startAudioMonitoring();
                
                console.log('JACK audio initialized successfully');
                return true;
                
            } catch (error) {
                console.error('Failed to initialize JACK audio:', error);
                document.getElementById('audio-status').textContent = 'JACK Failed - Try Browser Audio';
                document.getElementById('audio-status').style.color = '#f00';
                document.getElementById('init-browser').classList.remove('hidden');
                return false;
            }
        }

        // Initialize browser audio (fallback)
        async function initializeBrowserAudio() {
            try {
                console.log('Initializing browser audio...');
                
                audioStream = await navigator.mediaDevices.getUserMedia({
                    audio: true
                });
                
                audioContext = new AudioContext();
                const source = audioContext.createMediaStreamSource(audioStream);
                
                // Create analyser for basic audio processing
                audioAnalyser = audioContext.createAnalyser();
                audioAnalyser.fftSize = 256;
                audioAnalyser.smoothingTimeConstant = 0.8;
                source.connect(audioAnalyser);
                
                isUsingJack = false;
                isInitialized = true;
                
                document.getElementById('audio-status').textContent = 'Browser Audio Connected';
                document.getElementById('audio-status').style.color = '#0f0';
                document.getElementById('init-browser').classList.add('hidden');
                document.getElementById('stop-audio').classList.remove('hidden');
                document.getElementById('volume-meter').classList.remove('hidden');
                
                // Start basic audio monitoring
                startAudioMonitoring();
                
                console.log('Browser audio initialized successfully');
                return true;
                
            } catch (error) {
                console.error('Failed to initialize browser audio:', error);
                document.getElementById('audio-status').textContent = 'Audio Failed: ' + error.message;
                document.getElementById('audio-status').style.color = '#f00';
                return false;
            }
        }

        // Stop audio
        function stopAudio() {
            if (audioStream) {
                audioStream.getTracks().forEach(track => track.stop());
                audioStream = null;
            }
            
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
            
            isInitialized = false;
            audioAnalyser = null;
            
            document.getElementById('audio-status').textContent = 'Stopped';
            document.getElementById('audio-status').style.color = '#888';
            document.getElementById('init-jack').classList.remove('hidden');
            document.getElementById('init-browser').classList.add('hidden');
            document.getElementById('stop-audio').classList.add('hidden');
            document.getElementById('volume-meter').classList.add('hidden');
            
            console.log('Audio stopped');
        }

        // Basic audio monitoring (example implementation)
        function startAudioMonitoring() {
            if (!audioAnalyser) return;
            
            const bufferLength = audioAnalyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            
            function updateLevel() {
                if (!isInitialized || !audioAnalyser) return;
                
                audioAnalyser.getByteFrequencyData(dataArray);
                
                // Calculate RMS level
                let sum = 0;
                for (let i = 0; i < bufferLength; i++) {
                    sum += dataArray[i] * dataArray[i];
                }
                const rms = Math.sqrt(sum / bufferLength);
                const level = (rms / 255) * 100;
                
                // Update volume meter
                const levelBar = document.getElementById('level-bar');
                if (levelBar) {
                    levelBar.style.width = level + '%';
                }
                
                requestAnimationFrame(updateLevel);
            }
            
            updateLevel();
        }

        // Event listeners
        document.getElementById('init-jack').addEventListener('click', initializeJackAudio);
        document.getElementById('init-browser').addEventListener('click', initializeBrowserAudio);
        document.getElementById('stop-audio').addEventListener('click', stopAudio);

        // Initialize on load
        window.addEventListener('load', () => {
            setTimeout(checkJackExtension, 500);
        });

        // Export functions for your app to use
        window.JackBridge = {
            isInitialized: () => isInitialized,
            isUsingJack: () => isUsingJack,
            getAudioContext: () => audioContext,
            getAudioAnalyser: () => audioAnalyser,
            getAudioStream: () => audioStream
        };
    </script>
</body>
</html>
