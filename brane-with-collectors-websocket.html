<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Audio-Reactive Membrane - Fixed</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0e27; /* midnight alaska */
            color: #00e5ff; /* intense cyan */
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            overflow: hidden;
            height: 100vh;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% - 120px);
        }

        /* Tile Control System */
        #controls-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 120px;
            padding: 20px;
            display: flex;
            gap: 12px;
            align-items: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-x: auto;
            overflow-y: hidden;
            background: rgba(10, 14, 39, 0.3);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 100;
            user-select: none;
            -webkit-user-select: none;
        }

        #controls-container.hidden {
            height: 0;
            padding: 0;
            overflow: hidden;
        }

        .control-tile {
            height: 80px;
            background: rgba(10, 14, 39, 0.6);
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 8px;
            padding: 12px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            min-width: 100px;
            flex-shrink: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        .control-tile:hover {
            border-color: rgba(0, 229, 255, 0.5);
            background: rgba(10, 14, 39, 0.8);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
        }

        .control-tile.dragging {
            opacity: 0.5;
            border-color: rgba(0, 229, 255, 0.7) !important;
        }

        .drag-handle {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 20px;
            height: 20px;
            cursor: pointer;
            overflow: hidden;
        }

        .drag-handle::before,
        .drag-handle::after,
        .drag-handle span {
            position: absolute;
            height: 2px;
            background: #00e5ff;
            opacity: 0.3;
            right: 0;
        }

        .drag-handle::before {
            content: '';
            width: 14px;
            bottom: 2px;
        }

        .drag-handle::after {
            content: '';
            width: 10px;
            bottom: 6px;
        }

        .drag-handle span {
            width: 6px;
            bottom: 10px;
        }

        .drag-handle:hover::before,
        .drag-handle:hover::after,
        .drag-handle:hover span {
            opacity: 0.7;
        }

        .resize-handle {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: transparent;
            cursor: pointer;
        }

        .resize-handle:hover {
            background: rgba(0, 229, 255, 0.4);
        }

        .param-visual {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tile-label {
            position: absolute;
            bottom: -18px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 9px;
            color: #00e5ff;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tile-label.visible {
            opacity: 0.8;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00e5ff;
            font-size: 18px;
            z-index: 200;
        }
    </style>
</head>
<body>
    <div id="loading">Loading Three.js...</div>
    <div id="canvas-container"></div>

    <!-- Tile-based control panel -->
    <div id="controls-container">
        <!-- Tiles will be created dynamically by JavaScript -->
    </div>

    <!-- Load Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- Load D3.js for UI controls -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    
    <script>
        // Hide loading once Three.js loads
        document.getElementById('loading').style.display = 'none';

        // Scene setup with Harold's midnight alaska aesthetic
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0e27);

        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.01,
            5000
        );
        camera.position.set(100, 80, 100);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            canvas: document.createElement('canvas')
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Lighting optimized for Harold's colors
        const ambientLight = new THREE.AmbientLight(0x1a237e, 0.4);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0x00e5ff, 0.6);
        directionalLight.position.set(100, 100, 50);
        scene.add(directionalLight);

        // 3D Membrane
        let gridSize = 100;
        const membraneSize = 200;
        let geometry = new THREE.PlaneGeometry(membraneSize, membraneSize, gridSize, gridSize);

        // Custom shader material for Harold's aesthetic
        const material = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                waveHeight: { value: 20.0 },
                colorNegative: { value: new THREE.Color(0x00ffff) },
                colorPositive: { value: new THREE.Color(0xff00ff) },
                opacity: { value: 1.0 }
            },
            vertexShader: `
                varying vec3 vNormal;
                varying vec3 vPosition;
                varying float vHeight;

                void main() {
                    vPosition = position;
                    vHeight = position.z;
                    vNormal = normal;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform vec3 colorNegative;
                uniform vec3 colorPositive;
                uniform float opacity;
                uniform float time;

                varying vec3 vNormal;
                varying vec3 vPosition;
                varying float vHeight;

                void main() {
                    float t = (vHeight + 10.0) / 20.0;
                    t = clamp(t, 0.0, 1.0);

                    vec3 color = mix(colorNegative, colorPositive, t);

                    vec3 lightDir = normalize(vec3(1.0, 1.0, 1.0));
                    float diff = max(dot(vNormal, lightDir), 0.0);
                    color *= (0.7 + diff * 0.3);

                    gl_FragColor = vec4(color, opacity);
                }
            `,
            transparent: false,
            side: THREE.DoubleSide,
            wireframe: false,
            depthWrite: true,
            depthTest: true
        });

        let membrane = new THREE.Mesh(geometry, material);
        membrane.rotation.x = -Math.PI / 2;
        scene.add(membrane);

        // Physics arrays
        let heights = [];
        let velocities = [];
        let waveSpeed = 0.3;
        let damping = 0.00265;

        function initializeArrays() {
            heights = new Array(gridSize + 1);
            velocities = new Array(gridSize + 1);
            for (let i = 0; i <= gridSize; i++) {
                heights[i] = new Array(gridSize + 1).fill(0);
                velocities[i] = new Array(gridSize + 1).fill(0);
            }
        }

        // Actuator and Collector system
        let actuators = [];
        let collectors = [];
        let audioEnabled = false;
        let demoMode = false;
        let audioContext = null;
        let audioAnalyser = null;
        let audioDataArray = null;
        let audioStream = null;
        let websocket = null;
        let outputEnabled = false;

        // Stereo channel analysers
        let leftAnalyser = null;
        let rightAnalyser = null;
        let leftAudioData = null;
        let rightAudioData = null;

        // Audio file playback
        let audioElement = null;
        let audioFileMode = false;

        // Audio output for collectors
        let outputContext = null;
        let outputProcessor = null;
        let audioOutputEnabled = false;

        // Actuator class
        class Actuator {
            constructor(x, y, channel = 'mono') {
                this.x = x;
                this.y = y;
                this.gridX = Math.round(((y + membraneSize/2) / membraneSize) * gridSize);
                this.gridY = Math.round(((x + membraneSize/2) / membraneSize) * gridSize);
                this.channel = channel;
                this.gain = 1.0;
                this.visual = null;
                this.demoPhase = Math.random() * Math.PI * 2;
            }

            apply() {
                let force = 0;
                
                if (demoMode) {
                    // Demo sine waves
                    const time = Date.now() * 0.001;
                    force = Math.sin(time * 2 + this.demoPhase) * 2;
                } else if (audioEnabled && leftAudioData && rightAudioData) {
                    // Use actual audio samples from correct channel
                    let sum = 0;
                    let audioData;

                    // Select the correct channel data
                    if (this.channel === 'left') {
                        audioData = leftAudioData;
                    } else if (this.channel === 'right') {
                        audioData = rightAudioData;
                    } else {
                        // Mono - mix both channels
                        // Average samples from both L and R
                        for (let i = 0; i < leftAudioData.length; i++) {
                            sum += leftAudioData[i] + rightAudioData[i];
                        }
                        const avg = sum / (leftAudioData.length * 2);
                        force = ((avg - 128) / 128) * 3;
                        audioData = null;  // Skip single-channel processing below
                    }

                    // Process single channel (left or right)
                    if (audioData) {
                        for (let i = 0; i < audioData.length; i++) {
                            sum += audioData[i];
                        }
                        const avg = sum / audioData.length;
                        // Convert audio sample to force: 128 = 0, 0 = -max, 255 = +max
                        force = ((avg - 128) / 128) * 3;
                    }
                }

                // Apply force to membrane as an actuator
                if (this.gridX >= 0 && this.gridX <= gridSize &&
                    this.gridY >= 0 && this.gridY <= gridSize) {
                    // Apply audio force to membrane
                    velocities[this.gridX][this.gridY] += force * 0.1;
                    
                    // Keep ball at fixed height above membrane rest position
                    if (this.visual) {
                        this.visual.position.y = 2; // Fixed height
                    }
                }
            }
        }

        // Collector class - samples membrane to produce audio
        class Collector {
            constructor(x, y, config = {}) {
                this.x = x;
                this.y = y;
                this.gridX = Math.round(((y + membraneSize/2) / membraneSize) * gridSize);
                this.gridY = Math.round(((x + membraneSize/2) / membraneSize) * gridSize);

                // Universal settings
                this.mode = config.mode || 'velocity';  // 'displacement', 'velocity', 'acceleration'
                this.gain = config.gain || 50.0;  // Increased from 5.0
                this.name = config.name || 'collector';
                this.channel = config.channel || 'mono'; // 'left', 'right', 'mono'
                this.visual = null;

                // For debugging
                this.lastSample = 0;
                this.peakLevel = 0;
            }

            sample() {
                let signal = 0;

                // Read membrane state based on mode
                if (this.gridX >= 0 && this.gridX <= gridSize &&
                    this.gridY >= 0 && this.gridY <= gridSize) {

                    switch(this.mode) {
                        case 'displacement':
                            signal = heights[this.gridX][this.gridY];
                            break;
                        case 'velocity':
                            signal = velocities[this.gridX][this.gridY];
                            break;
                        case 'acceleration':
                            // TODO: compute from velocity derivative
                            signal = velocities[this.gridX][this.gridY];
                            break;
                    }
                }

                // Apply gain
                signal *= this.gain;

                // Clamp to audio range
                signal = Math.max(-1.0, Math.min(1.0, signal));

                // Track for visualization
                this.lastSample = signal;
                this.peakLevel = Math.max(this.peakLevel * 0.99, Math.abs(signal));

                return signal;
            }
        }

        // Helper functions for membrane operations
        function resetMembrane() {
            initializeArrays();
        }

        function clearActuators() {
            actuators.forEach(act => {
                if (act.visual) scene.remove(act.visual);
            });
            actuators = [];
            updateCounts();
        }

        function clearCollectors() {
            collectors.forEach(col => {
                if (col.visual) scene.remove(col.visual);
            });
            collectors = [];
            updateCounts();
        }

        // Audio control wrappers for tiles
        async function connectJACK() {
            const success = await initJackAudio();
            if (success) {
                audioEnabled = true;
                demoMode = false;
                updateAudioInputToggles();
            }
        }

        function loadAudioFile() {
            initAudioFile();
            // Update will happen in initAudioFile callback
        }

        function toggleAudioOutput() {
            if (!outputEnabled) {
                initAudioOutput();
            } else {
                stopAudioOutput();
            }
            updateAudioOutputToggle();
        }

        // Add actuator
        function addActuator(x, y, channel = 'mono') {
            const actuator = new Actuator(x, y, channel);
            actuators.push(actuator);

            const color = channel === 'left' ? 0xff00ff : (channel === 'right' ? 0x00ffff : 0xffff00);
            const indicator = new THREE.Mesh(
                new THREE.SphereGeometry(2, 16, 16),
                new THREE.MeshBasicMaterial({
                    color: color,
                    emissive: color,
                    emissiveIntensity: 0.5,
                    transparent: true,
                    opacity: 0.7
                })
            );
            indicator.position.set(x, 2, y);
            scene.add(indicator);
            actuator.visual = indicator;

            updateCounts();
            return actuator;
        }

        // Add collector
        function addCollector(x, y, config = {}) {
            const collector = new Collector(x, y, config);
            collectors.push(collector);

            // Green wireframe sphere to distinguish from actuators
            const color = config.channel === 'left' ? 0x00ff00 : (config.channel === 'right' ? 0x00ff88 : 0x00ff44);
            const indicator = new THREE.Mesh(
                new THREE.SphereGeometry(1.5, 16, 16),
                new THREE.MeshBasicMaterial({
                    color: color,
                    wireframe: true,
                    transparent: true,
                    opacity: 0.8
                })
            );
            indicator.position.set(x, 4, y); // Higher than actuators
            scene.add(indicator);
            collector.visual = indicator;

            updateCounts();
            console.log(`Added collector at (${x.toFixed(1)}, ${y.toFixed(1)}) - ${config.channel || 'mono'} - ${config.mode || 'velocity'}`);
            return collector;
        }

        // Initialize audio file playback
        function initAudioFile() {
            // Create hidden file input
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'audio/*';

            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                console.log('Loading audio file:', file.name);

                // Create audio element if needed
                if (!audioElement) {
                    audioElement = new Audio();
                    audioElement.loop = true;
                    audioElement.controls = false; // Hidden for now, can add UI later
                }

                // Create audio context and analyser
                if (!audioContext) {
                    audioContext = new AudioContext();
                }

                if (!audioAnalyser) {
                    audioAnalyser = audioContext.createAnalyser();
                    audioAnalyser.fftSize = 256;
                    audioAnalyser.smoothingTimeConstant = 0.8;
                    audioDataArray = new Uint8Array(audioAnalyser.frequencyBinCount);
                }

                // Load file
                const url = URL.createObjectURL(file);
                audioElement.src = url;

                // Connect to analyser
                const source = audioContext.createMediaElementSource(audioElement);
                source.connect(audioAnalyser);
                source.connect(audioContext.destination); // Hear it too

                // Start playback
                audioElement.play();

                audioFileMode = true;
                audioEnabled = true;
                demoMode = false;

                document.getElementById('audio-indicator').textContent = 'FILE';
                document.getElementById('audio-indicator').style.color = '#00ff00';
                document.getElementById('mode-display').textContent = 'FILE: ' + file.name.substring(0, 15);

                console.log('Audio file loaded and playing');
            };

            input.click();
        }

        // Initialize JACK audio through extension
        async function initJackAudio() {
            try {
                console.log('Requesting JACK audio access...');

                // Check if JACK bridge is available
                const devices = await navigator.mediaDevices.enumerateDevices();
                const jackDevice = devices.find(d => d.deviceId === 'jack-system-capture');

                if (!jackDevice) {
                    throw new Error('JACK Bridge extension not installed or running');
                }

                // Request JACK audio stream
                audioStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        deviceId: 'jack-system-capture',
                        channelCount: 2  // Request stereo
                    }
                });

                // Create audio context
                audioContext = new AudioContext();
                const source = audioContext.createMediaStreamSource(audioStream);

                // Create channel splitter for true stereo separation
                const splitter = audioContext.createChannelSplitter(2);
                source.connect(splitter);

                // Create separate analysers for left and right channels
                leftAnalyser = audioContext.createAnalyser();
                leftAnalyser.fftSize = 256;
                leftAnalyser.smoothingTimeConstant = 0.3;

                rightAnalyser = audioContext.createAnalyser();
                rightAnalyser.fftSize = 256;
                rightAnalyser.smoothingTimeConstant = 0.3;

                // Connect split channels to their analysers
                splitter.connect(leftAnalyser, 0);   // Channel 0 = Left
                splitter.connect(rightAnalyser, 1);  // Channel 1 = Right

                // Create data arrays for each channel
                leftAudioData = new Uint8Array(leftAnalyser.fftSize);
                rightAudioData = new Uint8Array(rightAnalyser.fftSize);

                console.log('JACK audio connected - stereo channels separated');
                return true;

            } catch (error) {
                console.error('Failed to connect to JACK:', error);
                alert('Failed to connect to JACK audio: ' + error.message + '\n\nMake sure:\n1. Zen JACK Bridge extension is loaded\n2. JACK server is running\n3. zen-jack-bridge client appears in patchbay');
                return false;
            }
        }

        // Update audio data from stereo channels
        function updateAudioData() {
            if (audioEnabled && leftAnalyser && rightAnalyser && leftAudioData && rightAudioData) {
                leftAnalyser.getByteTimeDomainData(leftAudioData);
                rightAnalyser.getByteTimeDomainData(rightAudioData);
            }
        }

        // WebSocket connection for output
        function connectWebSocket() {
            try {
                console.log('Connecting to WebSocket output bridge...');
                websocket = new WebSocket('ws://localhost:9001');

                websocket.onopen = () => {
                    console.log('WebSocket connected!');
                    outputEnabled = true;
                    document.getElementById('output-indicator').textContent = 'WEBSOCKET';
                    document.getElementById('output-indicator').style.color = '#00ff00';
                };

                websocket.onerror = (error) => {
                    console.error('WebSocket error:', error);
                    alert('Failed to connect to WebSocket bridge.\n\nMake sure the JACK bridge server is running on port 9001.');
                };

                websocket.onclose = () => {
                    console.log('WebSocket disconnected');
                    outputEnabled = false;
                    document.getElementById('output-indicator').textContent = 'OFF';
                    document.getElementById('output-indicator').style.color = '#ff0000';
                };

            } catch (error) {
                console.error('Failed to create WebSocket:', error);
                alert('WebSocket connection failed: ' + error.message);
            }
        }

        function disconnectWebSocket() {
            if (websocket) {
                websocket.close();
                websocket = null;
            }
            outputEnabled = false;
            document.getElementById('output-indicator').textContent = 'OFF';
            document.getElementById('output-indicator').style.color = '#ff0000';
        }

        // Initialize audio output for collectors
        function initAudioOutput() {
            if (audioOutputEnabled) {
                console.log('Audio output already enabled');
                return;
            }

            if (!outputContext) {
                outputContext = new (window.AudioContext || window.webkitAudioContext)();
            }

            // Create ScriptProcessorNode (4096 buffer size for smooth playback)
            outputProcessor = outputContext.createScriptProcessor(4096, 0, 2);

            let lastLeft = 0;
            let lastRight = 0;

            outputProcessor.onaudioprocess = (e) => {
                const outputL = e.outputBuffer.getChannelData(0);
                const outputR = e.outputBuffer.getChannelData(1);

                // Sample collectors once per buffer (not per sample)
                let targetLeft = 0;
                let targetRight = 0;

                collectors.forEach(collector => {
                    const sample = collector.sample();

                    if (collector.channel === 'left') {
                        targetLeft += sample;
                    } else if (collector.channel === 'right') {
                        targetRight += sample;
                    } else {
                        // Mono - send to both
                        targetLeft += sample;
                        targetRight += sample;
                    }
                });

                // Interpolate from last to target
                for (let i = 0; i < outputL.length; i++) {
                    const t = i / outputL.length;
                    outputL[i] = lastLeft + (targetLeft - lastLeft) * t;
                    outputR[i] = lastRight + (targetRight - lastRight) * t;
                }

                lastLeft = targetLeft;
                lastRight = targetRight;
            };

            // Connect to speakers (which Firefox routes to JACK)
            outputProcessor.connect(outputContext.destination);

            audioOutputEnabled = true;
            document.getElementById('output-indicator').textContent = 'AUDIO';
            document.getElementById('output-indicator').style.color = '#00ff00';

            console.log('Audio output enabled - routing to Firefox JACK output');
        }

        function stopAudioOutput() {
            if (outputProcessor) {
                outputProcessor.disconnect();
                outputProcessor = null;
            }
            if (outputContext) {
                outputContext.close();
                outputContext = null;
            }
            audioOutputEnabled = false;
            document.getElementById('output-indicator').textContent = 'OFF';
            document.getElementById('output-indicator').style.color = '#ff0000';
            console.log('Audio output stopped');
        }

        // Send collector samples to WebSocket (legacy, can remove if not using)
        function sendCollectorSamples() {
            if (!outputEnabled || !websocket || websocket.readyState !== WebSocket.OPEN) {
                return;
            }

            // Sample all collectors
            const samples = collectors.map(collector => collector.sample());

            if (samples.length > 0) {
                // Send as Float32Array for efficiency
                const buffer = new Float32Array(samples);
                websocket.send(buffer);
            }
        }

        // Physics update
        function updatePhysics() {
            const newHeights = new Array(gridSize + 1).fill(0).map(() => new Array(gridSize + 1).fill(0));

            // Wave equation
            for (let i = 1; i < gridSize; i++) {
                for (let j = 1; j < gridSize; j++) {
                    const laplacian = (
                        heights[i + 1][j] + heights[i - 1][j] +
                        heights[i][j + 1] + heights[i][j - 1] -
                        4 * heights[i][j]
                    );

                    velocities[i][j] += waveSpeed * waveSpeed * laplacian;
                    velocities[i][j] *= (1 - damping);
                    newHeights[i][j] = heights[i][j] + velocities[i][j];
                }
            }

            // Fixed boundaries
            for (let i = 0; i <= gridSize; i++) {
                newHeights[0][i] = 0;
                newHeights[gridSize][i] = 0;
                newHeights[i][0] = 0;
                newHeights[i][gridSize] = 0;
            }

            heights = newHeights;

            // Update geometry
            const positions = membrane.geometry.attributes.position.array;
            for (let i = 0; i <= gridSize; i++) {
                for (let j = 0; j <= gridSize; j++) {
                    const index = (i * (gridSize + 1) + j) * 3 + 2;
                    positions[index] = heights[i][j] * material.uniforms.waveHeight.value;
                }
            }

            membrane.geometry.attributes.position.needsUpdate = true;
            membrane.geometry.computeVertexNormals();
        }

        // Mouse interaction
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        renderer.domElement.addEventListener('click', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            // First check if clicking on actuator or collector to remove
            let clickedSphere = false;

            // Check actuators
            for (let i = actuators.length - 1; i >= 0; i--) {
                if (actuators[i].visual) {
                    const intersects = raycaster.intersectObject(actuators[i].visual);
                    if (intersects.length > 0) {
                        scene.remove(actuators[i].visual);
                        actuators.splice(i, 1);
                        updateCounts();
                        clickedSphere = true;
                        break;
                    }
                }
            }

            // Check collectors if no actuator was clicked
            if (!clickedSphere) {
                for (let i = collectors.length - 1; i >= 0; i--) {
                    if (collectors[i].visual) {
                        const intersects = raycaster.intersectObject(collectors[i].visual);
                        if (intersects.length > 0) {
                            scene.remove(collectors[i].visual);
                            collectors.splice(i, 1);
                            updateCounts();
                            clickedSphere = true;
                            break;
                        }
                    }
                }
            }

            // If no sphere clicked, add new one on membrane
            if (!clickedSphere) {
                const intersects = raycaster.intersectObject(membrane);

                if (intersects.length > 0) {
                    const point = intersects[0].point;
                    let channel = 'mono';
                    if (point.x < -20) channel = 'left';
                    else if (point.x > 20) channel = 'right';

                    // Shift+Click adds collector, regular click adds actuator
                    if (event.shiftKey) {
                        addCollector(point.x, point.z, { channel: channel });
                    } else {
                        addActuator(point.x, point.z, channel);
                    }
                }
            }
        });

        // Keyboard controls
        document.addEventListener('keydown', async (e) => {
            // Shift+H to toggle controls
            if (e.shiftKey && (e.key === 'h' || e.key === 'H')) {
                const container = document.getElementById('controls-container');
                controlsHidden = !controlsHidden;
                container.classList.toggle('hidden');
                handleResize();
                return;
            }

            if (e.key === 'a' || e.key === 'A') {
                // Toggle JACK audio
                if (!audioEnabled) {
                    const success = await initJackAudio();
                    if (success) {
                        audioEnabled = true;
                        demoMode = false;
                        updateAudioInputToggles();
                    }
                } else {
                    audioEnabled = false;
                    if (audioStream) {
                        audioStream.getTracks().forEach(track => track.stop());
                    }
                    if (audioContext) {
                        audioContext.close();
                    }
                    updateAudioInputToggles();
                }
            } else if (e.key === 'f' || e.key === 'F') {
                // Toggle fullscreen
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                } else {
                    document.exitFullscreen();
                }
            } else if (e.key === 'l' || e.key === 'L') {
                // Load audio file
                initAudioFile();
            } else if (e.key === 'd' || e.key === 'D') {
                // Toggle demo mode
                demoMode = !demoMode;

                if (demoMode) {
                    audioEnabled = false;
                    audioFileMode = false;
                    if (audioElement) {
                        audioElement.pause();
                    }
                }
                updateAudioInputToggles();
            } else if (e.key === 'o' || e.key === 'O') {
                // Toggle audio output
                if (!audioOutputEnabled) {
                    initAudioOutput();
                } else {
                    stopAudioOutput();
                }
            } else if (e.key === 'r' || e.key === 'R') {
                resetMembrane();
            } else if (e.key === 'c' || e.key === 'C') {
                clearActuators();
            } else if (e.key === 'm' || e.key === 'M') {
                clearCollectors();
            }
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            // Update audio data from JACK
            updateAudioData();

            // Apply actuators
            actuators.forEach(actuator => {
                actuator.apply();
            });

            updatePhysics();

            // Collectors sample automatically in audio processor callback

            material.uniforms.time.value = Date.now() * 0.001;

            controls.update();
            renderer.render(scene, camera);
        }

        // ============================================
        // TILE CONTROL SYSTEM
        // ============================================

        let controlsHidden = false;

        // Tile configuration
        const tiles = [
            { id: 'audio-input', type: 'audio-input', width: 140 },
            { id: 'audio-output', type: 'audio-output', width: 100 },
            { id: 'membrane-ops', type: 'membrane-ops', width: 120 },
            { id: 'counts', type: 'counts', width: 150 },
            { id: 'physics', type: 'physics', width: 200 },
            { id: 'view', type: 'view', width: 100 }
        ];

        // Create all tiles
        function createTiles() {
            const container = document.getElementById('controls-container');

            tiles.forEach(tileConfig => {
                const tileDiv = document.createElement('div');
                tileDiv.className = 'control-tile';
                tileDiv.id = `tile-${tileConfig.id}`;
                tileDiv.style.width = `${tileConfig.width}px`;
                tileDiv.setAttribute('data-id', tileConfig.id);

                // Add resize handle
                const resizeHandle = document.createElement('div');
                resizeHandle.className = 'resize-handle';
                tileDiv.appendChild(resizeHandle);

                // Add drag handle
                const dragHandle = document.createElement('div');
                dragHandle.className = 'drag-handle';
                const dragSpan = document.createElement('span');
                dragHandle.appendChild(dragSpan);
                tileDiv.appendChild(dragHandle);

                // Add visual container
                const visual = document.createElement('div');
                visual.className = 'param-visual';
                tileDiv.appendChild(visual);

                // Add label area
                const label = document.createElement('div');
                label.className = 'tile-label';
                tileDiv.appendChild(label);

                // Create tile content based on type
                if (tileConfig.type === 'audio-input') {
                    createAudioInputTile(visual, label);
                } else if (tileConfig.type === 'audio-output') {
                    createAudioOutputTile(visual, label);
                } else if (tileConfig.type === 'membrane-ops') {
                    createMembraneOpsTile(visual, label);
                } else if (tileConfig.type === 'counts') {
                    createCountsTile(visual, label);
                } else if (tileConfig.type === 'physics') {
                    createPhysicsTile(visual, label);
                } else if (tileConfig.type === 'view') {
                    createViewTile(visual, label);
                }

                container.appendChild(tileDiv);
            });

            enableTileDragging();
            enableResizing();
        }

        // ============================================
        // INDIVIDUAL TILE CREATORS
        // ============================================

        // AUDIO INPUT TILE - Three mode toggles (DEMO/FILE/JACK)
        function createAudioInputTile(visual, label) {
            const container = document.createElement('div');
            container.style.cssText = 'display: flex; flex-direction: column; gap: 6px; width: 100%; height: 100%; justify-content: center; align-items: center;';

            const modes = ['demo', 'file', 'jack'];
            const modeLabels = { demo: 'Demo Mode', file: 'Load File', jack: 'JACK Input' };
            const modeToggles = {};

            modes.forEach((mode, index) => {
                const modeRow = document.createElement('div');
                modeRow.style.cssText = 'display: flex; align-items: center; gap: 8px;';

                const indicator = document.createElement('div');
                indicator.style.cssText = `
                    width: 12px; height: 12px;
                    background: ${demoMode && mode === 'demo' || audioEnabled && mode === 'jack' ? '#00ff00' : 'rgba(0, 229, 255, 0.2)'};
                    border-radius: 50%;
                    transition: background 0.2s;
                    box-shadow: ${demoMode && mode === 'demo' || audioEnabled && mode === 'jack' ? '0 0 8px #00ff00' : 'none'};
                `;
                modeToggles[mode] = indicator;

                const toggle = document.createElement('div');
                toggle.style.cssText = `
                    width: 36px; height: 16px;
                    background: rgba(0, 229, 255, ${demoMode && mode === 'demo' || audioEnabled && mode === 'jack' ? '0.4' : '0.2'});
                    border-radius: 8px;
                    position: relative;
                    cursor: pointer;
                    transition: background 0.2s;
                `;

                const knob = document.createElement('div');
                knob.style.cssText = `
                    position: absolute;
                    width: 12px; height: 12px;
                    background: #00e5ff;
                    border-radius: 50%;
                    top: 2px;
                    left: ${demoMode && mode === 'demo' || audioEnabled && mode === 'jack' ? '22px' : '2px'};
                    transition: left 0.2s;
                `;
                toggle.appendChild(knob);

                toggle.addEventListener('click', () => {
                    if (mode === 'demo') {
                        // Toggle demo mode
                        demoMode = !demoMode;
                        if (demoMode) {
                            audioEnabled = false;
                        }
                    } else if (mode === 'file') {
                        // Trigger file load
                        loadAudioFile();
                    } else if (mode === 'jack') {
                        // Toggle JACK connection
                        if (!audioEnabled) {
                            connectJACK();
                        } else {
                            audioEnabled = false;
                            demoMode = false;
                        }
                    }

                    // Update all toggles
                    updateAudioInputToggles();
                });

                // Hover label
                modeRow.addEventListener('mouseenter', () => {
                    label.textContent = modeLabels[mode];
                    label.classList.add('visible');
                });
                modeRow.addEventListener('mouseleave', () => {
                    label.classList.remove('visible');
                });

                modeRow.appendChild(indicator);
                modeRow.appendChild(toggle);
                container.appendChild(modeRow);
            });

            visual.appendChild(container);

            // Store reference for updates
            visual.modeToggles = modeToggles;
        }

        function updateAudioInputToggles() {
            const tile = document.getElementById('tile-audio-input');
            if (!tile) return;

            const visual = tile.querySelector('.param-visual');
            if (!visual || !visual.modeToggles) return;

            const modes = {
                demo: demoMode,
                file: false, // momentary
                jack: audioEnabled && !demoMode
            };

            Object.keys(modes).forEach(mode => {
                const indicator = visual.modeToggles[mode];
                const isActive = modes[mode];

                indicator.style.background = isActive ? '#00ff00' : 'rgba(0, 229, 255, 0.2)';
                indicator.style.boxShadow = isActive ? '0 0 8px #00ff00' : 'none';

                const toggle = indicator.parentElement.querySelector('div:last-child');
                const knob = toggle.querySelector('div');
                toggle.style.background = `rgba(0, 229, 255, ${isActive ? '0.4' : '0.2'})`;
                knob.style.left = isActive ? '22px' : '2px';
            });
        }

        // AUDIO OUTPUT TILE - Single toggle for output
        function createAudioOutputTile(visual, label) {
            const container = document.createElement('div');
            container.style.cssText = 'display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; height: 100%;';

            const indicator = document.createElement('div');
            indicator.style.cssText = `
                width: 16px; height: 16px;
                background: ${outputEnabled ? '#00ff00' : 'rgba(0, 229, 255, 0.2)'};
                border-radius: 50%;
                transition: background 0.2s;
                box-shadow: ${outputEnabled ? '0 0 10px #00ff00' : 'none'};
            `;

            const toggle = document.createElement('div');
            toggle.style.cssText = `
                width: 48px; height: 24px;
                background: rgba(0, 229, 255, ${outputEnabled ? '0.4' : '0.2'});
                border-radius: 12px;
                position: relative;
                cursor: pointer;
                transition: background 0.2s;
            `;

            const knob = document.createElement('div');
            knob.style.cssText = `
                position: absolute;
                width: 20px; height: 20px;
                background: #00e5ff;
                border-radius: 50%;
                top: 2px;
                left: ${outputEnabled ? '26px' : '2px'};
                transition: left 0.2s;
            `;
            toggle.appendChild(knob);

            toggle.addEventListener('click', () => {
                toggleAudioOutput();
                updateAudioOutputToggle();
            });

            // Hover label
            container.addEventListener('mouseenter', () => {
                label.textContent = 'Audio Output';
                label.classList.add('visible');
            });
            container.addEventListener('mouseleave', () => {
                label.classList.remove('visible');
            });

            container.appendChild(indicator);
            container.appendChild(toggle);
            visual.appendChild(container);

            // Store reference
            visual.indicator = indicator;
            visual.toggle = toggle;
            visual.knob = knob;
        }

        function updateAudioOutputToggle() {
            const tile = document.getElementById('tile-audio-output');
            if (!tile) return;

            const visual = tile.querySelector('.param-visual');
            if (!visual || !visual.indicator) return;

            visual.indicator.style.background = outputEnabled ? '#00ff00' : 'rgba(0, 229, 255, 0.2)';
            visual.indicator.style.boxShadow = outputEnabled ? '0 0 10px #00ff00' : 'none';
            visual.toggle.style.background = `rgba(0, 229, 255, ${outputEnabled ? '0.4' : '0.2'})`;
            visual.knob.style.left = outputEnabled ? '26px' : '2px';
        }

        // MEMBRANE OPS TILE - Reset and clear buttons
        function createMembraneOpsTile(visual, label) {
            const container = document.createElement('div');
            container.style.cssText = 'display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; padding: 8px; width: 100%; height: 100%;';

            const ops = [
                { id: 'reset', color: '#ff5555', action: resetMembrane, label: 'Reset Membrane' },
                { id: 'clear-act', color: '#ff9955', action: clearActuators, label: 'Clear Actuators' },
                { id: 'clear-col', color: '#ff9955', action: clearCollectors, label: 'Clear Collectors' }
            ];

            ops.forEach(op => {
                const button = document.createElement('div');
                button.style.cssText = `
                    width: 100%; height: 100%;
                    background: rgba(${parseInt(op.color.substring(1,3), 16)}, ${parseInt(op.color.substring(3,5), 16)}, ${parseInt(op.color.substring(5,7), 16)}, 0.2);
                    border: 1px solid ${op.color};
                    border-radius: 50%;
                    cursor: pointer;
                    transition: all 0.2s;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                `;

                const dot = document.createElement('div');
                dot.style.cssText = `
                    width: 50%; height: 50%;
                    background: ${op.color};
                    border-radius: 50%;
                    transition: transform 0.1s;
                `;
                button.appendChild(dot);

                button.addEventListener('mousedown', () => {
                    dot.style.transform = 'scale(0.8)';
                });

                button.addEventListener('mouseup', () => {
                    dot.style.transform = 'scale(1)';
                    op.action();
                });

                button.addEventListener('mouseleave', () => {
                    dot.style.transform = 'scale(1)';
                });

                button.addEventListener('mouseenter', () => {
                    button.style.boxShadow = `0 0 10px ${op.color}`;
                    label.textContent = op.label;
                    label.classList.add('visible');
                });

                button.addEventListener('mouseleave', () => {
                    button.style.boxShadow = 'none';
                    label.classList.remove('visible');
                });

                container.appendChild(button);
            });

            visual.appendChild(container);
        }

        // COUNTS TILE - Actuator and collector counts
        function createCountsTile(visual, label) {
            const container = document.createElement('div');
            container.style.cssText = 'display: flex; flex-direction: column; gap: 8px; justify-content: center; height: 100%; padding: 8px;';

            // Hover label
            container.addEventListener('mouseenter', () => {
                label.textContent = 'Actuator & Collector Counts';
                label.classList.add('visible');
            });
            container.addEventListener('mouseleave', () => {
                label.classList.remove('visible');
            });

            // Actuator row
            const actRow = document.createElement('div');
            actRow.style.cssText = 'display: flex; gap: 4px; align-items: center; justify-content: space-around;';

            const actColors = ['#ff00ff', '#00ffff', '#ffff00'];
            actColors.forEach((color, i) => {
                const circle = document.createElement('div');
                circle.style.cssText = `
                    width: 14px; height: 14px;
                    background: ${color};
                    border-radius: 50%;
                    position: relative;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    font-size: 8px;
                    font-weight: bold;
                    color: #000;
                `;
                const count = document.createElement('span');
                count.textContent = '0';
                count.style.cssText = 'font-size: 7px; font-weight: bold;';
                circle.appendChild(count);
                circle.countSpan = count;
                actRow.appendChild(circle);

                if (i === 0) visual.leftCount = count;
                if (i === 1) visual.rightCount = count;
                if (i === 2) visual.monoCount = count;
            });

            // Collector row
            const colRow = document.createElement('div');
            colRow.style.cssText = 'display: flex; gap: 4px; align-items: center; justify-content: center;';

            const colCircle = document.createElement('div');
            colCircle.style.cssText = `
                width: 14px; height: 14px;
                background: #00ff00;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 8px;
                font-weight: bold;
                color: #000;
            `;
            const colCount = document.createElement('span');
            colCount.textContent = '0';
            colCount.style.cssText = 'font-size: 7px; font-weight: bold;';
            colCircle.appendChild(colCount);
            visual.collectorCount = colCount;
            colRow.appendChild(colCircle);

            container.appendChild(actRow);
            container.appendChild(colRow);
            visual.appendChild(container);
        }

        function updateCounts() {
            const tile = document.getElementById('tile-counts');
            if (!tile) return;

            const visual = tile.querySelector('.param-visual');
            if (!visual) return;

            let leftCnt = 0, rightCnt = 0, monoCnt = 0, collCnt = 0;

            actuators.forEach(act => {
                if (act.channel === 'left') leftCnt++;
                else if (act.channel === 'right') rightCnt++;
                else if (act.channel === 'mono') monoCnt++;
            });

            collCnt = collectors.length;

            if (visual.leftCount) visual.leftCount.textContent = leftCnt;
            if (visual.rightCount) visual.rightCount.textContent = rightCnt;
            if (visual.monoCount) visual.monoCount.textContent = monoCnt;
            if (visual.collectorCount) visual.collectorCount.textContent = collCnt;
        }

        // PHYSICS TILE - Three horizontal sliders for physics params
        function createPhysicsTile(visual, label) {
            const container = document.createElement('div');
            container.style.cssText = 'display: flex; flex-direction: column; gap: 6px; padding: 8px; width: 100%; height: 100%; justify-content: center;';

            const params = [
                { id: 'waveSpeed', min: 0.05, max: 0.3, default: waveSpeed, label: 'Wave Speed' },
                { id: 'damping', min: 0.001, max: 0.05, default: damping, label: 'Damping' },
                { id: 'gain', min: 0.5, max: 5.0, default: 3.0, label: 'Actuator Gain' }
            ];

            params.forEach(param => {
                const sliderRow = document.createElement('div');
                sliderRow.style.cssText = 'display: flex; align-items: center; width: 100%;';

                const track = document.createElement('div');
                track.style.cssText = `
                    flex: 1;
                    height: 3px;
                    background: rgba(0, 229, 255, 0.3);
                    border-radius: 2px;
                    position: relative;
                    cursor: pointer;
                `;

                const thumb = document.createElement('div');
                const initialPercent = (param.default - param.min) / (param.max - param.min);
                thumb.style.cssText = `
                    position: absolute;
                    width: 10px; height: 10px;
                    background: #00e5ff;
                    border-radius: 50%;
                    left: ${initialPercent * 100}%;
                    top: 50%;
                    transform: translate(-50%, -50%);
                    cursor: pointer;
                `;
                track.appendChild(thumb);

                let isDragging = false;

                thumb.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    isDragging = true;

                    const rect = track.getBoundingClientRect();

                    function handleDrag(e) {
                        if (!isDragging) return;
                        const percent = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                        thumb.style.left = `${percent * 100}%`;

                        const value = param.min + percent * (param.max - param.min);
                        if (param.id === 'waveSpeed') waveSpeed = value;
                        else if (param.id === 'damping') damping = value;
                        // gain would be applied to actuator force multiplier
                    }

                    function stopDrag() {
                        isDragging = false;
                        document.removeEventListener('mousemove', handleDrag);
                        document.removeEventListener('mouseup', stopDrag);
                    }

                    handleDrag(e);
                    document.addEventListener('mousemove', handleDrag);
                    document.addEventListener('mouseup', stopDrag);
                });

                // Hover label
                track.addEventListener('mouseenter', () => {
                    label.textContent = param.label;
                    label.classList.add('visible');
                });
                track.addEventListener('mouseleave', () => {
                    label.classList.remove('visible');
                });

                sliderRow.appendChild(track);
                container.appendChild(sliderRow);
            });

            visual.appendChild(container);
        }

        // VIEW TILE - Fullscreen toggle
        function createViewTile(visual, label) {
            const container = document.createElement('div');
            container.style.cssText = 'display: flex; align-items: center; justify-content: center; height: 100%;';

            const button = document.createElement('div');
            button.style.cssText = `
                width: 40px; height: 40px;
                background: rgba(0, 229, 255, 0.2);
                border: 2px solid rgba(0, 229, 255, 0.4);
                border-radius: 8px;
                cursor: pointer;
                transition: all 0.2s;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 20px;
            `;
            button.textContent = '⛶';

            button.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                } else {
                    document.exitFullscreen();
                }
            });

            button.addEventListener('mouseenter', () => {
                button.style.background = 'rgba(0, 229, 255, 0.4)';
                button.style.boxShadow = '0 0 15px rgba(0, 229, 255, 0.3)';
                label.textContent = 'Fullscreen';
                label.classList.add('visible');
            });

            button.addEventListener('mouseleave', () => {
                button.style.background = 'rgba(0, 229, 255, 0.2)';
                button.style.boxShadow = 'none';
                label.classList.remove('visible');
            });

            container.appendChild(button);
            visual.appendChild(container);
        }

        // Enable tile dragging
        function enableTileDragging() {
            const tileDivs = document.querySelectorAll('.control-tile');

            tileDivs.forEach(tile => {
                const dragHandle = tile.querySelector('.drag-handle');
                if (!dragHandle) return;

                dragHandle.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    tile.classList.add('dragging');

                    function handleMouseMove(e) {
                        const container = document.getElementById('controls-container');
                        const afterElement = getDragAfterElement(container, e.clientX);

                        if (afterElement == null) {
                            container.appendChild(tile);
                        } else if (afterElement !== tile) {
                            container.insertBefore(tile, afterElement);
                        }
                    }

                    function handleMouseUp() {
                        tile.classList.remove('dragging');
                        document.removeEventListener('mousemove', handleMouseMove);
                        document.removeEventListener('mouseup', handleMouseUp);
                    }

                    document.addEventListener('mousemove', handleMouseMove);
                    document.addEventListener('mouseup', handleMouseUp);
                });
            });
        }

        function getDragAfterElement(container, x) {
            const elements = [...container.querySelectorAll('.control-tile:not(.dragging)')];
            return elements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = x - box.left - box.width / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                }
                return closest;
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        // Enable tile resizing
        function enableResizing() {
            const handles = document.querySelectorAll('.resize-handle');

            handles.forEach(handle => {
                handle.addEventListener('mousedown', (e) => {
                    const tile = handle.parentElement;
                    const startX = e.clientX;
                    const startWidth = parseInt(window.getComputedStyle(tile).width, 10);

                    function doDrag(e) {
                        const newWidth = startWidth + e.clientX - startX;
                        if (newWidth >= 80 && newWidth <= 400) {
                            tile.style.width = newWidth + 'px';
                        }
                    }

                    function stopDrag() {
                        document.removeEventListener('mousemove', doDrag);
                        document.removeEventListener('mouseup', stopDrag);
                    }

                    document.addEventListener('mousemove', doDrag);
                    document.addEventListener('mouseup', stopDrag);
                });
            });
        }

        // Handle resize
        function handleResize() {
            const controlsHeight = controlsHidden ? 0 : 120;
            camera.aspect = window.innerWidth / (window.innerHeight - controlsHeight);
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight - controlsHeight);
        }

        window.addEventListener('resize', handleResize);

        // Initialize and start
        initializeArrays();

        // Create control tiles
        createTiles();

        // Start with clean membrane (no default actuators/collectors)

        animate();

        console.log('🌊 rmix-BAE: Membrane Physics Audio Environment');
        console.log('');
        console.log('Controls:');
        console.log('  Click          - Add actuator (solid sphere)');
        console.log('  Shift+Click    - Add collector (wireframe sphere)');
        console.log('  F              - Load audio file');
        console.log('  A              - Connect JACK input (requires Zen JACK Bridge)');
        console.log('  D              - Demo mode (sine waves)');
        console.log('  O              - Connect WebSocket output (requires bridge server)');
        console.log('  R              - Reset membrane');
        console.log('  C              - Clear actuators');
        console.log('  M              - Clear collectors');
        console.log('');
        console.log('Actuators drive the membrane (audio → force)');
        console.log('Collectors sample the membrane (velocity → audio)');
    </script>
