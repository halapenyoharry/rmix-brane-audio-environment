<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Audio-Reactive Membrane - Fixed</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0e27; /* midnight alaska */
            color: #00e5ff; /* intense cyan */
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            overflow: hidden;
            height: 100vh;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Tile Control System - Free Floating */
        #controls-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 100;
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #controls-container.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .control-tile {
            position: absolute;
            background: rgba(10, 14, 39, 0.6);
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 8px;
            padding: 8px;
            transition: border-color 0.2s ease, background 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            pointer-events: auto;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        .control-tile:hover {
            border-color: rgba(0, 229, 255, 0.5);
            background: rgba(10, 14, 39, 0.8);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
        }

        .control-tile.dragging {
            opacity: 0.7;
            border-color: rgba(0, 229, 255, 0.8) !important;
            cursor: move;
        }

        .param-visual {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tile-label {
            position: absolute;
            bottom: -18px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 9px;
            color: #00e5ff;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tile-label.visible {
            opacity: 0.8;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00e5ff;
            font-size: 18px;
            z-index: 200;
        }
    </style>
</head>
<body>
    <div id="loading">Loading Three.js...</div>
    <div id="canvas-container"></div>

    <!-- Tile-based control panel -->
    <div id="controls-container">
        <!-- Tiles will be created dynamically by JavaScript -->
    </div>

    <!-- Load Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- Load D3.js for UI controls -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    
    <script>
        // Hide loading once Three.js loads
        document.getElementById('loading').style.display = 'none';

        // Scene setup with Harold's midnight alaska aesthetic
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0e27);

        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.01,
            5000
        );
        camera.position.set(100, 80, 100);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            canvas: document.createElement('canvas')
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Lighting optimized for Harold's colors
        const ambientLight = new THREE.AmbientLight(0x1a237e, 0.4);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0x00e5ff, 0.6);
        directionalLight.position.set(100, 100, 50);
        scene.add(directionalLight);

        // 3D Membrane
        let gridSize = 100;
        const membraneSize = 200;
        let geometry = new THREE.PlaneGeometry(membraneSize, membraneSize, gridSize, gridSize);

        // Custom shader material for Harold's aesthetic
        const material = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                waveHeight: { value: 20.0 },
                colorNegative: { value: new THREE.Color(0x00ffff) },
                colorPositive: { value: new THREE.Color(0xff00ff) },
                opacity: { value: 1.0 }
            },
            vertexShader: `
                varying vec3 vNormal;
                varying vec3 vPosition;
                varying float vHeight;

                void main() {
                    vPosition = position;
                    vHeight = position.z;
                    vNormal = normal;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform vec3 colorNegative;
                uniform vec3 colorPositive;
                uniform float opacity;
                uniform float time;

                varying vec3 vNormal;
                varying vec3 vPosition;
                varying float vHeight;

                void main() {
                    float t = (vHeight + 10.0) / 20.0;
                    t = clamp(t, 0.0, 1.0);

                    vec3 color = mix(colorNegative, colorPositive, t);

                    vec3 lightDir = normalize(vec3(1.0, 1.0, 1.0));
                    float diff = max(dot(vNormal, lightDir), 0.0);
                    color *= (0.7 + diff * 0.3);

                    gl_FragColor = vec4(color, opacity);
                }
            `,
            transparent: false,
            side: THREE.DoubleSide,
            wireframe: false,
            depthWrite: true,
            depthTest: true
        });

        let membrane = new THREE.Mesh(geometry, material);
        membrane.rotation.x = -Math.PI / 2;
        scene.add(membrane);

        // Physics arrays
        let heights = [];
        let velocities = [];
        let waveSpeed = 0.3;
        let damping = 0.00265;

        function initializeArrays() {
            heights = new Array(gridSize + 1);
            velocities = new Array(gridSize + 1);
            for (let i = 0; i <= gridSize; i++) {
                heights[i] = new Array(gridSize + 1).fill(0);
                velocities[i] = new Array(gridSize + 1).fill(0);
            }
        }

        // Actuator and Collector system
        let actuators = [];
        let collectors = [];
        let audioEnabled = false;
        let demoMode = false;
        let audioContext = null;
        let audioAnalyser = null;
        let audioDataArray = null;
        let audioStream = null;
        let websocket = null;
        let outputEnabled = false;

        // Stereo channel analysers
        let leftAnalyser = null;
        let rightAnalyser = null;
        let leftAudioData = null;
        let rightAudioData = null;

        // Audio file playback
        let audioElement = null;
        let audioFileMode = false;
        let audioElementSource = null; // Track if we've created source

        // Tab audio capture
        let tabAudioActive = false;

        // Demo loops
        let loopAudioElement = null;
        let loopAudioSource = null; // Track if we've created source
        let currentLoopIndex = 0;
        const demoLoops = ['bass.wav', 'drums.wav', 'kick.wav'];

        // Audio output for collectors
        let outputContext = null;
        let outputProcessor = null;
        let audioOutputEnabled = false;

        // Waveform visualizer state
        let visualizerAnalyser = null;
        let visualizerAnimationId = null;

        // Actuator class
        class Actuator {
            constructor(x, y, channel = 'mono') {
                this.x = x;
                this.y = y;
                this.gridX = Math.round(((y + membraneSize/2) / membraneSize) * gridSize);
                this.gridY = Math.round(((x + membraneSize/2) / membraneSize) * gridSize);
                this.channel = channel;
                this.gain = 1.0;
                this.visual = null;
                this.demoPhase = Math.random() * Math.PI * 2;
            }

            apply() {
                let force = 0;
                
                if (demoMode) {
                    // Demo sine waves
                    const time = Date.now() * 0.001;
                    force = Math.sin(time * 2 + this.demoPhase) * 2;
                } else if (audioEnabled && leftAudioData && rightAudioData) {
                    // Use actual audio samples from correct channel
                    let sum = 0;
                    let audioData;

                    // Select the correct channel data
                    if (this.channel === 'left') {
                        audioData = leftAudioData;
                    } else if (this.channel === 'right') {
                        audioData = rightAudioData;
                    } else {
                        // Mono - mix both channels
                        // Average samples from both L and R
                        for (let i = 0; i < leftAudioData.length; i++) {
                            sum += leftAudioData[i] + rightAudioData[i];
                        }
                        const avg = sum / (leftAudioData.length * 2);
                        force = ((avg - 128) / 128) * 3;
                        audioData = null;  // Skip single-channel processing below
                    }

                    // Process single channel (left or right)
                    if (audioData) {
                        for (let i = 0; i < audioData.length; i++) {
                            sum += audioData[i];
                        }
                        const avg = sum / audioData.length;
                        // Convert audio sample to force: 128 = 0, 0 = -max, 255 = +max
                        force = ((avg - 128) / 128) * 3;
                    }
                }

                // Apply force to membrane as an actuator
                if (this.gridX >= 0 && this.gridX <= gridSize &&
                    this.gridY >= 0 && this.gridY <= gridSize) {
                    // Apply audio force to membrane
                    velocities[this.gridX][this.gridY] += force * 0.1;
                    
                    // Keep ball at fixed height above membrane rest position
                    if (this.visual) {
                        this.visual.position.y = 2; // Fixed height
                    }
                }
            }
        }

        // Collector class - samples membrane to produce audio
        class Collector {
            constructor(x, y, config = {}) {
                this.x = x;
                this.y = y;
                this.gridX = Math.round(((y + membraneSize/2) / membraneSize) * gridSize);
                this.gridY = Math.round(((x + membraneSize/2) / membraneSize) * gridSize);

                // Universal settings
                this.mode = config.mode || 'velocity';  // 'displacement', 'velocity', 'acceleration'
                this.gain = config.gain || 50.0;  // Increased from 5.0
                this.name = config.name || 'collector';
                this.channel = config.channel || 'mono'; // 'left', 'right', 'mono'
                this.visual = null;

                // For debugging
                this.lastSample = 0;
                this.peakLevel = 0;
            }

            sample() {
                let signal = 0;

                // Read membrane state based on mode
                if (this.gridX >= 0 && this.gridX <= gridSize &&
                    this.gridY >= 0 && this.gridY <= gridSize) {

                    switch(this.mode) {
                        case 'displacement':
                            signal = heights[this.gridX][this.gridY];
                            break;
                        case 'velocity':
                            signal = velocities[this.gridX][this.gridY];
                            break;
                        case 'acceleration':
                            // TODO: compute from velocity derivative
                            signal = velocities[this.gridX][this.gridY];
                            break;
                    }
                }

                // Apply gain
                signal *= this.gain;

                // Clamp to audio range
                signal = Math.max(-1.0, Math.min(1.0, signal));

                // Track for visualization
                this.lastSample = signal;
                this.peakLevel = Math.max(this.peakLevel * 0.99, Math.abs(signal));

                return signal;
            }
        }

        // Helper functions for membrane operations
        function resetMembrane() {
            initializeArrays();
        }

        function clearActuators() {
            actuators.forEach(act => {
                if (act.visual) scene.remove(act.visual);
            });
            actuators = [];
            updateMiniMembrane();
        }

        function clearCollectors() {
            collectors.forEach(col => {
                if (col.visual) scene.remove(col.visual);
            });
            collectors = [];
            updateMiniMembrane();
        }

        // Audio control wrappers for tiles
        async function connectJACK() {
            const success = await initJackAudio();
            if (success) {
                audioEnabled = true;
                demoMode = false;
                updateAudioToggles();
            }
        }

        function loadAudioFile() {
            initAudioFile();
            // Update will happen in initAudioFile callback
        }

        function toggleAudioOutput() {
            if (!outputEnabled) {
                initAudioOutput();
            } else {
                stopAudioOutput();
            }
            updateAudioToggles();
        }

        // Add actuator
        function addActuator(x, y, channel = 'mono') {
            const actuator = new Actuator(x, y, channel);
            actuators.push(actuator);

            const color = channel === 'left' ? 0xff00ff : (channel === 'right' ? 0x00ffff : 0xffff00);
            const indicator = new THREE.Mesh(
                new THREE.SphereGeometry(2, 16, 16),
                new THREE.MeshBasicMaterial({
                    color: color,
                    transparent: true,
                    opacity: 0.7
                })
            );
            indicator.position.set(x, 2, y);
            scene.add(indicator);
            actuator.visual = indicator;

            updateMiniMembrane();
            return actuator;
        }

        // Add collector
        function addCollector(x, y, config = {}) {
            const collector = new Collector(x, y, config);
            collectors.push(collector);

            // Green wireframe sphere to distinguish from actuators
            const color = config.channel === 'left' ? 0x00ff00 : (config.channel === 'right' ? 0x00ff88 : 0x00ff44);
            const indicator = new THREE.Mesh(
                new THREE.SphereGeometry(1.5, 16, 16),
                new THREE.MeshBasicMaterial({
                    color: color,
                    wireframe: true,
                    transparent: true,
                    opacity: 0.8
                })
            );
            indicator.position.set(x, 4, y); // Higher than actuators
            scene.add(indicator);
            collector.visual = indicator;

            updateMiniMembrane();
            console.log(`Added collector at (${x.toFixed(1)}, ${y.toFixed(1)}) - ${config.channel || 'mono'} - ${config.mode || 'velocity'}`);
            return collector;
        }

        // Initialize audio file playback
        function initAudioFile() {
            // Create hidden file input
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'audio/*';

            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                console.log('Loading audio file:', file.name);

                // Create audio element if needed
                if (!audioElement) {
                    audioElement = new Audio();
                    audioElement.loop = true;
                    audioElement.controls = false;
                }

                // Create audio context
                if (!audioContext) {
                    audioContext = new AudioContext();
                }

                // Create stereo analysers if needed
                if (!leftAnalyser) {
                    leftAnalyser = audioContext.createAnalyser();
                    leftAnalyser.fftSize = 256;
                    leftAnalyser.smoothingTimeConstant = 0.3;

                    rightAnalyser = audioContext.createAnalyser();
                    rightAnalyser.fftSize = 256;
                    rightAnalyser.smoothingTimeConstant = 0.3;

                    leftAudioData = new Uint8Array(leftAnalyser.fftSize);
                    rightAudioData = new Uint8Array(rightAnalyser.fftSize);
                }

                // Only create source once per element
                if (!audioElementSource) {
                    audioElementSource = audioContext.createMediaElementSource(audioElement);

                    // Create stereo splitter
                    const splitter = audioContext.createChannelSplitter(2);
                    audioElementSource.connect(splitter);
                    audioElementSource.connect(audioContext.destination);

                    splitter.connect(leftAnalyser, 0);
                    splitter.connect(rightAnalyser, 1);
                }

                // Load new file
                const url = URL.createObjectURL(file);
                audioElement.src = url;
                audioElement.play();

                audioFileMode = true;
                audioEnabled = true;
                demoMode = false;

                console.log('Audio file loaded and playing:', file.name);
            };

            input.click();
        }

        // Initialize JACK audio through extension
        async function initJackAudio() {
            try {
                console.log('Requesting JACK audio access...');

                // Check if mediaDevices API is available
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error('Web Audio API not available. Try:\n- Using HTTPS (not http://)\n- Chrome/Chromium instead of Firefox\n- Checking browser security settings');
                }

                // Try to get JACK audio directly (bridge should provide it)
                audioStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        deviceId: 'jack-system-capture',
                        channelCount: 2  // Request stereo
                    }
                });

                // Create audio context
                audioContext = new AudioContext();
                const source = audioContext.createMediaStreamSource(audioStream);

                // Create channel splitter for true stereo separation
                const splitter = audioContext.createChannelSplitter(2);
                source.connect(splitter);

                // Create separate analysers for left and right channels
                leftAnalyser = audioContext.createAnalyser();
                leftAnalyser.fftSize = 256;
                leftAnalyser.smoothingTimeConstant = 0.3;

                rightAnalyser = audioContext.createAnalyser();
                rightAnalyser.fftSize = 256;
                rightAnalyser.smoothingTimeConstant = 0.3;

                // Connect split channels to their analysers
                splitter.connect(leftAnalyser, 0);   // Channel 0 = Left
                splitter.connect(rightAnalyser, 1);  // Channel 1 = Right

                // Create data arrays for each channel
                leftAudioData = new Uint8Array(leftAnalyser.fftSize);
                rightAudioData = new Uint8Array(rightAnalyser.fftSize);

                console.log('JACK audio connected - stereo channels separated');
                return true;

            } catch (error) {
                console.error('Failed to connect to JACK:', error);
                alert('Failed to connect to JACK audio: ' + error.message + '\n\nMake sure:\n1. Zen JACK Bridge extension is loaded\n2. JACK server is running\n3. zen-jack-bridge client appears in patchbay');
                return false;
            }
        }

        // Tab audio capture
        async function captureTabAudio() {
            try {
                console.log('Requesting tab audio capture...');

                // Check browser support
                if (!navigator.mediaDevices) {
                    throw new Error('MediaDevices API not available. Try:\n- Accessing via localhost (not remote host)\n- Using HTTPS instead of HTTP');
                }
                if (!navigator.mediaDevices.getDisplayMedia) {
                    throw new Error('getDisplayMedia not available. This usually means:\n- You need to access via localhost (Chrome blocks this on remote HTTP)\n- OR set up HTTPS for remote access');
                }

                const stream = await navigator.mediaDevices.getDisplayMedia({
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false,
                        channelCount: 2
                    },
                    video: false
                });

                // Create audio context if needed
                if (!audioContext) {
                    audioContext = new AudioContext();
                }

                const source = audioContext.createMediaStreamSource(stream);

                // Create channel splitter for stereo
                const splitter = audioContext.createChannelSplitter(2);
                source.connect(splitter);

                // Create separate analysers for left and right
                leftAnalyser = audioContext.createAnalyser();
                leftAnalyser.fftSize = 256;
                leftAnalyser.smoothingTimeConstant = 0.3;

                rightAnalyser = audioContext.createAnalyser();
                rightAnalyser.fftSize = 256;
                rightAnalyser.smoothingTimeConstant = 0.3;

                splitter.connect(leftAnalyser, 0);
                splitter.connect(rightAnalyser, 1);

                leftAudioData = new Uint8Array(leftAnalyser.fftSize);
                rightAudioData = new Uint8Array(rightAnalyser.fftSize);

                audioStream = stream;
                tabAudioActive = true;
                audioEnabled = true;
                demoMode = false;
                audioFileMode = false;

                console.log('Tab audio captured! Use any browser tab audio.');

            } catch (error) {
                console.error('Tab capture failed:', error);
                alert('Tab audio capture failed: ' + error.message + '\n\nNote: This works in Chrome/Edge, not Safari.');
            }
        }

        function stopTabAudio() {
            if (audioStream) {
                audioStream.getTracks().forEach(track => track.stop());
                audioStream = null;
            }
            tabAudioActive = false;
            audioEnabled = false;
            console.log('Tab audio stopped');
        }

        // Play demo loops - toggle behavior
        function playLoop() {
            // If already playing, stop
            if (loopAudioElement && !loopAudioElement.paused) {
                loopAudioElement.pause();
                loopAudioElement.currentTime = 0;
                audioEnabled = false;
                audioFileMode = false;
                console.log('Loop stopped');
                return;
            }

            // If paused, resume
            if (loopAudioElement && loopAudioElement.paused) {
                loopAudioElement.play();
                audioEnabled = true;
                audioFileMode = true;
                console.log('Loop resumed');
                return;
            }

            // Start new loop
            const loopFile = demoLoops[currentLoopIndex];
            currentLoopIndex = (currentLoopIndex + 1) % demoLoops.length;

            console.log('Loading demo loop:', loopFile);

            // Create audio element if needed
            if (!loopAudioElement) {
                loopAudioElement = new Audio();
                loopAudioElement.loop = true;
            }

            // Create audio context if needed
            if (!audioContext) {
                audioContext = new AudioContext();
            }

            // Only create analysers once
            if (!leftAnalyser) {
                leftAnalyser = audioContext.createAnalyser();
                leftAnalyser.fftSize = 256;
                leftAnalyser.smoothingTimeConstant = 0.3;

                rightAnalyser = audioContext.createAnalyser();
                rightAnalyser.fftSize = 256;
                rightAnalyser.smoothingTimeConstant = 0.3;

                leftAudioData = new Uint8Array(leftAnalyser.fftSize);
                rightAudioData = new Uint8Array(rightAnalyser.fftSize);
            }

            // Only create source once per loop element
            if (!loopAudioSource) {
                loopAudioSource = audioContext.createMediaElementSource(loopAudioElement);

                // Create channel splitter for stereo
                const splitter = audioContext.createChannelSplitter(2);
                loopAudioSource.connect(splitter);
                loopAudioSource.connect(audioContext.destination);

                splitter.connect(leftAnalyser, 0);
                splitter.connect(rightAnalyser, 1);
            }

            // Load new loop file
            loopAudioElement.src = 'demo-loops/' + loopFile;
            loopAudioElement.play();

            audioEnabled = true;
            demoMode = false;
            audioFileMode = true;

            console.log('Playing loop:', loopFile);
        }

        // Update audio data from stereo channels
        function updateAudioData() {
            if (audioEnabled && leftAnalyser && rightAnalyser && leftAudioData && rightAudioData) {
                leftAnalyser.getByteTimeDomainData(leftAudioData);
                rightAnalyser.getByteTimeDomainData(rightAudioData);
            }
        }

        // Compact spectrum visualizer for audio tiles
        function drawTileSpectrum(canvas, analyser, color) {
            if (!canvas || !analyser) return;

            const ctx = canvas.getContext('2d');
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            // Clear canvas
            ctx.fillStyle = '#0a0e27';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw compact spectrum bars
            const barWidth = canvas.width / bufferLength * 2.5;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                const barHeight = (dataArray[i] / 255) * canvas.height * 0.9;
                const intensity = dataArray[i] / 255;
                const alpha = Math.max(0.4, intensity);

                // Parse hex color
                const r = parseInt(color.slice(1, 3), 16);
                const g = parseInt(color.slice(3, 5), 16);
                const b = parseInt(color.slice(5, 7), 16);

                ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
                ctx.fillRect(x, canvas.height - barHeight, barWidth - 0.5, barHeight);
                x += barWidth;
            }
        }

        // Start visualizer for active audio tile
        function startTileVisualizer(canvas, analyser, color) {
            if (!canvas || !analyser) return;

            function animate() {
                drawTileSpectrum(canvas, analyser, color);
                visualizerAnimationId = requestAnimationFrame(animate);
            }
            animate();
        }

        // Stop visualizer
        function stopTileVisualizer() {
            if (visualizerAnimationId) {
                cancelAnimationFrame(visualizerAnimationId);
                visualizerAnimationId = null;
            }
        }

        // WebSocket connection for output
        function connectWebSocket() {
            try {
                console.log('Connecting to WebSocket output bridge...');
                websocket = new WebSocket('ws://localhost:9001');

                websocket.onopen = () => {
                    console.log('WebSocket connected!');
                    outputEnabled = true;
                };

                websocket.onerror = (error) => {
                    console.error('WebSocket error:', error);
                    alert('Failed to connect to WebSocket bridge.\n\nMake sure the JACK bridge server is running on port 9001.');
                };

                websocket.onclose = () => {
                    console.log('WebSocket disconnected');
                    outputEnabled = false;
                };

            } catch (error) {
                console.error('Failed to create WebSocket:', error);
                alert('WebSocket connection failed: ' + error.message);
            }
        }

        function disconnectWebSocket() {
            if (websocket) {
                websocket.close();
                websocket = null;
            }
            outputEnabled = false;
        }

        // Initialize audio output for collectors
        function initAudioOutput() {
            if (audioOutputEnabled) {
                console.log('Audio output already enabled');
                return;
            }

            if (!outputContext) {
                outputContext = new (window.AudioContext || window.webkitAudioContext)();
            }

            // Create ScriptProcessorNode (4096 buffer size for smooth playback)
            outputProcessor = outputContext.createScriptProcessor(4096, 0, 2);

            let lastLeft = 0;
            let lastRight = 0;

            outputProcessor.onaudioprocess = (e) => {
                const outputL = e.outputBuffer.getChannelData(0);
                const outputR = e.outputBuffer.getChannelData(1);

                // Sample collectors once per buffer (not per sample)
                let targetLeft = 0;
                let targetRight = 0;

                collectors.forEach(collector => {
                    const sample = collector.sample();

                    if (collector.channel === 'left') {
                        targetLeft += sample;
                    } else if (collector.channel === 'right') {
                        targetRight += sample;
                    } else {
                        // Mono - send to both
                        targetLeft += sample;
                        targetRight += sample;
                    }
                });

                // Interpolate from last to target
                for (let i = 0; i < outputL.length; i++) {
                    const t = i / outputL.length;
                    outputL[i] = lastLeft + (targetLeft - lastLeft) * t;
                    outputR[i] = lastRight + (targetRight - lastRight) * t;
                }

                lastLeft = targetLeft;
                lastRight = targetRight;
            };

            // Connect to speakers (which Firefox routes to JACK)
            outputProcessor.connect(outputContext.destination);

            audioOutputEnabled = true;
            console.log('Audio output enabled - routing to Firefox JACK output');
        }

        function stopAudioOutput() {
            if (outputProcessor) {
                outputProcessor.disconnect();
                outputProcessor = null;
            }
            if (outputContext) {
                outputContext.close();
                outputContext = null;
            }
            audioOutputEnabled = false;
            console.log('Audio output stopped');
        }

        // Send collector samples to WebSocket (legacy, can remove if not using)
        function sendCollectorSamples() {
            if (!outputEnabled || !websocket || websocket.readyState !== WebSocket.OPEN) {
                return;
            }

            // Sample all collectors
            const samples = collectors.map(collector => collector.sample());

            if (samples.length > 0) {
                // Send as Float32Array for efficiency
                const buffer = new Float32Array(samples);
                websocket.send(buffer);
            }
        }

        // Physics update
        function updatePhysics() {
            const newHeights = new Array(gridSize + 1).fill(0).map(() => new Array(gridSize + 1).fill(0));

            // Wave equation
            for (let i = 1; i < gridSize; i++) {
                for (let j = 1; j < gridSize; j++) {
                    const laplacian = (
                        heights[i + 1][j] + heights[i - 1][j] +
                        heights[i][j + 1] + heights[i][j - 1] -
                        4 * heights[i][j]
                    );

                    velocities[i][j] += waveSpeed * waveSpeed * laplacian;
                    velocities[i][j] *= (1 - damping);
                    newHeights[i][j] = heights[i][j] + velocities[i][j];
                }
            }

            // Fixed boundaries
            for (let i = 0; i <= gridSize; i++) {
                newHeights[0][i] = 0;
                newHeights[gridSize][i] = 0;
                newHeights[i][0] = 0;
                newHeights[i][gridSize] = 0;
            }

            heights = newHeights;

            // Update geometry
            const positions = membrane.geometry.attributes.position.array;
            for (let i = 0; i <= gridSize; i++) {
                for (let j = 0; j <= gridSize; j++) {
                    const index = (i * (gridSize + 1) + j) * 3 + 2;
                    positions[index] = heights[i][j] * material.uniforms.waveHeight.value;
                }
            }

            membrane.geometry.attributes.position.needsUpdate = true;
            membrane.geometry.computeVertexNormals();
        }

        // Mouse interaction
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        renderer.domElement.addEventListener('click', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            // First check if clicking on actuator or collector to remove
            let clickedSphere = false;

            // Check actuators
            for (let i = actuators.length - 1; i >= 0; i--) {
                if (actuators[i].visual) {
                    const intersects = raycaster.intersectObject(actuators[i].visual);
                    if (intersects.length > 0) {
                        scene.remove(actuators[i].visual);
                        actuators.splice(i, 1);
                        updateMiniMembrane();
                        clickedSphere = true;
                        break;
                    }
                }
            }

            // Check collectors if no actuator was clicked
            if (!clickedSphere) {
                for (let i = collectors.length - 1; i >= 0; i--) {
                    if (collectors[i].visual) {
                        const intersects = raycaster.intersectObject(collectors[i].visual);
                        if (intersects.length > 0) {
                            scene.remove(collectors[i].visual);
                            collectors.splice(i, 1);
                            updateMiniMembrane();
                            clickedSphere = true;
                            break;
                        }
                    }
                }
            }

            // If no sphere clicked, add new one on membrane
            if (!clickedSphere) {
                const intersects = raycaster.intersectObject(membrane);

                if (intersects.length > 0) {
                    const point = intersects[0].point;
                    let channel = 'mono';
                    if (point.x < -20) channel = 'left';
                    else if (point.x > 20) channel = 'right';

                    // Shift+Click adds collector, regular click adds actuator
                    if (event.shiftKey) {
                        addCollector(point.x, point.z, { channel: channel });
                    } else {
                        addActuator(point.x, point.z, channel);
                    }
                }
            }
        });

        // Keyboard controls
        document.addEventListener('keydown', async (e) => {
            // Shift+H to toggle controls
            if (e.shiftKey && (e.key === 'h' || e.key === 'H')) {
                const container = document.getElementById('controls-container');
                controlsHidden = !controlsHidden;
                container.classList.toggle('hidden');
                handleResize();
                return;
            }

            if (e.key === 'a' || e.key === 'A') {
                // Toggle JACK audio
                if (!audioEnabled) {
                    const success = await initJackAudio();
                    if (success) {
                        audioEnabled = true;
                        demoMode = false;
                        updateAudioToggles();
                    }
                } else {
                    audioEnabled = false;
                    if (audioStream) {
                        audioStream.getTracks().forEach(track => track.stop());
                    }
                    if (audioContext) {
                        audioContext.close();
                    }
                    updateAudioToggles();
                }
            } else if (e.key === 'f' || e.key === 'F') {
                // Toggle fullscreen
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                } else {
                    document.exitFullscreen();
                }
            } else if (e.key === 'l' || e.key === 'L') {
                // Load audio file
                initAudioFile();
            } else if (e.key === 'd' || e.key === 'D') {
                // Toggle demo mode
                demoMode = !demoMode;

                if (demoMode) {
                    audioEnabled = false;
                    audioFileMode = false;
                    if (audioElement) {
                        audioElement.pause();
                    }
                }
                updateAudioToggles();
            } else if (e.key === 'o' || e.key === 'O') {
                // Toggle audio output
                if (!audioOutputEnabled) {
                    initAudioOutput();
                } else {
                    stopAudioOutput();
                }
            } else if (e.key === 'r' || e.key === 'R') {
                resetMembrane();
            } else if (e.key === 'c' || e.key === 'C') {
                clearActuators();
            } else if (e.key === 'm' || e.key === 'M') {
                clearCollectors();
            }
        });

        // Update all audio visualizers
        function updateAudioVisualizers() {
            document.querySelectorAll('.control-tile').forEach(tile => {
                const visual = tile.querySelector('.param-visual');
                if (!visual || !visual.button || !visual.button.waveformCanvas) return;

                const canvas = visual.button.waveformCanvas;
                const tileData = visual.tileData;
                if (!tileData) return;

                // Check if this tile should show waveform
                let shouldShow = false;
                let analyser = null;

                if (tileData.action === 'captureTab' && tabAudioActive && leftAnalyser) {
                    shouldShow = true;
                    analyser = leftAnalyser;
                } else if (tileData.action === 'toggleJack' && audioEnabled && !tabAudioActive && !audioFileMode && !demoMode && leftAnalyser) {
                    // Only show on JACK button if JACK is the actual source (not file/loop/demo)
                    shouldShow = true;
                    analyser = leftAnalyser;
                } else if (tileData.action === 'playLoop' && loopAudioElement && !loopAudioElement.paused && leftAnalyser) {
                    shouldShow = true;
                    analyser = leftAnalyser;
                } else if (tileData.action === 'loadFile' && audioFileMode && audioElement && !audioElement.paused && leftAnalyser) {
                    shouldShow = true;
                    analyser = leftAnalyser;
                }

                // Show/hide and update canvas
                if (shouldShow && analyser) {
                    canvas.style.display = 'block';
                    drawTileSpectrum(canvas, analyser, tileData.color);
                } else {
                    canvas.style.display = 'none';
                }
            });
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            // Update audio data from JACK
            updateAudioData();

            // Update audio visualizers on tiles
            updateAudioVisualizers();

            // Apply actuators
            actuators.forEach(actuator => {
                actuator.apply();
            });

            updatePhysics();

            // Collectors sample automatically in audio processor callback

            material.uniforms.time.value = Date.now() * 0.001;

            controls.update();
            renderer.render(scene, camera);
        }

        // ============================================
        // TILE CONTROL SYSTEM
        // ============================================

        let controlsHidden = false;

        // Tile configuration - will be loaded from JSON
        let tilesConfig = null;
        let tilePositions = {}; // Track tile positions for drag

        // Load config and create tiles
        async function createTiles() {
            // Load JSON config
            const response = await fetch('tiles-config.json');
            tilesConfig = await response.json();

            // Initialize tile positions (bottom of screen, spread horizontally)
            const startY = window.innerHeight - 140;
            let xOffset = 20;
            tilesConfig.tiles.forEach(tile => {
                tilePositions[tile.id] = { x: xOffset, y: startY };
                xOffset += (tile.width || 100) + 20;
            });

            // D3 tile creation
            const container = d3.select('#controls-container');

            // D3 data binding for tiles
            const tileDivs = container
                .selectAll('.control-tile')
                .data(tilesConfig.tiles, d => d.id)
                .join(
                    enter => {
                        const tile = enter.append('div')
                            .attr('class', 'control-tile')
                            .attr('id', d => `tile-${d.id}`)
                            .style('width', d => `${d.width || 60}px`)
                            .style('height', d => `${d.height || 60}px`)
                            .style('left', d => `${tilePositions[d.id].x}px`)
                            .style('top', d => `${tilePositions[d.id].y}px`)
                            .call(createD3Drag());

                        // Add visual container
                        tile.append('div')
                            .attr('class', 'param-visual')
                            .each(function(d) {
                                const visual = this;
                                const label = d3.select(visual.parentNode)
                                    .append('div')
                                    .attr('class', 'tile-label')
                                    .node();

                                // Create tile content based on type
                                createTileContent(d, visual, label);
                            });

                        return tile;
                    },
                    update => update,
                    exit => exit.remove()
                );
        }

        // D3 Drag handler with hard boundaries
        function createD3Drag() {
            let startX, startY;

            return d3.drag()
                .on('start', function(event, d) {
                    d3.select(this).classed('dragging', true);
                    const tile = d3.select(this);
                    startX = parseInt(tile.style('left')) - event.x;
                    startY = parseInt(tile.style('top')) - event.y;
                })
                .on('drag', function(event, d) {
                    const tile = d3.select(this);
                    const width = parseInt(tile.style('width'));
                    const height = d.height || 60;

                    // Calculate new position relative to drag start
                    const x = Math.max(0, Math.min(window.innerWidth - width, event.x + startX));
                    const y = Math.max(0, Math.min(window.innerHeight - height, event.y + startY));

                    tile.style('left', `${x}px`)
                        .style('top', `${y}px`);

                    tilePositions[d.id] = { x, y };
                })
                .on('end', function(event, d) {
                    d3.select(this).classed('dragging', false);
                });
        }

        // Route to appropriate tile creator based on type
        function createTileContent(tileData, visual, label) {
            if (tileData.type === 'toggle') {
                createToggleTile(visual, tileData);
            } else if (tileData.type === 'button') {
                createButtonTile(visual, tileData);
            } else if (tileData.type === 'slider') {
                createSliderTile(visual, tileData);
            } else if (tileData.type === 'mini-membrane') {
                createMiniMembraneTile(visual, tileData);
            }
        }

        // ATOMIC TILE CREATORS - One control per tile, no labels

        // Toggle tile - circular button with icon, glows when active
        function createToggleTile(visual, tileData) {
            const button = document.createElement('div');
            button.style.cssText = `
                width: 100%; height: 100%;
                background: rgba(${hexToRgb(tileData.color)}, 0.2);
                border: 2px solid ${tileData.color};
                border-radius: 50%;
                cursor: pointer;
                transition: all 0.2s;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 24px;
                color: ${tileData.color};
                font-weight: bold;
                position: relative;
            `;
            button.textContent = tileData.icon;

            // Add waveform canvas (hidden by default)
            const canvas = document.createElement('canvas');
            canvas.width = 48;
            canvas.height = 20;
            canvas.style.cssText = `
                position: absolute;
                bottom: 2px;
                left: 50%;
                transform: translateX(-50%);
                width: 48px;
                height: 20px;
                border-radius: 3px;
                display: none;
                pointer-events: none;
            `;
            button.appendChild(canvas);
            button.waveformCanvas = canvas;

            button.addEventListener('click', () => {
                if (tileData.action === 'captureTab') {
                    if (!tabAudioActive) {
                        captureTabAudio();
                    } else {
                        stopTabAudio();
                    }
                } else if (tileData.action === 'toggleDemo') {
                    demoMode = !demoMode;
                    if (demoMode) audioEnabled = false;
                } else if (tileData.action === 'toggleJack') {
                    if (!audioEnabled) {
                        connectJACK();
                    } else {
                        audioEnabled = false;
                    }
                } else if (tileData.action === 'toggleOutput') {
                    toggleAudioOutput();
                }
                updateToggleStates();
            });

            button.addEventListener('mouseenter', () => {
                button.style.background = `rgba(${hexToRgb(tileData.color)}, 0.4)`;
                button.style.boxShadow = `0 0 20px ${tileData.color}`;
            });

            button.addEventListener('mouseleave', () => {
                const isActive = getToggleState(tileData.action);
                button.style.background = `rgba(${hexToRgb(tileData.color)}, ${isActive ? 0.5 : 0.2})`;
                button.style.boxShadow = isActive ? `0 0 15px ${tileData.color}` : 'none';
            });

            visual.appendChild(button);
            visual.button = button;
            visual.tileData = tileData;
        }

        // Button tile - momentary action, no state
        function createButtonTile(visual, tileData) {
            const button = document.createElement('div');
            button.style.cssText = `
                width: 100%; height: 100%;
                background: rgba(${hexToRgb(tileData.color)}, 0.2);
                border: 2px solid ${tileData.color};
                border-radius: ${tileData.action === 'clearAll' ? '50%' : '8px'};
                cursor: pointer;
                transition: all 0.2s;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 24px;
                color: ${tileData.color};
                position: relative;
            `;
            button.textContent = tileData.icon;

            // Add waveform canvas for audio buttons (hidden by default)
            if (tileData.action === 'playLoop' || tileData.action === 'loadFile') {
                const canvas = document.createElement('canvas');
                canvas.width = 48;
                canvas.height = 20;
                canvas.style.cssText = `
                    position: absolute;
                    bottom: 4px;
                    left: 50%;
                    transform: translateX(-50%);
                    width: 48px;
                    height: 20px;
                    border-radius: 3px;
                    display: none;
                    pointer-events: none;
                `;
                button.appendChild(canvas);
                button.waveformCanvas = canvas;
            }

            button.addEventListener('click', () => {
                if (tileData.action === 'loadFile') {
                    loadAudioFile();
                } else if (tileData.action === 'playLoop') {
                    playLoop();
                } else if (tileData.action === 'clearAll') {
                    clearActuators();
                    clearCollectors();
                } else if (tileData.action === 'toggleFullscreen') {
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen();
                    } else {
                        document.exitFullscreen();
                    }
                }
            });

            button.addEventListener('mousedown', () => {
                button.style.transform = 'scale(0.9)';
            });

            button.addEventListener('mouseup', () => {
                button.style.transform = 'scale(1)';
            });

            button.addEventListener('mouseenter', () => {
                button.style.background = `rgba(${hexToRgb(tileData.color)}, 0.4)`;
                button.style.boxShadow = `0 0 20px ${tileData.color}`;
            });

            button.addEventListener('mouseleave', () => {
                button.style.background = `rgba(${hexToRgb(tileData.color)}, 0.2)`;
                button.style.boxShadow = 'none';
            });

            visual.appendChild(button);
        }

        // Slider tile - horizontal slider, no label
        function createSliderTile(visual, tileData) {
            const track = document.createElement('div');
            track.style.cssText = `
                width: 100%;
                height: 6px;
                background: rgba(${hexToRgb(tileData.color)}, 0.3);
                border-radius: 3px;
                position: relative;
                cursor: pointer;
                margin: auto 0;
            `;

            const initialPercent = (tileData.default - tileData.min) / (tileData.max - tileData.min);
            const thumb = document.createElement('div');
            thumb.style.cssText = `
                position: absolute;
                width: 16px; height: 16px;
                background: ${tileData.color};
                border-radius: 50%;
                left: ${initialPercent * 100}%;
                top: 50%;
                transform: translate(-50%, -50%);
                cursor: pointer;
                box-shadow: 0 0 10px ${tileData.color};
            `;
            track.appendChild(thumb);

            // Initialize variable
            window[tileData.variable] = tileData.default;

            let isDragging = false;

            thumb.addEventListener('mousedown', (e) => {
                e.preventDefault();
                e.stopPropagation(); // Don't trigger tile drag
                isDragging = true;
                thumb.style.transform = 'translate(-50%, -50%) scale(1.2)';
                thumb.style.transition = 'none'; // Instant response

                const rect = track.getBoundingClientRect();

                function handleDrag(e) {
                    if (!isDragging) return;
                    const percent = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                    thumb.style.left = `${percent * 100}%`;

                    const value = tileData.min + percent * (tileData.max - tileData.min);
                    window[tileData.variable] = value;
                }

                function stopDrag(e) {
                    isDragging = false;
                    thumb.style.transform = 'translate(-50%, -50%)';
                    document.removeEventListener('mousemove', handleDrag);
                    document.removeEventListener('mouseup', stopDrag);
                    document.removeEventListener('mouseleave', stopDrag);
                }

                handleDrag(e);
                document.addEventListener('mousemove', handleDrag);
                document.addEventListener('mouseup', stopDrag);
                document.addEventListener('mouseleave', stopDrag);
            });

            // Scroll wheel support
            track.addEventListener('wheel', (e) => {
                e.preventDefault();
                e.stopPropagation();

                // Get current value
                const currentValue = window[tileData.variable];
                const range = tileData.max - tileData.min;
                const step = range * 0.02; // 2% of range per scroll

                // Update value
                const newValue = Math.max(tileData.min, Math.min(tileData.max,
                    currentValue - (e.deltaY > 0 ? step : -step)));

                window[tileData.variable] = newValue;

                // Update thumb position
                const percent = (newValue - tileData.min) / range;
                thumb.style.left = `${percent * 100}%`;
            }, { passive: false });

            visual.appendChild(track);
        }

        // Helper: convert hex to RGB for rgba()
        function hexToRgb(hex) {
            const r = parseInt(hex.substring(1, 3), 16);
            const g = parseInt(hex.substring(3, 5), 16);
            const b = parseInt(hex.substring(5, 7), 16);
            return `${r}, ${g}, ${b}`;
        }

        // Helper: get current state of toggle
        function getToggleState(action) {
            if (action === 'toggleDemo') return demoMode;
            if (action === 'toggleJack') return audioEnabled && !demoMode && !tabAudioActive;
            if (action === 'toggleOutput') return outputEnabled;
            if (action === 'captureTab') return tabAudioActive;
            return false;
        }

        // Update all toggle button states
        function updateToggleStates() {
            document.querySelectorAll('.control-tile').forEach(tile => {
                const visual = tile.querySelector('.param-visual');
                if (visual && visual.button && visual.tileData && visual.tileData.type === 'toggle') {
                    const isActive = getToggleState(visual.tileData.action);
                    visual.button.style.background = `rgba(${hexToRgb(visual.tileData.color)}, ${isActive ? 0.5 : 0.2})`;
                    visual.button.style.boxShadow = isActive ? `0 0 15px ${visual.tileData.color}` : 'none';
                }
            });
        }

        // Keep old update function for backwards compat
        function updateAudioToggles() {
            updateToggleStates();
        }

        // Mini-membrane - shows actuator/collector positions as SVG dots
        function createMiniMembraneTile(visual, tileData) {
            const container = document.createElement('div');
            container.style.cssText = 'width: 100%; height: 100%; position: relative; background: rgba(0, 0, 0, 0.2); border-radius: 4px;';

            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.style.cssText = 'width: 100%; height: 100%;';
            svg.setAttribute('viewBox', '0 0 100 100');

            container.appendChild(svg);
            visual.appendChild(container);
            visual.miniSvg = svg;
        }

        function updateMiniMembrane() {
            const tile = document.getElementById('tile-mini-membrane');
            if (!tile) return;

            const visual = tile.querySelector('.param-visual');
            if (!visual || !visual.miniSvg) return;

            const svg = visual.miniSvg;
            svg.innerHTML = '';

            // Map actuators to SVG coordinates
            const scale = 100 / membraneSize;

            actuators.forEach(act => {
                const cx = (act.x + membraneSize/2) * scale;
                const cy = (act.y + membraneSize/2) * scale;
                const color = act.channel === 'left' ? '#ff00ff' : (act.channel === 'right' ? '#00ffff' : '#ffff00');

                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', cx);
                circle.setAttribute('cy', cy);
                circle.setAttribute('r', 2);
                circle.setAttribute('fill', color);
                svg.appendChild(circle);
            });

            collectors.forEach(col => {
                const cx = (col.x + membraneSize/2) * scale;
                const cy = (col.y + membraneSize/2) * scale;

                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', cx);
                circle.setAttribute('cy', cy);
                circle.setAttribute('r', 1.5);
                circle.setAttribute('fill', '#00ff00');
                svg.appendChild(circle);
            });
        }


        // Handle resize
        function handleResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.addEventListener('resize', handleResize);

        // Initialize and start
        initializeArrays();

        // Create control tiles
        createTiles();

        // Start with clean membrane (no default actuators/collectors)

        animate();

        console.log('🌊 rmix-BAE: Membrane Physics Audio Environment');
        console.log('');
        console.log('Controls:');
        console.log('  Click          - Add actuator (solid sphere)');
        console.log('  Shift+Click    - Add collector (wireframe sphere)');
        console.log('  F              - Load audio file');
        console.log('  A              - Connect JACK input (requires Zen JACK Bridge)');
        console.log('  D              - Demo mode (sine waves)');
        console.log('  O              - Connect WebSocket output (requires bridge server)');
        console.log('  R              - Reset membrane');
        console.log('  C              - Clear actuators');
        console.log('  M              - Clear collectors');
        console.log('');
        console.log('Actuators drive the membrane (audio → force)');
        console.log('Collectors sample the membrane (velocity → audio)');
    </script>
