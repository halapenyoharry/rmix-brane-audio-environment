<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brane Audio Mixer - Tab Capture</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            background: #0a0e27;
            color: #00ff88;
            font-family: 'Courier New', monospace;
            padding: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }
        
        h1 {
            color: #00ffff;
            text-align: center;
            margin-bottom: 10px;
        }
        
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }
        
        .controls {
            background: #1a1e3a;
            border: 2px solid #00ff88;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            text-align: center;
        }
        
        button {
            background: #00ff88;
            color: #0a0e27;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
            font-family: 'Courier New', monospace;
        }
        
        button:hover {
            background: #00ffff;
        }
        
        button.danger {
            background: #ff4444;
            color: white;
        }
        
        button.record {
            background: #ff4444;
        }
        
        button.record.recording {
            background: #ff0000;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        
        #sources {
            margin: 20px 0;
        }
        
        .source-card {
            background: #1a1e3a;
            border: 2px solid #00ffff;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 15px;
        }
        
        .metadata-column {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .visual-column {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .source-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            grid-column: 1 / -1;
            margin-bottom: 10px;
        }
        
        .source-title {
            color: #00ffff;
            font-size: 18px;
            font-weight: bold;
        }
        
        .meta-section {
            background: #0f1329;
            padding: 12px;
            border-radius: 4px;
            border-left: 3px solid #ff00ff;
        }
        
        .meta-title {
            color: #ff00ff;
            font-weight: bold;
            font-size: 12px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        
        .meta-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 11px;
            border-bottom: 1px solid #1a1e3a;
        }
        
        .meta-row:last-child {
            border-bottom: none;
        }
        
        .meta-key {
            color: #ffaa00;
        }
        
        .meta-value {
            color: #00ff88;
            font-weight: bold;
        }
        
        canvas {
            width: 100%;
            height: 200px;
            background: #0f1329;
            border: 2px solid #00ff88;
            display: block;
            border-radius: 4px;
        }
        
        .compact-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #0f1329;
            padding: 10px 12px;
            border-radius: 4px;
            font-size: 12px;
            flex-wrap: wrap;
        }
        
        .compact-controls label {
            color: #00ffff;
            margin-right: 5px;
            font-weight: bold;
        }
        
        .compact-controls input[type="range"] {
            width: 120px;
            height: 4px;
            background: #2a2e4a;
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }
        
        .compact-controls input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: #00ff88;
            cursor: pointer;
            border-radius: 50%;
        }
        
        .compact-controls .value {
            color: #00ff88;
            min-width: 45px;
            font-weight: bold;
        }
        
        .compact-controls button {
            padding: 6px 12px;
            font-size: 12px;
            margin: 0;
        }
        
        .recording-list {
            grid-column: 1 / -1;
            margin-top: 10px;
        }
        
        .recording-item {
            background: #2a2e4a;
            padding: 10px;
            margin: 5px 0;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .recording-item audio {
            flex: 1;
            margin: 0 10px;
        }
        
        .recording-item button {
            padding: 5px 10px;
            font-size: 12px;
        }
        
        .global-stats {
            background: #1a1e3a;
            border: 2px solid #ff00ff;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .stat-box {
            background: #0f1329;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
        }
        
        .stat-label {
            color: #888;
            font-size: 11px;
            text-transform: uppercase;
        }
        
        .stat-value {
            color: #00ffff;
            font-size: 20px;
            font-weight: bold;
            margin-top: 5px;
        }
        
        @media (max-width: 1024px) {
            .source-card {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <h1>🎚️ Brane Audio Mixer</h1>
    <div class="subtitle">#browser-audio-routing #multi-source-mixing #real-time-processing</div>
    
    <div class="controls">
        <button id="addSourceBtn">➕ Capture Tab</button>
        <button id="clearAllBtn" class="danger">🗑️ Clear All</button>
    </div>
    
    <div id="globalStats" class="global-stats" style="display: none;">
        <div class="stat-box">
            <div class="stat-label">Active Sources</div>
            <div class="stat-value" id="sourceCount">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Mix Output Rate</div>
            <div class="stat-value" id="mixRate">-- kHz</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Total Latency</div>
            <div class="stat-value" id="totalLatency">-- ms</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Context State</div>
            <div class="stat-value" id="contextState">--</div>
        </div>
    </div>
    
    <div id="sources"></div>

    <script>
        let sourceCounter = 0;
        const sources = new Map();
        
        const addSourceBtn = document.getElementById('addSourceBtn');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const sourcesContainer = document.getElementById('sources');
        const globalStatsDiv = document.getElementById('globalStats');
        
        function updateGlobalStats() {
            if (sources.size === 0) {
                globalStatsDiv.style.display = 'none';
                return;
            }
            
            globalStatsDiv.style.display = 'grid';
            
            document.getElementById('sourceCount').textContent = sources.size;
            
            // Get first source's context for global stats
            const firstSource = sources.values().next().value;
            if (firstSource && firstSource.audioContext) {
                const ctx = firstSource.audioContext;
                document.getElementById('mixRate').textContent = `${(ctx.sampleRate / 1000).toFixed(1)} kHz`;
                
                const totalLatency = (ctx.baseLatency + ctx.outputLatency) * 1000;
                document.getElementById('totalLatency').textContent = `${totalLatency.toFixed(1)} ms`;
                
                document.getElementById('contextState').textContent = ctx.state;
            }
        }
        
        function formatLatency(seconds) {
            return `${(seconds * 1000).toFixed(2)} ms`;
        }
        
        function formatSampleRate(hz) {
            return `${(hz / 1000).toFixed(1)} kHz`;
        }
        
        class AudioSource {
            constructor(id) {
                this.id = id;
                this.mediaStream = null;
                this.audioContext = null;
                this.source = null;
                this.analyser = null;
                this.gainNode = null;
                this.panNode = null;
                this.animationId = null;
                this.canvas = null;
                this.ctx = null;
                this.card = null;
                this.isMuted = false;
                this.mediaRecorder = null;
                this.recordedChunks = [];
                this.recordings = [];
                this.track = null;
            }
            
            async capture() {
                try {
                    this.mediaStream = await navigator.mediaDevices.getDisplayMedia({
                        audio: {
                            echoCancellation: false,
                            noiseSuppression: false,
                            autoGainControl: false
                        },
                        video: true,
                        preferCurrentTab: false
                    });
                    
                    const videoTracks = this.mediaStream.getVideoTracks();
                    videoTracks.forEach(track => track.stop());
                    
                    const audioTracks = this.mediaStream.getAudioTracks();
                    
                    if (audioTracks.length === 0) {
                        throw new Error('No audio. Check "Share audio"!');
                    }
                    
                    this.track = audioTracks[0];
                    this.createUI();
                    this.setupAudio();
                    
                    return true;
                } catch (error) {
                    console.error('Capture error:', error);
                    alert(`Error: ${error.message}`);
                    return false;
                }
            }
            
            createUI() {
                this.card = document.createElement('div');
                this.card.className = 'source-card';
                
                const settings = this.track.getSettings();
                const capabilities = this.track.getCapabilities ? this.track.getCapabilities() : {};
                
                this.card.innerHTML = `
                    <div class="source-header">
                        <div class="source-title">Source ${this.id}: ${this.track.label || 'Unknown'}</div>
                        <button class="danger" onclick="removeSource(${this.id})">✕ Remove</button>
                    </div>
                    
                    <div class="metadata-column">
                        <div class="meta-section">
                            <div class="meta-title">🎵 Audio Stream</div>
                            <div class="meta-row">
                                <span class="meta-key">Stream ID</span>
                                <span class="meta-value">${this.mediaStream.id.substring(0, 8)}...</span>
                            </div>
                            <div class="meta-row">
                                <span class="meta-key">Track ID</span>
                                <span class="meta-value">${this.track.id.substring(0, 8)}...</span>
                            </div>
                            <div class="meta-row">
                                <span class="meta-key">State</span>
                                <span class="meta-value">${this.track.readyState}</span>
                            </div>
                            <div class="meta-row">
                                <span class="meta-key">Muted</span>
                                <span class="meta-value">${this.track.muted ? 'Yes' : 'No'}</span>
                            </div>
                        </div>
                        
                        <div class="meta-section">
                            <div class="meta-title">⚙️ Stream Config</div>
                            <div class="meta-row">
                                <span class="meta-key">Sample Rate</span>
                                <span class="meta-value">${formatSampleRate(settings.sampleRate)}</span>
                            </div>
                            <div class="meta-row">
                                <span class="meta-key">Channels</span>
                                <span class="meta-value">${settings.channelCount} (${settings.channelCount === 2 ? 'stereo' : 'mono'})</span>
                            </div>
                            <div class="meta-row">
                                <span class="meta-key">Sample Size</span>
                                <span class="meta-value">${settings.sampleSize} bit</span>
                            </div>
                            <div class="meta-row">
                                <span class="meta-key">Input Latency</span>
                                <span class="meta-value">${formatLatency(settings.latency)}</span>
                            </div>
                        </div>
                        
                        <div class="meta-section">
                            <div class="meta-title">🎛️ Processing</div>
                            <div class="meta-row">
                                <span class="meta-key">Auto Gain</span>
                                <span class="meta-value">${settings.autoGainControl ? 'On' : 'Off'}</span>
                            </div>
                            <div class="meta-row">
                                <span class="meta-key">Echo Cancel</span>
                                <span class="meta-value">${settings.echoCancellation ? 'On' : 'Off'}</span>
                            </div>
                            <div class="meta-row">
                                <span class="meta-key">Noise Suppress</span>
                                <span class="meta-value">${settings.noiseSuppression ? 'On' : 'Off'}</span>
                            </div>
                            <div class="meta-row">
                                <span class="meta-key">Voice Isolation</span>
                                <span class="meta-value">${settings.voiceIsolation ? 'On' : 'Off'}</span>
                            </div>
                        </div>
                        
                        <div class="meta-section" id="context-meta-${this.id}">
                            <div class="meta-title">🎚️ Audio Context</div>
                            <div class="meta-row">
                                <span class="meta-key">Output Rate</span>
                                <span class="meta-value" id="ctx-rate-${this.id}">--</span>
                            </div>
                            <div class="meta-row">
                                <span class="meta-key">Base Latency</span>
                                <span class="meta-value" id="ctx-base-lat-${this.id}">--</span>
                            </div>
                            <div class="meta-row">
                                <span class="meta-key">Output Latency</span>
                                <span class="meta-value" id="ctx-out-lat-${this.id}">--</span>
                            </div>
                            <div class="meta-row">
                                <span class="meta-key">Total Latency</span>
                                <span class="meta-value" id="ctx-total-lat-${this.id}">--</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="visual-column">
                        <div class="compact-controls">
                            <label>Vol:</label>
                            <input type="range" id="volume-${this.id}" min="0" max="200" value="100" step="1">
                            <span class="value" id="volume-value-${this.id}">100%</span>
                            
                            <label>Pan:</label>
                            <input type="range" id="pan-${this.id}" min="-100" max="100" value="0" step="1">
                            <span class="value" id="pan-value-${this.id}">C</span>
                            
                            <button id="mute-${this.id}" onclick="toggleMute(${this.id})">🔊</button>
                            <button class="record" id="record-${this.id}" onclick="toggleRecording(${this.id})">⏺️ Record</button>
                        </div>
                        
                        <canvas id="canvas-${this.id}"></canvas>
                    </div>
                    
                    <div class="recording-list" id="recordings-container-${this.id}" style="display: none;">
                        <div class="meta-section">
                            <div class="meta-title">💾 Recordings</div>
                            <div id="recordings-${this.id}"></div>
                        </div>
                    </div>
                `;
                
                sourcesContainer.appendChild(this.card);
                
                this.canvas = document.getElementById(`canvas-${this.id}`);
                this.canvas.width = this.canvas.offsetWidth;
                this.canvas.height = 200;
                this.ctx = this.canvas.getContext('2d');
                
                document.getElementById(`volume-${this.id}`).addEventListener('input', (e) => {
                    this.setVolume(e.target.value);
                });
                
                document.getElementById(`pan-${this.id}`).addEventListener('input', (e) => {
                    this.setPan(e.target.value);
                });
            }
            
            setupAudio() {
                this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                // Update context metadata
                document.getElementById(`ctx-rate-${this.id}`).textContent = formatSampleRate(this.audioContext.sampleRate);
                document.getElementById(`ctx-base-lat-${this.id}`).textContent = formatLatency(this.audioContext.baseLatency);
                document.getElementById(`ctx-out-lat-${this.id}`).textContent = formatLatency(this.audioContext.outputLatency);
                
                const totalLatency = this.audioContext.baseLatency + this.audioContext.outputLatency + this.track.getSettings().latency;
                document.getElementById(`ctx-total-lat-${this.id}`).textContent = formatLatency(totalLatency);
                
                this.source = this.audioContext.createMediaStreamSource(this.mediaStream);
                this.gainNode = this.audioContext.createGain();
                this.gainNode.gain.value = 1.0;
                this.panNode = this.audioContext.createStereoPanner();
                this.panNode.pan.value = 0;
                this.analyser = this.audioContext.createAnalyser();
                this.analyser.fftSize = 2048;
                
                this.source.connect(this.gainNode);
                this.gainNode.connect(this.panNode);
                this.panNode.connect(this.analyser);
                this.analyser.connect(this.audioContext.destination);
                
                this.visualize();
                updateGlobalStats();
            }
            
            setVolume(value) {
                if (!this.isMuted) {
                    this.gainNode.gain.value = value / 100;
                }
                document.getElementById(`volume-value-${this.id}`).textContent = `${value}%`;
            }
            
            setPan(value) {
                this.panNode.pan.value = value / 100;
                let label = 'C';
                if (value < -10) label = `L${Math.abs(value)}`;
                else if (value > 10) label = `R${value}`;
                document.getElementById(`pan-value-${this.id}`).textContent = label;
            }
            
            toggleMute() {
                this.isMuted = !this.isMuted;
                const currentVolume = document.getElementById(`volume-${this.id}`).value / 100;
                this.gainNode.gain.value = this.isMuted ? 0 : currentVolume;
                document.getElementById(`mute-${this.id}`).textContent = this.isMuted ? '🔇' : '🔊';
            }
            
            toggleRecording() {
                if (this.mediaRecorder && this.mediaRecorder.state === 'recording') {
                    this.stopRecording();
                } else {
                    this.startRecording();
                }
            }
            
            startRecording() {
                this.recordedChunks = [];
                
                // Create a new stream from our processed audio
                const dest = this.audioContext.createMediaStreamDestination();
                this.panNode.connect(dest);
                
                this.mediaRecorder = new MediaRecorder(dest.stream);
                
                this.mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) {
                        this.recordedChunks.push(e.data);
                    }
                };
                
                this.mediaRecorder.onstop = () => {
                    const blob = new Blob(this.recordedChunks, { type: 'audio/webm' });
                    const url = URL.createObjectURL(blob);
                    const timestamp = new Date().toLocaleString();
                    
                    this.recordings.push({ url, blob, timestamp });
                    this.updateRecordingsList();
                    
                    // Disconnect the destination
                    this.panNode.disconnect(dest);
                };
                
                this.mediaRecorder.start();
                
                const btn = document.getElementById(`record-${this.id}`);
                btn.textContent = '⏹️ Stop';
                btn.classList.add('recording');
            }
            
            stopRecording() {
                if (this.mediaRecorder) {
                    this.mediaRecorder.stop();
                    
                    const btn = document.getElementById(`record-${this.id}`);
                    btn.textContent = '⏺️ Record';
                    btn.classList.remove('recording');
                }
            }
            
            updateRecordingsList() {
                const container = document.getElementById(`recordings-${this.id}`);
                const containerParent = document.getElementById(`recordings-container-${this.id}`);
                
                if (this.recordings.length === 0) {
                    containerParent.style.display = 'none';
                    return;
                }
                
                containerParent.style.display = 'block';
                container.innerHTML = '';
                
                this.recordings.forEach((recording, index) => {
                    const item = document.createElement('div');
                    item.className = 'recording-item';
                    item.innerHTML = `
                        <div style="font-size: 11px;">${recording.timestamp}</div>
                        <audio controls src="${recording.url}"></audio>
                        <button onclick="downloadRecording(${this.id}, ${index})">💾 Save</button>
                    `;
                    container.appendChild(item);
                });
            }
            
            downloadRecording(index) {
                const recording = this.recordings[index];
                const a = document.createElement('a');
                a.href = recording.url;
                a.download = `brane-capture-${this.id}-${index + 1}.webm`;
                a.click();
            }
            
            visualize() {
                const bufferLength = this.analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);
                
                const draw = () => {
                    this.animationId = requestAnimationFrame(draw);
                    
                    this.analyser.getByteTimeDomainData(dataArray);
                    
                    this.ctx.fillStyle = '#0f1329';
                    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                    
                    // Waveform
                    this.ctx.lineWidth = 2;
                    this.ctx.strokeStyle = '#00ffff';
                    this.ctx.beginPath();
                    
                    const sliceWidth = this.canvas.width / bufferLength;
                    let x = 0;
                    
                    for (let i = 0; i < bufferLength; i++) {
                        const v = dataArray[i] / 128.0;
                        const y = v * this.canvas.height / 2;
                        if (i === 0) {
                            this.ctx.moveTo(x, y);
                        } else {
                            this.ctx.lineTo(x, y);
                        }
                        x += sliceWidth;
                    }
                    
                    this.ctx.lineTo(this.canvas.width, this.canvas.height / 2);
                    this.ctx.stroke();
                    
                    // Frequency bars
                    this.analyser.getByteFrequencyData(dataArray);
                    const barWidth = (this.canvas.width / bufferLength) * 2.5;
                    let barX = 0;
                    
                    for (let i = 0; i < bufferLength; i++) {
                        const barHeight = (dataArray[i] / 255) * this.canvas.height * 0.8;
                        const hue = (i / bufferLength) * 200 + 120;
                        this.ctx.fillStyle = `hsla(${hue}, 100%, 50%, 0.3)`;
                        this.ctx.fillRect(barX, this.canvas.height - barHeight, barWidth, barHeight);
                        barX += barWidth + 1;
                    }
                };
                
                draw();
            }
            
            stop() {
                if (this.mediaRecorder && this.mediaRecorder.state === 'recording') {
                    this.stopRecording();
                }
                if (this.mediaStream) {
                    this.mediaStream.getTracks().forEach(track => track.stop());
                }
                if (this.audioContext) {
                    this.audioContext.close();
                }
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                }
                if (this.card) {
                    this.card.remove();
                }
            }
        }
        
        async function addSource() {
            const id = ++sourceCounter;
            const source = new AudioSource(id);
            const success = await source.capture();
            if (success) {
                sources.set(id, source);
                updateGlobalStats();
            }
        }
        
        function removeSource(id) {
            const source = sources.get(id);
            if (source) {
                source.stop();
                sources.delete(id);
                updateGlobalStats();
            }
        }
        
        function toggleMute(id) {
            const source = sources.get(id);
            if (source) {
                source.toggleMute();
            }
        }
        
        function toggleRecording(id) {
            const source = sources.get(id);
            if (source) {
                source.toggleRecording();
            }
        }
        
        function downloadRecording(sourceId, recordingIndex) {
            const source = sources.get(sourceId);
            if (source) {
                source.downloadRecording(recordingIndex);
            }
        }
        
        function clearAll() {
            if (sources.size === 0) return;
            if (confirm(`Remove all ${sources.size} sources?`)) {
                sources.forEach(source => source.stop());
                sources.clear();
                updateGlobalStats();
            }
        }
        
        addSourceBtn.addEventListener('click', addSource);
        clearAllBtn.addEventListener('click', clearAll);
        
        window.removeSource = removeSource;
        window.toggleMute = toggleMute;
        window.toggleRecording = toggleRecording;
        window.downloadRecording = downloadRecording;
        
        window.addEventListener('resize', () => {
            sources.forEach(source => {
                if (source.canvas) {
                    source.canvas.width = source.canvas.offsetWidth;
                }
            });
        });
    </script>
</body>
</html>
