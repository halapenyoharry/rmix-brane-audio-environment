<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Actuator Coupling: Mallet vs Driver</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0e27;
            color: #c0c8e0;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .header {
            text-align: center;
            padding: 12px;
            font-size: 13px;
            color: #607090;
            border-bottom: 1px solid #1a2040;
        }
        .scenes {
            display: flex;
            flex: 1;
        }
        .scene {
            flex: 1;
            position: relative;
            border-right: 1px solid #1a2040;
        }
        .scene:last-child { border-right: none; }
        .scene-label {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: #00e5ff;
            z-index: 1;
        }
        .scene-desc {
            position: absolute;
            top: 32px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: #506080;
            white-space: nowrap;
            z-index: 1;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            padding: 12px;
            border-top: 1px solid #1a2040;
            font-size: 12px;
        }
        .controls label {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .controls input[type="range"] {
            width: 100px;
        }
        .signal-display {
            color: #ffcc00;
            min-width: 80px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">Actuator Coupling Models — Left: Mallet (collision) / Right: Speaker Driver (bonded)</div>
    <div class="scenes">
        <div class="scene">
            <div class="scene-label">MALLET (uncoupled)</div>
            <div class="scene-desc">contact only when touching — area grows with depth</div>
            <canvas id="mallet-canvas"></canvas>
        </div>
        <div class="scene">
            <div class="scene-label">DRIVER (coupled)</div>
            <div class="scene-desc">bonded to membrane — shape IS the coupling</div>
            <canvas id="driver-canvas"></canvas>
        </div>
    </div>
    <div class="controls">
        <label>
            signal freq
            <input type="range" id="freq-slider" min="0.05" max="8" step="0.01" value="0.1">
            <span id="freq-val">0.10 Hz</span>
        </label>
        <label>
            signal amp
            <input type="range" id="amp-slider" min="0" max="40" step="1" value="40">
            <span id="amp-val">40</span>
        </label>
        <label>
            actuator width
            <input type="range" id="width-slider" min="4" max="30" step="1" value="30">
            <span id="width-val">30</span>
        </label>
        <div class="signal-display" id="signal-display">signal: 0.00</div>
    </div>

    <script>
    (() => {
        // --- Shared physics parameters ---
        const N = 200;              // membrane grid points
        const dt = 0.4;             // physics timestep
        const waveSpeed = 0.3;
        const damping = 0.005;
        const stepsPerFrame = 3;

        // --- Signal parameters ---
        const freqSlider = document.getElementById('freq-slider');
        const ampSlider = document.getElementById('amp-slider');
        const widthSlider = document.getElementById('width-slider');
        const freqVal = document.getElementById('freq-val');
        const ampVal = document.getElementById('amp-val');
        const widthVal = document.getElementById('width-val');
        const signalDisplay = document.getElementById('signal-display');

        freqSlider.addEventListener('input', () => freqVal.textContent = parseFloat(freqSlider.value).toFixed(2) + ' Hz');
        ampSlider.addEventListener('input', () => ampVal.textContent = ampSlider.value);
        widthSlider.addEventListener('input', () => widthVal.textContent = widthSlider.value);

        // --- 1D Membrane ---
        function createMembrane() {
            return {
                heights: new Float64Array(N),
                velocities: new Float64Array(N),
                driven: new Uint8Array(N) // 1 = this point is driven by an actuator, skip in physics
            };
        }

        function stepMembrane(mem) {
            const c2 = waveSpeed * waveSpeed;
            const h = mem.heights;
            const v = mem.velocities;
            const d = mem.driven;

            for (let i = 1; i < N - 1; i++) {
                if (d[i]) continue; // driven points are owned by the actuator, not the wave equation
                const laplacian = h[i - 1] - 2 * h[i] + h[i + 1];
                v[i] += c2 * laplacian * dt;
                v[i] *= (1 - damping);
            }
            for (let i = 1; i < N - 1; i++) {
                if (d[i]) continue;
                h[i] += v[i] * dt;
            }
            // Fixed boundaries
            h[0] = 0;
            h[N - 1] = 0;
        }

        // --- Mallet Scene ---
        const malletMem = createMembrane();
        const malletCanvas = document.getElementById('mallet-canvas');
        const malletCtx = malletCanvas.getContext('2d');

        // actuator position (center of membrane)
        const actuatorX = Math.floor(N / 2);

        function applyMallet(mem, signal, actuatorWidth) {
            // One-way collision constraint.
            // The ball can push the membrane down, but when the ball lifts,
            // the membrane springs back freely through the wave equation.
            // This is what makes it "uncoupled" — contact only, no bond.

            const ballRadius = actuatorWidth / 2;
            const ballCenterY = signal;

            for (let i = 0; i < N; i++) {
                const dx = i - actuatorX;
                if (Math.abs(dx) >= ballRadius) continue;

                const sphereBottom = ballCenterY - Math.sqrt(ballRadius * ballRadius - dx * dx);

                // membrane is above ball surface — ball is pushing through it
                // snap membrane down to ball surface
                if (mem.heights[i] > sphereBottom) {
                    mem.heights[i] = sphereBottom;
                    // give membrane the ball's velocity (not zero — ball is moving)
                    // this transfers energy into the membrane on contact
                    mem.velocities[i] = 0;
                }
                // if membrane is below ball surface — no contact, membrane is free
            }
        }

        // --- Driver Scene ---
        const driverMem = createMembrane();
        const driverCanvas = document.getElementById('driver-canvas');
        const driverCtx = driverCanvas.getContext('2d');

        function applyDriver(mem, signal, actuatorWidth) {
            // The driver is bonded to the membrane. It applies force, not displacement.
            // At each point under the driver, there's a spring-like coupling:
            // the force is proportional to (where the driver wants the membrane - where it actually is).
            // Coupling strength falls off with Gaussian from center.
            // The membrane is free to respond through the wave equation. No overrides.

            const sigma = actuatorWidth / 3;
            const stiffness = 0.5; // how tightly the driver grips the membrane

            for (let i = 0; i < N; i++) {
                const dx = i - actuatorX;
                const gaussian = Math.exp(-(dx * dx) / (2 * sigma * sigma));

                if (gaussian < 0.01) continue;

                const target = signal * gaussian;
                const error = target - mem.heights[i];
                mem.velocities[i] += error * stiffness * gaussian;
            }
        }

        // --- Rendering ---
        function resizeCanvas(canvas) {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * devicePixelRatio;
            canvas.height = rect.height * devicePixelRatio;
        }

        function drawScene(ctx, canvas, mem, signal, actuatorWidth, mode) {
            const w = canvas.width;
            const h = canvas.height;
            const midY = h * 0.55;
            const scaleX = w / N;
            const scaleY = h * 0.008; // pixels per unit displacement — scales with window

            ctx.clearRect(0, 0, w, h);

            // Draw rest line
            ctx.strokeStyle = '#1a2040';
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(0, midY);
            ctx.lineTo(w, midY);
            ctx.stroke();
            ctx.setLineDash([]);

            // Draw membrane
            ctx.strokeStyle = '#4488ff';
            ctx.lineWidth = 2 * devicePixelRatio;
            ctx.beginPath();
            for (let i = 0; i < N; i++) {
                const x = i * scaleX;
                const y = midY - mem.heights[i] * scaleY;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();

            const cx = actuatorX * scaleX;
            const ballRadius = (actuatorWidth / 2) * scaleX;

            if (mode === 'mallet') {
                // Draw the mallet (circle)
                const ballCenterY = midY - signal * scaleY;

                // Solid mallet
                ctx.beginPath();
                ctx.arc(cx, ballCenterY, ballRadius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 68, 102, 0.6)';
                ctx.fill();

                // Draw contact points: where the ball is touching the membrane
                // Contact = membrane height is at or above ball bottom surface (within tolerance)
                ctx.fillStyle = '#ffcc00';
                for (let i = 0; i < N; i++) {
                    const dx = i - actuatorX;
                    if (Math.abs(dx) >= actuatorWidth / 2) continue;
                    const R = actuatorWidth / 2;
                    const sphereBottom = signal - Math.sqrt(R * R - dx * dx);
                    // Contact when membrane is right at the ball surface (within small tolerance)
                    if (Math.abs(mem.heights[i] - sphereBottom) < 0.5) {
                        const px = i * scaleX;
                        const py = midY - mem.heights[i] * scaleY;
                        ctx.beginPath();
                        ctx.arc(px, py, 2 * devicePixelRatio, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            } else {
                // The driver is bonded to the membrane.
                // Draw the ball, then draw the actual spring connections.
                // Each line from ball bottom to membrane IS a spring in the physics.
                // Its visual properties come directly from the force calculation.

                const sigma = actuatorWidth / 3;
                const ballRadius = (actuatorWidth / 2) * scaleX;
                const physRadius = actuatorWidth / 2;

                // Ball center rides with signal, offset above by its radius
                const ballCenterY = midY - signal * scaleY - ballRadius;

                // Draw spring connections FIRST (behind ball)
                for (let i = 0; i < N; i++) {
                    const dx = i - actuatorX;
                    const gaussian = Math.exp(-(dx * dx) / (2 * sigma * sigma));
                    if (gaussian < 0.01) continue;

                    // Ball bottom surface at this x (circle geometry)
                    const physDx = dx;
                    let ballBottomY;
                    if (Math.abs(physDx) < physRadius) {
                        // point is under the ball — use circle surface
                        const circleOffset = Math.sqrt(physRadius * physRadius - physDx * physDx);
                        ballBottomY = midY - signal * scaleY - (circleOffset - physRadius) * scaleX;
                        // Simpler: ball bottom at center is midY - signal*scaleY
                        // At offset dx, bottom is lower by (radius - sqrt(R²-dx²))
                        ballBottomY = (midY - signal * scaleY) + (physRadius - circleOffset) * scaleX;
                    } else {
                        // outside ball radius — spring attaches at ball edge
                        ballBottomY = midY - signal * scaleY;
                    }

                    const membraneY = midY - mem.heights[i] * scaleY;
                    const px = i * scaleX;

                    // Force = error * stiffness * gaussian (same as physics)
                    const target = signal * gaussian;
                    const error = target - mem.heights[i];
                    const force = Math.abs(error * 0.5 * gaussian);
                    const maxForce = 20;
                    const forceNorm = Math.min(1, force / maxForce);

                    // Color: warm when pulling (tension), cool when pushing (compression)
                    const pulling = error > 0; // driver wants membrane higher than it is
                    if (pulling) {
                        ctx.strokeStyle = `rgba(255, ${Math.floor(140 + 115 * (1 - forceNorm))}, 100, ${0.1 + 0.7 * forceNorm})`;
                    } else {
                        ctx.strokeStyle = `rgba(100, ${Math.floor(180 + 75 * (1 - forceNorm))}, 255, ${0.1 + 0.7 * forceNorm})`;
                    }
                    ctx.lineWidth = (0.5 + 1.5 * gaussian) * devicePixelRatio;

                    ctx.beginPath();
                    ctx.moveTo(px, ballBottomY);
                    ctx.lineTo(px, membraneY);
                    ctx.stroke();
                }

                // Draw ball on top
                ctx.beginPath();
                ctx.arc(cx, ballCenterY, ballRadius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 68, 102, 0.4)';
                ctx.fill();
                ctx.strokeStyle = '#ff4466';
                ctx.lineWidth = 2 * devicePixelRatio;
                ctx.stroke();
            }

            // Signal indicator line on the left
            ctx.strokeStyle = '#ffcc00';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(8, midY);
            ctx.lineTo(8, midY - signal * scaleY);
            ctx.stroke();
            // Arrow
            const tipY = midY - signal * scaleY;
            ctx.fillStyle = '#ffcc00';
            ctx.beginPath();
            ctx.moveTo(4, tipY);
            ctx.lineTo(12, tipY);
            ctx.lineTo(8, signal > 0 ? tipY - 5 : tipY + 5);
            ctx.fill();
        }

        // --- Main loop ---
        let lastTime = 0;

        function resize() {
            resizeCanvas(malletCanvas);
            resizeCanvas(driverCanvas);
        }

        window.addEventListener('resize', resize);
        resize();
        // resize again after layout settles
        requestAnimationFrame(() => resize());

        function animate(now) {
            requestAnimationFrame(animate);
            // re-check canvas size each frame in case layout shifted
            if (malletCanvas.width !== Math.round(malletCanvas.parentElement.getBoundingClientRect().width * devicePixelRatio)) {
                resize();
            }

            const freq = parseFloat(freqSlider.value);
            const amp = parseFloat(ampSlider.value);
            const actuatorWidth = parseFloat(widthSlider.value);
            const t = now * 0.001;

            // Signal: simple sine wave
            const signal = Math.sin(t * freq * Math.PI * 2) * amp;
            signalDisplay.textContent = 'signal: ' + signal.toFixed(2);

            // Step physics
            for (let s = 0; s < stepsPerFrame; s++) {
                applyMallet(malletMem, signal, actuatorWidth);
                stepMembrane(malletMem);

                applyDriver(driverMem, signal, actuatorWidth);
                stepMembrane(driverMem);
            }

            // Draw
            drawScene(malletCtx, malletCanvas, malletMem, signal, actuatorWidth, 'mallet');
            drawScene(driverCtx, driverCanvas, driverMem, signal, actuatorWidth, 'driver');
        }

        requestAnimationFrame(animate);
    })();
    </script>
</body>
</html>
