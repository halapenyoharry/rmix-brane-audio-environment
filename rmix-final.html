<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>RMIX - Reality Mixer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a1323;
            color: #00ffff;
            font-family: 'JetBrains Mono', monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Main workspace - full screen for membrane */
        #workspace {
            flex: 1;
            background: #0a1323;
            position: relative;
            overflow: hidden;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
        }

        /* Bottom toolbar - imagine-land style */
        #controls-container {
            height: 120px;
            padding: 20px;
            display: flex;
            gap: 12px;
            align-items: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow-x: auto;
            overflow-y: hidden;
            background: rgba(10, 19, 35, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        #controls-container.hidden {
            height: 0;
            padding: 0;
            overflow: hidden;
        }

        .control-tile {
            height: 80px;
            background: rgba(10, 19, 35, 0.4);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 8px;
            padding: 12px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            min-width: 120px;
            flex-shrink: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        .control-tile:hover {
            border-color: rgba(0, 255, 255, 0.4);
            background: rgba(10, 19, 35, 0.8);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
        }

        /* Mesh control from harold-membrane-physics-3d.html */
        #mesh-control {
            cursor: ns-resize;
            filter: drop-shadow(0 0 20px rgba(0, 229, 255, 0.3));
        }

        /* Boundary control */
        #boundary-control {
            cursor: ns-resize;
            filter: drop-shadow(0 0 20px rgba(0, 229, 255, 0.3));
        }

        /* Hide/Show toggle */
        #toolbar-toggle {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 19, 35, 0.8);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 4px 4px 0 0;
            padding: 2px 10px;
            cursor: pointer;
            font-size: 10px;
        }

        #toolbar-toggle:hover {
            background: rgba(0, 229, 255, 0.2);
        }

        /* Status (minimal, top corner) */
        #status {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(10, 14, 39, 0.7);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid rgba(0, 229, 255, 0.2);
            font-size: 11px;
            z-index: 10;
        }

        .status-row {
            display: flex;
            gap: 10px;
            margin: 2px 0;
        }

        .status-label {
            opacity: 0.7;
        }

        .status-value {
            color: #18ffff;
        }

        /* Source/Collector indicators */
        .source-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #ffff00;
            border-radius: 50%;
            margin-right: 5px;
        }

        .collector-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border: 1px solid #00ffff;
            border-radius: 50%;
            margin-right: 5px;
        }

        /* Mode buttons */
        button {
            background: rgba(10, 14, 39, 0.6);
            color: #00e5ff;
            border: 1px solid rgba(0, 229, 255, 0.3);
            padding: 8px 16px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 11px;
            cursor: pointer;
        }

        button:hover {
            background: rgba(0, 229, 255, 0.1);
        }

        button.active {
            background: rgba(0, 229, 255, 0.2);
            border-color: #18ffff;
        }
    </style>
</head>
<body>
    <!-- Main viewport -->
    <div id="workspace">
        <div id="canvas-container"></div>

        <!-- Minimal status -->
        <div id="status">
            <div class="status-row">
                <span class="status-label">JACK:</span>
                <span class="status-value" id="jack-status">OFF</span>
            </div>
            <div class="status-row">
                <span class="source-indicator"></span>
                <span class="status-value" id="source-count">0</span>
                <span class="collector-indicator"></span>
                <span class="status-value" id="collector-count">0</span>
            </div>
        </div>
    </div>

    <!-- Bottom toolbar - imagine-land style -->
    <div id="controls-container">
        <div id="toolbar-toggle">☰</div>

        <!-- Mesh control tile -->
        <div class="control-tile">
            <canvas id="mesh-control" width="80" height="80"></canvas>
        </div>

        <!-- Boundary control tile -->
        <div class="control-tile">
            <canvas id="boundary-control" width="80" height="80"></canvas>
        </div>

        <!-- Mode selector tile -->
        <div class="control-tile" style="min-width: 150px;">
            <div style="display: flex; flex-direction: column; gap: 5px;">
                <button id="source-btn" style="padding: 4px 8px;">Sources</button>
                <button id="collector-btn" style="padding: 4px 8px;">Collectors</button>
            </div>
        </div>

        <!-- JACK control tile -->
        <div class="control-tile">
            <button id="jack-btn">JACK</button>
        </div>

        <!-- Demo mode tile -->
        <div class="control-tile">
            <button id="demo-btn">Demo</button>
        </div>
    </div>

    <!-- Load Three.js and libraries -->
    <script src="three.min.js"></script>
    <script src="OrbitControls.js"></script>
    <script src="membrane-physics-core.js"></script>

    <!-- Load the good oscillator code -->
    <script src="harmonic-oscillator.js"></script>
    <script src="audio-oscillator-coupler.js"></script>

    <script>
        // RMIX - Clean implementation
        class RMIX {
            constructor() {
                this.mode = 'idle'; // 'idle', 'source', 'collector'
                this.sources = [];
                this.collectors = [];
                this.jackConnected = false;
                this.demoMode = false;
                this.meshVisible = false;
                this.meshDensity = 20;
                this.boundaryStiffness = 1.0;

                // Audio
                this.audioContext = null;
                this.audioStream = null;
                this.audioAnalyser = null;
                this.audioDataArray = null;

                // Physics from good membrane-physics-core
                this.membrane = new MembranePhysics({
                    gridSize: 100,
                    membraneSize: 100,
                    waveSpeed: 0.3,
                    damping: 0.00265,
                    boundaryType: 'fixed'
                });

                this.initThreeJS();
                this.initControls();
                this.initMeshControl();
                this.initBoundaryControl();
                this.animate();
            }

            initThreeJS() {
                // Scene
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x0a0e27);

                // Camera
                this.camera = new THREE.PerspectiveCamera(
                    75,
                    window.innerWidth / (window.innerHeight - 120),
                    0.01,
                    5000
                );
                this.camera.position.set(50, 40, 50);
                this.camera.lookAt(0, 0, 0);

                // Renderer
                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                const container = document.getElementById('canvas-container');
                this.renderer.setSize(window.innerWidth, window.innerHeight - 120);
                container.appendChild(this.renderer.domElement);

                // Controls
                this.controls = new THREE.OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enableDamping = true;
                this.controls.dampingFactor = 0.05;

                // Lighting
                const ambientLight = new THREE.AmbientLight(0x1a237e, 0.4);
                this.scene.add(ambientLight);

                const directionalLight = new THREE.DirectionalLight(0x00e5ff, 0.6);
                directionalLight.position.set(100, 100, 50);
                this.scene.add(directionalLight);

                // Create membrane mesh
                this.createMembraneMesh();

                // Raycaster for interaction
                this.raycaster = new THREE.Raycaster();
                this.mouse = new THREE.Vector2();
            }

            createMembraneMesh() {
                const geometry = new THREE.PlaneGeometry(
                    this.membrane.membraneSize,
                    this.membrane.membraneSize,
                    this.membrane.gridSize,
                    this.membrane.gridSize
                );

                // Material with proper colors
                this.material = new THREE.ShaderMaterial({
                    uniforms: {
                        colorNegative: { value: new THREE.Color(0x00ffff) },
                        colorPositive: { value: new THREE.Color(0xff00ff) },
                        waveHeight: { value: 20.0 }
                    },
                    vertexShader: `
                        varying float vHeight;
                        varying vec3 vNormal;
                        void main() {
                            vHeight = position.z;
                            vNormal = normal;
                            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                        }
                    `,
                    fragmentShader: `
                        uniform vec3 colorNegative;
                        uniform vec3 colorPositive;
                        varying float vHeight;
                        varying vec3 vNormal;
                        void main() {
                            float t = (vHeight + 10.0) / 20.0;
                            t = clamp(t, 0.0, 1.0);
                            vec3 color = mix(colorNegative, colorPositive, t);
                            vec3 lightDir = normalize(vec3(1.0, 1.0, 1.0));
                            float diff = max(dot(vNormal, lightDir), 0.0);
                            color *= (0.7 + diff * 0.3);
                            gl_FragColor = vec4(color, 1.0);
                        }
                    `,
                    side: THREE.DoubleSide,
                    wireframe: false
                });

                this.membraneMesh = new THREE.Mesh(geometry, this.material);
                this.membraneMesh.rotation.x = -Math.PI / 2;
                this.scene.add(this.membraneMesh);
            }

            initControls() {
                // Toolbar toggle
                document.getElementById('toolbar-toggle').addEventListener('click', () => {
                    document.getElementById('controls-container').classList.toggle('hidden');
                });

                // Mode buttons
                document.getElementById('source-btn').addEventListener('click', () => {
                    this.setMode(this.mode === 'source' ? 'idle' : 'source');
                });

                document.getElementById('collector-btn').addEventListener('click', () => {
                    this.setMode(this.mode === 'collector' ? 'idle' : 'collector');
                });

                // JACK button
                document.getElementById('jack-btn').addEventListener('click', () => {
                    this.toggleJack();
                });

                // Demo button
                document.getElementById('demo-btn').addEventListener('click', () => {
                    this.demoMode = !this.demoMode;
                    document.getElementById('demo-btn').classList.toggle('active', this.demoMode);
                });

                // Canvas click - add or remove nodes
                this.renderer.domElement.addEventListener('click', (event) => {
                    this.handleCanvasClick(event);
                });

                // Keyboard
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') this.setMode('idle');
                    if (e.key === 's' || e.key === 'S') this.setMode('source');
                    if (e.key === 'c' || e.key === 'C') this.setMode('collector');
                    if (e.key === 'r' || e.key === 'R') this.membrane.reset();
                });

                // Window resize
                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / (window.innerHeight - 120);
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight - 120);
                });
            }

            initMeshControl() {
                const canvas = document.getElementById('mesh-control');
                const ctx = canvas.getContext('2d');

                const drawMesh = () => {
                    ctx.clearRect(0, 0, 80, 80);

                    // Draw grid
                    ctx.strokeStyle = this.meshVisible ? '#00ffff' : 'rgba(0, 255, 255, 0.3)';
                    ctx.lineWidth = 0.5;

                    const gridCount = Math.floor(this.meshDensity / 2.5);
                    const cellSize = 80 / gridCount;

                    for (let i = 0; i <= gridCount; i++) {
                        const pos = i * cellSize;
                        ctx.beginPath();
                        ctx.moveTo(pos, 0);
                        ctx.lineTo(pos, 80);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.moveTo(0, pos);
                        ctx.lineTo(80, pos);
                        ctx.stroke();
                    }

                    // Center dot
                    ctx.fillStyle = '#ff00ff';
                    ctx.beginPath();
                    ctx.arc(40, 40, 2, 0, Math.PI * 2);
                    ctx.fill();
                };

                drawMesh();

                // Click toggles wireframe
                canvas.addEventListener('click', () => {
                    this.meshVisible = !this.meshVisible;
                    this.material.wireframe = this.meshVisible;
                    drawMesh();
                });

                // Drag to adjust density
                let dragging = false;
                let startY = 0;

                canvas.addEventListener('mousedown', (e) => {
                    dragging = true;
                    startY = e.clientY;
                });

                document.addEventListener('mousemove', (e) => {
                    if (dragging) {
                        const delta = startY - e.clientY;
                        this.meshDensity = Math.max(10, Math.min(100, this.meshDensity + delta * 0.5));
                        startY = e.clientY;
                        drawMesh();
                    }
                });

                document.addEventListener('mouseup', () => {
                    dragging = false;
                });
            }

            initBoundaryControl() {
                const canvas = document.getElementById('boundary-control');
                const ctx = canvas.getContext('2d');

                const drawBoundary = () => {
                    ctx.clearRect(0, 0, 80, 80);

                    // Draw square boundary
                    ctx.strokeStyle = '#00e5ff';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(10, 10, 60, 60);

                    // Show stiffness with corner indicators
                    const stiffness = this.boundaryStiffness;
                    ctx.fillStyle = `rgba(0, 229, 255, ${stiffness})`;

                    // Corner dots
                    const corners = [[10, 10], [70, 10], [10, 70], [70, 70]];
                    corners.forEach(([x, y]) => {
                        ctx.beginPath();
                        ctx.arc(x, y, 4, 0, Math.PI * 2);
                        ctx.fill();
                    });
                };

                drawBoundary();

                // Drag to adjust stiffness
                let dragging = false;
                let startY = 0;

                canvas.addEventListener('mousedown', (e) => {
                    dragging = true;
                    startY = e.clientY;
                });

                document.addEventListener('mousemove', (e) => {
                    if (dragging) {
                        const delta = startY - e.clientY;
                        this.boundaryStiffness = Math.max(0, Math.min(1, this.boundaryStiffness + delta * 0.01));
                        this.membrane.boundaryStiffness = this.boundaryStiffness;
                        startY = e.clientY;
                        drawBoundary();
                    }
                });

                document.addEventListener('mouseup', () => {
                    dragging = false;
                });
            }

            setMode(mode) {
                this.mode = mode;
                document.getElementById('source-btn').classList.toggle('active', mode === 'source');
                document.getElementById('collector-btn').classList.toggle('active', mode === 'collector');
            }

            handleCanvasClick(event) {
                // Calculate mouse position
                const rect = this.renderer.domElement.getBoundingClientRect();
                this.mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                this.mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

                this.raycaster.setFromCamera(this.mouse, this.camera);

                // Check if clicking on existing source/collector to remove
                const clickables = [...this.sources, ...this.collectors];
                for (let item of clickables) {
                    if (item.visual) {
                        const intersects = this.raycaster.intersectObject(item.visual);
                        if (intersects.length > 0) {
                            this.removeNode(item);
                            return;
                        }
                    }
                }

                // Otherwise add new node if in placement mode
                if (this.mode !== 'idle') {
                    const intersects = this.raycaster.intersectObject(this.membraneMesh);
                    if (intersects.length > 0) {
                        const point = intersects[0].point;
                        if (this.mode === 'source') {
                            this.addSource(point.x, point.z);
                        } else if (this.mode === 'collector') {
                            this.addCollector(point.x, point.z);
                        }
                    }
                }
            }

            addSource(x, z) {
                const source = {
                    type: 'source',
                    x: x,
                    z: z,
                    gridX: Math.round((x / this.membrane.membraneSize + 0.5) * this.membrane.gridSize),
                    gridY: Math.round((z / this.membrane.membraneSize + 0.5) * this.membrane.gridSize),
                    phase: Math.random() * Math.PI * 2,
                    amplitude: 0
                };

                // Visual - simple sphere
                const geometry = new THREE.SphereGeometry(1.5, 16, 16);
                const material = new THREE.MeshBasicMaterial({
                    color: 0xffff00,
                    transparent: true,
                    opacity: 0.8
                });
                source.visual = new THREE.Mesh(geometry, material);
                source.visual.position.set(x, 2, z);
                this.scene.add(source.visual);

                this.sources.push(source);
                document.getElementById('source-count').textContent = this.sources.length;
            }

            addCollector(x, z) {
                const collector = {
                    type: 'collector',
                    x: x,
                    z: z,
                    gridX: Math.round((x / this.membrane.membraneSize + 0.5) * this.membrane.gridSize),
                    gridY: Math.round((z / this.membrane.membraneSize + 0.5) * this.membrane.gridSize),
                    output: 0
                };

                // Visual - ring
                const geometry = new THREE.RingGeometry(1.5, 2.5, 32);
                const material = new THREE.MeshBasicMaterial({
                    color: 0x00ffff,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.7
                });
                collector.visual = new THREE.Mesh(geometry, material);
                collector.visual.position.set(x, 2, z);
                collector.visual.rotation.x = -Math.PI / 2;
                this.scene.add(collector.visual);

                this.collectors.push(collector);
                document.getElementById('collector-count').textContent = this.collectors.length;
            }

            removeNode(node) {
                if (node.visual) {
                    this.scene.remove(node.visual);
                }

                if (node.type === 'source') {
                    const idx = this.sources.indexOf(node);
                    if (idx > -1) this.sources.splice(idx, 1);
                    document.getElementById('source-count').textContent = this.sources.length;
                } else {
                    const idx = this.collectors.indexOf(node);
                    if (idx > -1) this.collectors.splice(idx, 1);
                    document.getElementById('collector-count').textContent = this.collectors.length;
                }
            }

            async toggleJack() {
                if (!this.jackConnected) {
                    try {
                        const devices = await navigator.mediaDevices.enumerateDevices();
                        const jackDevice = devices.find(d => d.deviceId === 'jack-system-capture');

                        if (!jackDevice) {
                            alert('JACK Bridge extension not detected');
                            return;
                        }

                        this.audioStream = await navigator.mediaDevices.getUserMedia({
                            audio: { deviceId: 'jack-system-capture' }
                        });

                        this.audioContext = new AudioContext();
                        this.audioAnalyser = this.audioContext.createAnalyser();
                        this.audioAnalyser.fftSize = 256;
                        this.audioDataArray = new Uint8Array(this.audioAnalyser.frequencyBinCount);

                        const source = this.audioContext.createMediaStreamSource(this.audioStream);
                        source.connect(this.audioAnalyser);

                        this.jackConnected = true;
                        document.getElementById('jack-status').textContent = 'ON';
                        document.getElementById('jack-btn').classList.add('active');

                    } catch (error) {
                        console.error('Failed to connect to JACK:', error);
                    }
                } else {
                    if (this.audioStream) {
                        this.audioStream.getTracks().forEach(track => track.stop());
                    }
                    if (this.audioContext) {
                        this.audioContext.close();
                    }

                    this.jackConnected = false;
                    document.getElementById('jack-status').textContent = 'OFF';
                    document.getElementById('jack-btn').classList.remove('active');
                }
            }

            updateMembraneMesh() {
                const positions = this.membraneMesh.geometry.attributes.position.array;
                const gridSize = this.membrane.gridSize;

                for (let i = 0; i <= gridSize; i++) {
                    for (let j = 0; j <= gridSize; j++) {
                        const index = (i * (gridSize + 1) + j) * 3 + 2;
                        positions[index] = this.membrane.heights[i][j] * this.material.uniforms.waveHeight.value;
                    }
                }

                this.membraneMesh.geometry.attributes.position.needsUpdate = true;
                this.membraneMesh.geometry.computeVertexNormals();
            }

            applySourcesAndAudio() {
                const time = Date.now() * 0.001;

                // Update audio if connected
                if (this.jackConnected && this.audioAnalyser) {
                    this.audioAnalyser.getByteFrequencyData(this.audioDataArray);
                }

                // Apply sources
                this.sources.forEach(source => {
                    let force = 0;

                    if (this.jackConnected && this.audioDataArray) {
                        // Use audio data
                        let sum = 0;
                        for (let i = 0; i < this.audioDataArray.length; i++) {
                            sum += this.audioDataArray[i];
                        }
                        force = (sum / this.audioDataArray.length / 128 - 1) * 3;
                    } else if (this.demoMode) {
                        // Demo wave
                        force = Math.sin(time * 5 + source.phase) * 2;
                    }

                    // Apply to membrane
                    if (source.gridX >= 0 && source.gridX <= this.membrane.gridSize &&
                        source.gridY >= 0 && source.gridY <= this.membrane.gridSize) {
                        this.membrane.velocities[source.gridX][source.gridY] += force * 0.1;
                    }

                    // Visual feedback
                    if (source.visual) {
                        source.visual.scale.setScalar(1 + Math.abs(force) * 0.2);
                    }
                });

                // Sample collectors
                this.collectors.forEach(collector => {
                    if (collector.gridX >= 0 && collector.gridX <= this.membrane.gridSize &&
                        collector.gridY >= 0 && collector.gridY <= this.membrane.gridSize) {
                        collector.output = this.membrane.heights[collector.gridX][collector.gridY];

                        // Visual feedback
                        if (collector.visual) {
                            collector.visual.position.y = 2 + collector.output * 10;
                        }
                    }
                });
            }

            animate() {
                requestAnimationFrame(() => this.animate());

                // Update physics
                this.applySourcesAndAudio();
                this.membrane.updatePhysics();
                this.updateMembraneMesh();

                // Update controls
                this.controls.update();

                // Render
                this.renderer.render(this.scene, this.camera);
            }
        }

        // Initialize RMIX
        const rmix = new RMIX();
        console.log('RMIX initialized - click to remove nodes, use toolbar controls');
    </script>
</body>
</html>
